<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkillMap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: each subject is a route; topics are stops on a vertical line that fill in as they are learned. */
:root{
  --bg:#f2f4f9; --surface:#ffffff; --ink:#151b2e; --muted:#5b6479; --line:#dbe0ec;
  --accent:#2447d6; --accent-ink:#ffffff; --soft:#e8ecfb;
  --good:#16855a; --bad:#c43636;
  --eng:#0b8a85; --math:#5a3fd0; --phys:#c75f12; --custom:#5d6680; --logic:#a82a74; --bio:#2c7d32; --chem:#806200;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f121b; --surface:#181d2a; --ink:#e9ecf5; --muted:#9aa3b8; --line:#2b3246;
    --accent:#8aa2ff; --accent-ink:#0c1020; --soft:#222a40;
    --good:#4fc48d; --bad:#f07a7a;
    --eng:#3cc7c0; --math:#a892ff; --phys:#f0a05a; --custom:#a3acc4; --logic:#f08cc4; --bio:#7fd27f; --chem:#e0c050;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f121b; --surface:#181d2a; --ink:#e9ecf5; --muted:#9aa3b8; --line:#2b3246;
  --accent:#8aa2ff; --accent-ink:#0c1020; --soft:#222a40;
  --good:#4fc48d; --bad:#f07a7a;
  --eng:#3cc7c0; --math:#a892ff; --phys:#f0a05a; --custom:#a3acc4; --logic:#f08cc4; --bio:#7fd27f; --chem:#e0c050;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-family:var(--display);font-size:1.5rem;font-weight:700}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 64px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:24px}
.logo{font-family:var(--display);font-weight:700;font-size:1.1rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--soft)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
nav button[aria-current="page"]{background:var(--soft);color:var(--accent);font-weight:600}
@media (max-width:480px){nav{gap:2px}nav button{padding:8px 8px;font-size:15px}header.top{gap:8px 16px}}
.stack{display:flex;flex-direction:column;gap:24px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500}
.summary{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.big{font-family:var(--display);font-size:2.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar span{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.subj{text-align:left;display:flex;flex-direction:column;gap:12px;cursor:pointer;border-top:4px solid var(--c)}
.subj:hover{border-color:var(--c)}
.subj .pct{font-variant-numeric:tabular-nums;font-weight:600;color:var(--c)}
.route{list-style:none;margin:0;padding:0;position:relative}
.route::before{content:"";position:absolute;left:11px;top:12px;bottom:12px;width:2px;background:var(--line)}
.stop{position:relative;padding:0 0 12px 40px}
.dot{position:absolute;left:0;top:8px;width:24px;height:24px;border-radius:50%;border:2px solid var(--c);background:var(--surface);cursor:pointer;padding:0;display:grid;place-items:center;color:var(--surface);font-size:.8rem;font-weight:700}
.dot[aria-pressed="true"]{background:var(--c)}
.stop-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:10px;background:none;border:0;width:100%;text-align:left;cursor:pointer}
.stop-head:hover{background:var(--soft)}
.stop.done .stop-title{color:var(--muted)}
.stop-body{padding:8px 12px 12px;display:flex;flex-direction:column;gap:12px;max-width:65ch}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--good)}
form.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.875rem;color:var(--muted)}
.inline label.f,.row label.f{flex:1 1 160px}
input[type=text],input[type=time],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;color:var(--ink)}
textarea{min-height:88px;resize:vertical}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.opt .mark{font-weight:700;margin-right:6px}
.right .mark{color:var(--good)} .wrong .mark{color:var(--bad)}
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.day{padding:14px;display:flex;flex-direction:column;gap:8px}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;font-size:.9rem}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--c,var(--accent));background:var(--surface);cursor:pointer;padding:0;color:var(--surface);font-size:.7rem;font-weight:700;margin-top:2px}
.chk[aria-pressed="true"]{background:var(--c,var(--accent))}
.x{background:none;border:0;color:var(--muted);cursor:pointer;padding:0 4px;font-size:1rem}
.note{white-space:pre-wrap}
.msg{padding:10px 14px;border-radius:10px;background:var(--soft);font-size:.9rem}
.msg.err{color:var(--bad)}
.btn.small{padding:4px 10px;font-size:.875rem}
a{color:var(--accent);font-weight:500;overflow-wrap:anywhere}
ul.ex{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
ul.links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.links li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 12px;border:1px solid var(--line);border-radius:10px}
.why{padding:12px 14px;border-radius:10px;background:var(--soft);border-left:4px solid var(--line);display:flex;flex-direction:column;gap:4px}
.why.good{border-left-color:var(--good)} .why.bad{border-left-color:var(--bad)}
.sec h2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chat{display:flex;flex-direction:column;gap:8px}
.bubble{padding:10px 14px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:92%}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.bubble.ai{align-self:flex-start;background:var(--soft)}
.bubble.err{color:var(--bad)}
.why.tip{border-left-color:var(--c,var(--accent))}
.pill.lv2{color:var(--accent)} .pill.lv3{color:var(--bad)}
p.opt{margin:0;cursor:default}
[hidden]{display:none!important}
.coach{display:flex;gap:12px;align-items:flex-start}
.ava{flex:none;line-height:0}
.say{background:var(--soft);border-radius:4px 14px 14px 14px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;overflow-wrap:anywhere}
.who{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stars{color:var(--phys);letter-spacing:.08em}
.levels{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.lv{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.lv.got{border-color:var(--good)}
.lvh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hist{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.medal{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--soft);border:2px solid var(--c,var(--accent));color:var(--c,var(--accent))}
.qr{background:#fff;padding:12px;border-radius:12px;line-height:0}
.qr img,.qr canvas{max-width:100%}
.link.small{font-size:.8rem}
ol.ex{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.streak .big{color:var(--phys)}
.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.d7{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;color:var(--muted)}
.d7 i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:700;color:var(--surface)}
.d7.on i{background:var(--phys);border-color:var(--phys)}
.d7.ice i{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.d7.now{color:var(--ink);font-weight:600}
.d7.now i{border-color:var(--accent);border-width:3px}
.d7.fut{opacity:.45}
.words{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.word{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.word:first-child{border-top:0;padding-top:0}
.ipa{color:var(--muted);font-family:"Segoe UI","Noto Sans","DejaVu Sans",sans-serif}
.portrait{width:96px;height:96px;border-radius:50%;object-fit:cover;border:2px solid var(--c,var(--accent))}
.lesson-pic{max-width:100%;border-radius:12px;align-self:flex-start}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.vh:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.gallery figure{margin:0;position:relative}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;border:1px solid var(--line)}
.gallery .x{position:absolute;top:4px;right:4px;background:var(--surface);border-radius:50%;width:26px;height:26px;border:1px solid var(--line);color:var(--ink)}
ul.links a{min-width:0}
.lab{width:100%;height:260px;display:block;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.lab-info{font-variant-numeric:tabular-nums;font-weight:500}
.lab-ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
input[type=range]{width:100%;accent-color:var(--accent)}
.quote{margin:0;padding-left:14px;border-left:3px solid var(--line);font-style:italic}
.quote span{font-style:normal;font-size:.875rem}
.pill.lab-pill{color:var(--accent)}
.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.track-btn{display:flex;flex-direction:column;gap:4px;text-align:left;align-items:flex-start;font-weight:400}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.pill.prog-pill{color:var(--accent)}
details.base{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
details.base summary{cursor:pointer;font-weight:600}
.latin{margin:0}
.graph-info{display:flex;flex-direction:column;gap:4px}
.graph-info p{margin:0}
.gdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.kk-tr{border-left:3px solid var(--accent);padding-left:12px}
@media (max-width:480px){.summary{grid-template-columns:1fr}.big{font-size:2rem}}
@media (prefers-reduced-motion:no-preference){.bar span{transition:width .3s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="logo" data-a="go" data-id="home"><i></i>SkillMap</button>
    <nav id="nav" aria-label="Разделы"></nav>
  </header>
  <main id="app"></main>
  <footer class="foot">© 2026 SkillMap</footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
'use strict';

/* ---------- Готовые планы ---------- */
/* Вопрос: [текст, правильный ответ, неправильный, неправильный, объяснение] */
var G='Грамматика',V='Словарь',R='Речь';
var DATA=[
{id:'eng',name:'Английский язык',color:'eng',sections:[
 {title:'A0 · Старт',topics:[
  {id:'eng-a0-tobe',tag:G,title:'Глагол to be: am, is, are',sum:'Глагол to be значит «быть, являться». В настоящем времени у него три формы: I am, he / she / it is, we / you / they are. В русском его часто опускают, в английском — никогда.',
   ex:['I am a student. — Я ученик.','She is from Bishkek. — Она из Бишкека.','They are friends. — Они друзья.'],
   qs:[['He ___ my brother.','is','am','are','С he, she, it используется форма is.'],['We ___ at school.','are','is','am','С we, you, they используется форма are.']]},
  {id:'eng-a0-pronouns',tag:G,title:'Личные местоимения',sum:'Личные местоимения заменяют имена: I — я, you — ты или вы, he — он, she — она, it — оно (предметы и животные), we — мы, they — они. I всегда пишется с большой буквы.',
   ex:['Aibek is tall. He is tall.','Mary and I are friends. We are friends.','The book is new. It is new.'],
   qs:[['Anna is a doctor. ___ is a doctor.','She','He','It','Anna — женское имя, его заменяет she.'],['Tom and Sam are here. ___ are here.','They','We','He','Двое других людей — это they.']]},
  {id:'eng-a0-numbers',tag:V,title:'Числа от 1 до 20',sum:'Числа от 1 до 12 нужно запомнить: one, two, three, four, five, six, seven, eight, nine, ten, eleven, twelve. От 13 до 19 добавляется -teen: thirteen, fourteen, fifteen. Двадцать — twenty.',
   ex:['I have two sisters.','She is fifteen.','There are twelve months in a year.'],
   qs:[['Как по-английски 12?','twelve','twenty','two','Twelve — 12, twenty — 20, two — 2.'],['Как по-английски 15?','fifteen','fifty','five','Fifteen — 15; fifty — это 50.']]},
  {id:'eng-a0-greetings',tag:R,title:'Приветствия и знакомство',sum:'Hello и Hi — «привет». Good morning — доброе утро, Good afternoon — добрый день, Good evening — добрый вечер. При знакомстве говорят My name is… и Nice to meet you. На вопрос How are you? отвечают I\'m fine, thanks.',
   ex:['— Hi! What\'s your name? — My name is Aliya.','— How are you? — I\'m fine, thanks. And you?','Nice to meet you!'],
   qs:[['How are you? — ___','I\'m fine, thanks.','My name is Tom.','Nice to meet you.','How are you? значит «как дела?», на него отвечают о самочувствии.'],['Что говорят утром?','Good morning','Good evening','Good night','Morning — утро. Good night говорят перед сном.']]}
 ]},
 {title:'A1 · Начальный',topics:[
  {id:'eng-present-simple',tag:G,title:'Present Simple',sum:'Регулярные действия и факты. Форма: глагол без изменений, а с he, she, it добавляется -s. Отрицание: do not / does not + глагол.',
   ex:['I play football on Sundays.','He plays chess.','She doesn\'t eat meat.'],
   qs:[['She ___ to school every day.','goes','go','going','С he, she, it к глаголу добавляется -s или -es: goes.'],['They ___ like tea.','don\'t','doesn\'t','isn\'t','С they используется don\'t; doesn\'t — только с he, she, it.']]},
  {id:'eng-articles',tag:G,title:'Артикли a, an, the',sum:'A и an ставятся перед исчисляемым предметом, о котором говорят впервые; an — перед гласным звуком. The — когда предмет известен или единственный в своём роде.',
   ex:['I have a dog. The dog is black.','She is an engineer.','The Moon goes around the Earth.'],
   qs:[['I ate ___ apple and ___ banana.','an, a','a, an','a, a','Apple начинается с гласного звука — an; banana с согласного — a.'],['___ Sun rises in the east.','The','A','An','Солнце единственное в своём роде, поэтому the.']]},
  {id:'eng-questions',tag:G,title:'Вопросительные слова',sum:'Who — кто, what — что, where — где, when — когда, why — почему, how — как. Вопросительное слово стоит в начале вопроса.',
   ex:['Where do you live?','When does the lesson start?','Why are you late?'],
   qs:[['___ do you live? — In Bishkek.','Where','When','Who','Ответ называет место, значит вопрос — where.'],['___ is your birthday? — In May.','When','Where','Who','Ответ называет время, значит вопрос — when.']]},
  {id:'eng-prepositions',tag:G,title:'Предлоги времени in, on, at',sum:'At — точное время (at 7 o\'clock). On — дни и даты (on Monday). In — месяцы, годы, времена года (in May, in 2027).',
   ex:['The lesson starts at 9 o\'clock.','We have maths on Monday.','My birthday is in May.'],
   qs:[['___ Monday','on','in','at','С днями недели используется on.'],['___ 7 o\'clock','at','on','in','С точным временем используется at.']]},
  {id:'eng-a1-family',tag:V,title:'Семья и дом',sum:'Семья: mother — мама, father — папа, sister — сестра, brother — брат, grandmother — бабушка, grandfather — дедушка, parents — родители. Дом: room — комната, kitchen — кухня, bedroom — спальня, bathroom — ванная.',
   ex:['My mother is a teacher.','I have one brother and two sisters.','The kitchen is big.'],
   qs:[['Мама и папа вместе — это:','parents','brothers','grandparents','Parents — родители; grandparents — бабушка и дедушка.'],['Комната, где готовят еду:','kitchen','bedroom','bathroom','Kitchen — кухня, bedroom — спальня, bathroom — ванная.']]}
 ]},
 {title:'A2 · Элементарный',topics:[
  {id:'eng-present-cont',tag:G,title:'Present Continuous',sum:'Действие происходит прямо сейчас. Форма: am / is / are + глагол с окончанием -ing.',
   ex:['I am doing my homework now.','They are playing football.','She isn\'t sleeping.'],
   qs:[['Look! He ___ now.','is running','runs','run','Look! показывает, что действие идёт сейчас: is running.'],['I ___ a book at the moment.','am reading','read','reads','At the moment — сейчас; с I используется am reading.']]},
  {id:'eng-past-simple',tag:G,title:'Past Simple',sum:'Завершённое действие в прошлом. Правильные глаголы получают -ed, у неправильных своя вторая форма. Отрицание: did not + глагол.',
   ex:['We played football yesterday.','She went to the park.','I didn\'t see him.'],
   qs:[['Yesterday we ___ a film.','watched','watch','watching','Yesterday — прошлое; watch — правильный глагол, добавляем -ed.'],['Past Simple глагола go:','went','goed','gone','Go — неправильный глагол: go — went — gone.']]},
  {id:'eng-irregular',tag:V,title:'Неправильные глаголы',sum:'У неправильных глаголов три формы, которые нужно запомнить: write — wrote — written, buy — bought — bought, see — saw — seen.',
   ex:['I wrote a letter yesterday.','She has written three books.','We bought a new car.'],
   qs:[['Третья форма глагола write:','written','wrote','writed','Write — wrote — written; третья форма — written.'],['Past Simple глагола buy:','bought','buyed','brought','Buy — bought — bought. Brought — это форма глагола bring.']]},
  {id:'eng-comparison',tag:G,title:'Степени сравнения',sum:'Короткие прилагательные: big — bigger — the biggest. Длинные: beautiful — more beautiful — the most beautiful. Исключения: good — better — the best, bad — worse — the worst.',
   ex:['My room is bigger than yours.','This is the most interesting book.','Today is better than yesterday.'],
   qs:[['Сравнительная степень слова good:','better','gooder','more good','Good — исключение: good — better — the best.'],['This task is ___ than that one.','easier','more easy','easiest','Easy — короткое слово: y меняется на i, добавляется -er.']]},
  {id:'eng-modals',tag:G,title:'Модальные глаголы can, must, should',sum:'Can — умение или возможность, must — обязанность, should — совет. После модального глагола идёт глагол без to и без -s.',
   ex:['I can swim.','You must wear a seat belt.','You should see a doctor.'],
   qs:[['Совет: You ___ sleep more.','should','can','did','Совет выражает should.'],['She can ___.','swim','swims','to swim','После модального глагола идёт глагол без to и без -s.']]},
  {id:'eng-a2-quantifiers',tag:G,title:'Much, many, some, any',sum:'Many — с тем, что можно посчитать (many books), much — с тем, что посчитать нельзя (much water). Some — в утверждениях, any — в вопросах и отрицаниях.',
   ex:['How many apples do you have?','We don\'t have much time.','I have some money. Do you have any money?'],
   qs:[['How ___ water do you drink?','much','many','any','Воду нельзя посчитать поштучно, поэтому much.'],['I don\'t have ___ questions.','any','some','much','В отрицаниях используется any.']]}
 ]},
 {title:'B1 · Средний',topics:[
  {id:'eng-b1-present-perfect',tag:G,title:'Present Perfect',sum:'Present Perfect связывает прошлое с настоящим: важен результат или опыт, а не время. Форма: have / has + третья форма глагола. Слова-подсказки: already, just, yet, ever, never. Если названо точное время в прошлом (yesterday, in 2020), нужен Past Simple.',
   ex:['I have finished my homework. — Я закончил, оно готово.','She has never been to London.','Have you ever seen snow?'],
   qs:[['I ___ already ___ this film.','have, seen','did, see','has, saw','С I используется have, после него — третья форма seen.'],['Выберите верное предложение.','I went to Osh last year.','I have gone to Osh last year.','I have went to Osh last year.','Last year — точное время в прошлом, поэтому Past Simple.']]},
  {id:'eng-b1-future',tag:G,title:'Будущее: will и be going to',sum:'Will — решение в момент речи, предсказание или обещание. Be going to — заранее принятый план или прогноз по явным признакам.',
   ex:['The phone is ringing. I\'ll answer it.','I\'m going to study physics next year.','Look at those clouds! It\'s going to rain.'],
   qs:[['— We have no bread. — OK, I ___ buy some.','will','am going to','going','Решение принято в момент разговора, поэтому will.'],['I ___ visit my grandparents on Sunday. I have already bought the tickets.','am going to','will','go to','Билеты уже куплены — это заранее принятый план, be going to.']]},
  {id:'eng-b1-conditionals',tag:G,title:'Условные предложения 0 и 1 типа',sum:'Нулевой тип — законы и факты: if + Present Simple, Present Simple. Первый тип — реальное условие в будущем: if + Present Simple, will + глагол. После if will не ставится.',
   ex:['If you heat ice, it melts.','If it rains, we will stay at home.','I will call you if I have time.'],
   qs:[['If it ___ tomorrow, we will stay at home.','rains','will rain','rained','После if в первом типе стоит Present Simple, без will.'],['If you heat water to 100 °C, it ___.','boils','will boiled','boiled','Это закон природы — нулевой тип, Present Simple в обеих частях.']]},
  {id:'eng-b1-phrasal',tag:V,title:'Фразовые глаголы',sum:'Фразовый глагол — глагол с предлогом или наречием, вместе они меняют значение: get up — вставать, look for — искать, give up — сдаваться, turn on / off — включать / выключать, find out — узнавать.',
   ex:['I get up at seven.','She is looking for her keys.','Don\'t give up!'],
   qs:[['I can\'t find my phone. I\'m ___ it.','looking for','looking at','giving up','Look for — искать; look at — смотреть на.'],['Please ___ the light, it\'s dark.','turn on','turn off','find out','Темно, значит свет нужно включить: turn on.']]}
 ]},
 {title:'B2 · Выше среднего',topics:[
  {id:'eng-b2-passive',tag:G,title:'Пассивный залог',sum:'Пассивный залог используют, когда важнее действие, а не тот, кто его совершил. Форма: be в нужном времени + третья форма глагола. Исполнителя добавляют через by.',
   ex:['The letter was written yesterday.','English is spoken in many countries.','The bridge will be built next year.'],
   qs:[['This house ___ in 1990.','was built','built','is build','Действие в прошлом над предметом: was + третья форма built.'],['English ___ all over the world.','is spoken','speaks','is speaking','Язык не говорит сам — на нём говорят: is spoken.']]},
  {id:'eng-b2-conditionals',tag:G,title:'Условные предложения 2 и 3 типа',sum:'Второй тип — нереальное условие сейчас или в будущем: if + Past Simple, would + глагол. Третий тип — нереальное условие в прошлом: if + Past Perfect, would have + третья форма.',
   ex:['If I had a million dollars, I would travel the world.','If I were you, I would apologise.','If she had studied, she would have passed the exam.'],
   qs:[['If I ___ more time, I would learn Chinese.','had','have','would have','Во втором типе после if стоит Past Simple: had.'],['If he had left earlier, he ___ the train.','would have caught','would catch','caught','Нереальное условие в прошлом — третий тип: would have + третья форма.']]},
  {id:'eng-b2-reported',tag:G,title:'Косвенная речь',sum:'При передаче чужих слов время сдвигается на шаг назад: Present Simple → Past Simple, Present Continuous → Past Continuous, will → would, Past Simple → Past Perfect. Меняются местоимения и слова времени: today → that day, tomorrow → the next day.',
   ex:['"I am tired." → He said (that) he was tired.','"I will help you." → She said she would help me.','"We live here." → They said they lived there.'],
   qs:[['"I like coffee." → She said she ___ coffee.','liked','likes','will like','Present Simple сдвигается в Past Simple: liked.'],['"I will call you." → He said he ___ call me.','would','will','had','Will в косвенной речи превращается в would.']]},
  {id:'eng-b2-linking',tag:V,title:'Слова-связки',sum:'Слова-связки показывают логику текста. Противопоставление: however, although, despite. Добавление: moreover, in addition. Следствие: therefore, as a result. После although идёт предложение, после despite — существительное или форма на -ing.',
   ex:['Although it was late, we continued working.','Despite the rain, we went out.','The test was hard. However, I passed it.'],
   qs:[['___ the rain, we went for a walk.','Despite','Although','However','После despite идёт существительное (the rain); после although нужно целое предложение.'],['He studied hard. ___, he passed the exam.','Therefore','However','Although','Вторая фраза — следствие первой, поэтому therefore.']]}
 ]},
 {title:'C1 · Продвинутый',topics:[
  {id:'eng-c1-inversion',tag:G,title:'Инверсия',sum:'После отрицательных и ограничительных слов в начале предложения порядок слов становится вопросительным: Never have I…, Not only did she…, Hardly had we… . Инверсия делает речь более формальной и выразительной.',
   ex:['Never have I seen such a beautiful place.','Not only did he win, but he also set a record.','Hardly had we arrived when it started to rain.'],
   qs:[['Never ___ such a strange story.','have I heard','I have heard','I heard','После never в начале предложения вспомогательный глагол идёт перед подлежащим.'],['Not only ___ late, but he also forgot the documents.','did he arrive','he arrived','he did arrive','После not only нужен вопросительный порядок слов: did he arrive.']]},
  {id:'eng-c1-wish',tag:G,title:'Wish и if only',sum:'Wish и if only выражают сожаление. О настоящем: wish + Past Simple. О прошлом: wish + Past Perfect. О раздражающих чужих привычках: wish + would.',
   ex:['I wish I knew the answer. — Жаль, что я не знаю ответа.','I wish I had studied harder. — Жаль, что я не занимался усерднее.','I wish you would stop interrupting me.'],
   qs:[['I wish I ___ taller. (о настоящем)','were','am','will be','Сожаление о настоящем — wish + Past Simple; для to be используют were.'],['I wish I ___ to the party yesterday.','had gone','went','would go','Сожаление о прошлом — wish + Past Perfect: had gone.']]},
  {id:'eng-c1-collocations',tag:V,title:'Устойчивые сочетания',sum:'Сочетания слов нужно запоминать целиком. Make — создавать, получать результат: make a decision, make a mistake, make progress. Do — выполнять работу или занятие: do homework, do research, do your best. Также: take a risk, pay attention, heavy rain.',
   ex:['She made a difficult decision.','We are doing research on climate.','Pay attention to the details.'],
   qs:[['Everyone can ___ a mistake.','make','do','take','Устойчивое сочетание — make a mistake.'],['Scientists ___ research on this topic.','do','make','pay','Устойчивое сочетание — do research.']]},
  {id:'eng-c1-register',tag:R,title:'Формальный и неформальный стиль',sum:'Формальный стиль — письма, эссе, доклады: без сокращений (do not вместо don\'t), с нейтральной лексикой (assist, require, purchase) и без разговорных слов. Неформальный — друзья и чаты: сокращения, фразовые глаголы, простые слова (help, need, buy).',
   ex:['Формально: I would like to request further information.','Неформально: Can you tell me more?','Формально: We regret to inform you… Неформально: Sorry, but…'],
   qs:[['Какое слово формальнее?','purchase','buy','get','Purchase — формальный синоним buy.'],['Что подходит для официального письма?','I am writing to enquire about the course.','Hey! Tell me about the course.','Wanna know about the course.','В официальном письме нет сокращений и разговорных слов.']]}
 ]}
]},
{id:'math',name:'Математика',color:'math',sections:[
 {title:'Алгебра',topics:[
  {id:'math-linear-eq',title:'Линейные уравнения',sum:'Переносите слагаемые с x в одну сторону, числа — в другую, меняя знак при переносе. Затем делите на коэффициент при x.',
   ex:['5x + 3 = 18 → 5x = 15 → x = 3'],
   qs:[['Решите: 3x − 6 = 9','x = 5','x = 1','x = 3','3x = 9 + 6 = 15, значит x = 5.'],['Решите: 2(x + 1) = 10','x = 4','x = 5','x = 6','x + 1 = 5, значит x = 4.']]},
  {id:'math-quadratic',title:'Квадратные уравнения',sum:'Для ax² + bx + c = 0 дискриминант D = b² − 4ac. Если D > 0, корней два: x = (−b ± √D) / 2a. Если D = 0 — один, если D < 0 — действительных корней нет.',
   ex:['x² − 3x + 2 = 0: D = 9 − 8 = 1, x = (3 ± 1) / 2, то есть x = 1 и x = 2'],
   qs:[['Корни уравнения x² − 5x + 6 = 0:','2 и 3','−2 и −3','1 и 6','D = 25 − 24 = 1; x = (5 ± 1) / 2, то есть 2 и 3.'],['Если D < 0, то уравнение имеет:','ни одного действительного корня','один корень','два корня','Из отрицательного числа нельзя извлечь действительный квадратный корень.']]},
  {id:'math-powers',title:'Свойства степеней',sum:'При умножении степеней с одним основанием показатели складываются, при делении — вычитаются. Любое число, кроме нуля, в нулевой степени равно 1.',
   ex:['3² · 3⁴ = 3⁶ = 729','5⁷ : 5⁵ = 5² = 25'],
   qs:[['2³ · 2² =','32','64','12','2³ · 2² = 2⁵ = 32: показатели складываются.'],['a⁰ при a ≠ 0 равно:','1','0','a','Любое ненулевое число в нулевой степени равно 1.']]}
 ]},
 {title:'Геометрия',topics:[
  {id:'math-pythagoras',title:'Теорема Пифагора',sum:'В прямоугольном треугольнике квадрат гипотенузы равен сумме квадратов катетов: c² = a² + b².',
   ex:['Катеты 6 и 8: c² = 36 + 64 = 100, c = 10'],
   qs:[['Катеты 3 и 4. Гипотенуза равна:','5','7','6','3² + 4² = 9 + 16 = 25, √25 = 5.'],['Гипотенуза 13, один катет 5. Второй катет:','12','8','10','13² − 5² = 169 − 25 = 144, √144 = 12.']]},
  {id:'math-areas',title:'Площади фигур',sum:'Прямоугольник: S = ab. Треугольник: S = ½ · основание · высота. Круг: S = πr².',
   ex:['Прямоугольник 4 × 7: S = 28','Круг радиуса 2: S = 4π ≈ 12,6'],
   qs:[['Площадь треугольника с основанием 10 и высотой 6:','30','60','16','S = ½ · 10 · 6 = 30.'],['Площадь круга радиуса 3:','9π','6π','3π','S = π · 3² = 9π.']]},
  {id:'math-angles',title:'Углы треугольника',sum:'Сумма углов любого треугольника равна 180°. В равностороннем треугольнике все углы равны.',
   ex:['Углы 90° и 30°: третий угол равен 180° − 120° = 60°'],
   qs:[['Два угла треугольника 50° и 60°. Третий угол:','70°','80°','90°','180° − 50° − 60° = 70°.'],['Каждый угол равностороннего треугольника:','60°','45°','90°','180° : 3 = 60°.']]}
 ]},
 {title:'Функции и проценты',topics:[
  {id:'math-linear-fn',title:'Линейная функция',sum:'y = kx + b. Число k задаёт наклон прямой, b — точку, где прямая пересекает ось y.',
   ex:['y = 3x − 1: при x = 2 получаем y = 5; прямая пересекает ось y в точке −1'],
   qs:[['y = 2x + 3. Чему равен y при x = 4?','11','9','14','y = 2 · 4 + 3 = 11.'],['За что отвечает k в y = kx + b?','За наклон прямой','За точку пересечения с осью y','За длину прямой','k — угловой коэффициент: чем он больше, тем круче прямая. За пересечение с осью y отвечает b.']]},
  {id:'math-percent',title:'Проценты',sum:'Один процент — сотая часть числа. Чтобы найти p% от числа, умножьте число на p и разделите на 100.',
   ex:['15% от 200: 200 · 15 / 100 = 30'],
   qs:[['20% от 150 — это:','30','20','35','150 · 20 / 100 = 30.'],['Цена 200 сом выросла на 10%. Новая цена:','220 сом','210 сом','202 сом','10% от 200 — это 20; 200 + 20 = 220.']]},
  {id:'math-proportion',title:'Пропорции',sum:'Если a/b = c/d, то ad = bc. Это правило позволяет найти неизвестный член пропорции.',
   ex:['x / 3 = 10 / 6 → 6x = 30 → x = 5'],
   qs:[['x / 4 = 6 / 8. Найдите x.','3','2','12','8x = 24, значит x = 3.'],['3 тетради стоят 60 сом. Сколько стоят 5 тетрадей?','100 сом','90 сом','120 сом','Одна тетрадь стоит 20 сом; 5 · 20 = 100.']]}
 ]}
]},
{id:'phys',name:'Физика',color:'phys',sections:[
 {title:'Механика',topics:[
  {id:'phys-speed',title:'Скорость и равномерное движение',sum:'Скорость показывает, какой путь тело проходит за единицу времени: v = s / t. Чтобы перевести км/ч в м/с, разделите на 3,6.',
   ex:['Пешеход прошёл 10 км за 2 ч: v = 10 / 2 = 5 км/ч','72 км/ч = 72 / 3,6 = 20 м/с'],
   qs:[['Машина проехала 120 км за 2 ч. Её скорость:','60 км/ч','240 км/ч','30 км/ч','v = 120 / 2 = 60 км/ч.'],['36 км/ч — это:','10 м/с','3,6 м/с','129,6 м/с','36 / 3,6 = 10 м/с.']]},
  {id:'phys-newton',title:'Законы Ньютона',sum:'Второй закон: F = ma. Третий закон: тела действуют друг на друга с силами, равными по модулю и противоположными по направлению.',
   ex:['Тележку массой 5 кг толкают с силой 10 Н: a = F / m = 2 м/с²'],
   qs:[['Масса 2 кг, ускорение 3 м/с². Сила равна:','6 Н','5 Н','1,5 Н','F = 2 · 3 = 6 Н.'],['По третьему закону силы взаимодействия двух тел:','равны по модулю и противоположны по направлению','равны и направлены в одну сторону','всегда разные по модулю','Так формулируется третий закон: действие равно противодействию.']]},
  {id:'phys-energy',title:'Работа и энергия',sum:'Работа: A = F · s. Кинетическая энергия: E = mv² / 2. Потенциальная энергия: E = mgh. Единица — джоуль.',
   ex:['Мяч массой 0,5 кг на высоте 2 м: E = 0,5 · 10 · 2 = 10 Дж (при g ≈ 10 м/с²)'],
   qs:[['Сила 10 Н переместила тело на 5 м. Работа равна:','50 Дж','2 Дж','15 Дж','A = 10 · 5 = 50 Дж.'],['Кинетическая энергия тела массой 2 кг при скорости 3 м/с:','9 Дж','6 Дж','18 Дж','E = 2 · 3² / 2 = 9 Дж.']]}
 ]},
 {title:'Электричество',topics:[
  {id:'phys-ohm',title:'Закон Ома',sum:'Сила тока на участке цепи равна напряжению, делённому на сопротивление: I = U / R.',
   ex:['Лампа: U = 6 В, R = 12 Ом, значит I = 6 / 12 = 0,5 А'],
   qs:[['Напряжение 12 В, сопротивление 4 Ом. Сила тока:','3 А','48 А','8 А','I = 12 / 4 = 3 А.'],['Единица сопротивления:','Ом','Вольт','Ампер','Сопротивление измеряют в омах; вольт — напряжение, ампер — сила тока.']]},
  {id:'phys-circuits',title:'Соединение проводников',sum:'Последовательно: R = R₁ + R₂. Параллельно: 1/R = 1/R₁ + 1/R₂, общее сопротивление меньше каждого из них.',
   ex:['Параллельно 3 Ом и 6 Ом: 1/R = 1/3 + 1/6 = 1/2, R = 2 Ом'],
   qs:[['2 Ом и 3 Ом соединены последовательно. Общее сопротивление:','5 Ом','1,2 Ом','6 Ом','При последовательном соединении сопротивления складываются: 2 + 3 = 5 Ом.'],['Два резистора по 6 Ом соединены параллельно. Общее сопротивление:','3 Ом','12 Ом','6 Ом','1/R = 1/6 + 1/6 = 1/3, значит R = 3 Ом.']]},
  {id:'phys-power',title:'Мощность тока',sum:'Мощность равна произведению напряжения на силу тока: P = U · I. Единица — ватт.',
   ex:['Чайник: U = 220 В, I = 10 А, значит P = 2200 Вт'],
   qs:[['Напряжение 220 В, ток 2 А. Мощность:','440 Вт','110 Вт','222 Вт','P = 220 · 2 = 440 Вт.'],['Единица мощности:','Ватт','Джоуль','Ньютон','Мощность измеряют в ваттах; джоуль — энергия, ньютон — сила.']]}
 ]},
 {title:'Тепло и вещество',topics:[
  {id:'phys-density',title:'Плотность',sum:'Плотность — масса единицы объёма: ρ = m / V. Плотность воды около 1000 кг/м³, или 1 г/см³.',
   ex:['Алюминиевый брусок: m = 2700 кг, V = 1 м³, значит ρ = 2700 кг/м³'],
   qs:[['Масса 500 г, объём 250 см³. Плотность:','2 г/см³','0,5 г/см³','750 г/см³','ρ = 500 / 250 = 2 г/см³.'],['Плотность воды примерно равна:','1000 кг/м³','100 кг/м³','10 000 кг/м³','Литр воды имеет массу около 1 кг, а в кубометре 1000 литров.']]},
  {id:'phys-heat',title:'Количество теплоты',sum:'Q = c · m · Δt, где c — удельная теплоёмкость: сколько теплоты нужно, чтобы нагреть 1 кг вещества на 1 °C.',
   ex:['Нагреть 2 кг воды на 5 °C: Q = 4200 · 2 · 5 = 42 000 Дж'],

['eng',4,{id:'eng-b2-relative',tag:G,title:'Придаточные с who, which, that, whose',sum:'Who — о людях, which — о предметах и животных, that — и о тех, и о других в уточняющих придаточных, whose — «чей», where — о месте. Если придаточное просто добавляет сведения, его выделяют запятыми и that не используют.',

{id:'math-exp-eq',title:'Показательные уравнения',sum:'В показательном уравнении неизвестное стоит в показателе степени. Главный приём: привести обе части к одному основанию и приравнять показатели. Если aˣ = aʸ, то x = y (a > 0, a ≠ 1).',
 ex:['2ˣ = 8 → 2ˣ = 2³ → x = 3','3ˣ⁺¹ = 27 → x + 1 = 3 → x = 2','5ˣ = 1 → x = 0'],tip:'Показательная функция всегда положительна: уравнение 2ˣ = −4 не имеет корней.',
 qs:[['Решите: 2ˣ = 32','x = 5','x = 16','x = 6','32 = 2⁵.'],['Решите: 3ˣ = 1/9','x = −2','x = 2','x = −3','1/9 = 3⁻².'],

{id:'math-derivative',title:'Производная',sum:'Производная показывает скорость изменения функции. Основные правила: (xⁿ)′ = n · xⁿ⁻¹, производная числа равна 0, (kx)′ = k, производная суммы равна сумме производных. Геометрически производная в точке — угловой коэффициент касательной. Если f′(x) > 0, функция возрастает, если f′(x) < 0 — убывает.',
 ex:['(x³)′ = 3x²','(5x² − 4x + 7)′ = 10x − 4','s(t) = t²: скорость v = s′(t) = 2t, при t = 3 скорость равна 6'],tip:'Производная числа равна нулю: (7)′ = 0, а не 7.',
 qs:[['(x⁴)′ =','4x³','x³','4x⁴','Показатель выносится вперёд и уменьшается на 1.'],['(3x² + 2x)′ =','6x + 2','3x + 2','6x','(3x²)′ = 6x, (2x)′ = 2.'],
  ['tf','Производная постоянного числа равна нулю.',true,'Число не меняется, скорость изменения равна нулю.'],['in','f(x) = x² − 6x. При каком x производная равна нулю?',['3','x=3'],'f′(x) = 2x − 6 = 0, x = 3.']]},
{id:'math-integral',title:'Первообразная и интеграл',sum:'Первообразная F(x) — функция, производная которой равна f(x). Для xⁿ первообразная равна xⁿ⁺¹ / (n + 1) + C. Определённый интеграл от a до b равен F(b) − F(a) (формула Ньютона — Лейбница) и даёт площадь под графиком неотрицательной функции.',
 ex:['Первообразная для 2x — это x² + C','∫ от 0 до 3 от x² dx = 3³ / 3 − 0 = 9','Площадь под y = 2x на отрезке от 0 до 2: 2² − 0² = 4'],tip:'Не забывайте + C: первообразных бесконечно много, они отличаются на число.',
 qs:[['Первообразная функции f(x) = 3x²:','x³ + C','6x + C','3x³ + C','(x³)′ = 3x².'],['∫ от 0 до 2 от 2x dx =','4','2','8','F(x) = x²; 2² − 0² = 4.'],
  ['tf','Определённый интеграл неотрицательной функции равен площади под её графиком.',true,'Это геометрический смысл интеграла.'],['in','Вычислите ∫ от 1 до 3 от 2x dx.',['8'],'x² при x = 3 минус x² при x = 1: 9 − 1 = 8.']]},
{id:'math-probability',title:'Комбинаторика и вероятность',sum:'Вероятность события — число благоприятных исходов, делённое на число всех равновозможных исходов: P = m / n. Она всегда от 0 до 1. Число перестановок n предметов: n! = 1 · 2 · … · n. Число способов выбрать k предметов из n без учёта порядка: C = n! / (k!(n − k)!).',
 ex:['Выпадет чётное число на кубике: P = 3/6 = 1/2','Расставить 3 книги на полке: 3! = 6 способов','Выбрать 2 дежурных из 5 человек: 5! / (2! · 3!) = 10 способов'],tip:'Если порядок не важен, считайте сочетания, а не перестановки: пара «Айбек и Алия» та же, что «Алия и Айбек».',
 qs:[['Вероятность выпадения шестёрки на кубике:','1/6','1/2','6','Один благоприятный исход из шести.'],['5! =','120','25','60','1 · 2 · 3 · 4 · 5 = 120.'],
  ['tf','Вероятность события может быть равна 1,5.',false,'Вероятность всегда от 0 до 1.'],['in','Сколькими способами можно выбрать 2 человек из 4, если порядок не важен?',['6'],'4! / (2! · 2!) = 6.']]},
{id:'math-volumes',title:'Объёмы тел',sum:'Прямоугольный параллелепипед: V = abc. Цилиндр: V = πr²h. Конус: V = ⅓ πr²h. Шар: V = 4/3 πr³. Пирамида: V = ⅓ · площадь основания · высота.',
 ex:['Аквариум 5 × 4 × 3 дм: V = 60 дм³ = 60 л','Цилиндр r = 2, h = 5: V = 20π','Конус с теми же r и h: V = 20π / 3 — втрое меньше цилиндра'],tip:'Конус и пирамида занимают ровно треть цилиндра и призмы с тем же основанием и высотой.',
 qs:[['Объём куба с ребром 3:','27','9','18','V = 3³ = 27.'],['Объём цилиндра с r = 1 и h = 4:','4π','8π','π','V = π · 1² · 4.'],
  ['tf','Объём конуса в три раза меньше объёма цилиндра с тем же основанием и высотой.',true,'V конуса = ⅓ πr²h.'],['in','Найдите объём параллелепипеда с рёбрами 2, 5 и 6.',['60'],'2 · 5 · 6 = 60.']]}
],
phys:[
{id:'phys-gravity',title:'Закон всемирного тяготения',sum:'Все тела притягиваются друг к другу. Сила притяжения: F = G · m₁ · m₂ / r², где r — расстояние между центрами тел, G = 6,67 · 10⁻¹¹ Н·м²/кг². У поверхности Земли это сила тяжести F = mg, g ≈ 9,8 м/с².',
 ex:['Расстояние увеличили в 2 раза — сила уменьшилась в 4 раза','Масса одного тела выросла в 3 раза — сила выросла в 3 раза','Сила тяжести для тела 5 кг: F = 5 · 10 = 50 Н (при g ≈ 10 м/с²)'],tip:'Масса тела везде одинакова, а вес зависит от g: на Луне вес примерно в 6 раз меньше.',

{id:'phys-gas',title:'Идеальный газ',sum:'Состояние газа описывают давление p, объём V и абсолютная температура T в кельвинах: T = t + 273. Уравнение Менделеева — Клапейрона: pV = νRT, где ν — количество вещества, R = 8,31 Дж/(моль·К). При постоянной температуре pV = const (закон Бойля — Мариотта), при постоянном давлении V/T = const, при постоянном объёме p/T = const.',
 ex:['Газ сжали вдвое при постоянной температуре — давление выросло вдвое','27 °C = 300 К','Газ в закрытом баллоне нагрели от 300 К до 600 К — давление удвоилось'],tip:'В газовые законы подставляют температуру в кельвинах, а не в градусах Цельсия.',
 qs:[['0 °C — это примерно:','273 К','0 К','100 К','T = t + 273.'],['Объём газа уменьшили в 3 раза при постоянной температуре. Давление:','выросло в 3 раза','уменьшилось в 3 раза','не изменилось','pV = const.'],
  ['tf','При постоянном объёме давление газа растёт с ростом температуры.',true,'p/T = const.'],['in','Переведите 127 °C в кельвины.',['400','400к'],'127 + 273 = 400 К.']]},
{id:'phys-thermo1',title:'Первый закон термодинамики',sum:'Внутреннюю энергию тела можно изменить двумя способами: теплопередачей и работой. Первый закон: Q = ΔU + A — теплота, переданная газу, идёт на изменение его внутренней энергии и на работу, которую газ совершает. Работа газа при постоянном давлении: A = p · ΔV.',
 ex:['Газу передали 500 Дж, он совершил работу 200 Дж: ΔU = 300 Дж','Объём не меняется: A = 0, вся теплота идёт на нагрев','Газ расширился на 0,002 м³ при давлении 100 000 Па: A = 200 Дж'],tip:'Следите за знаками: если работу совершают над газом, A отрицательна, и внутренняя энергия растёт.',
 qs:[['Газу передали 300 Дж, он совершил работу 100 Дж. Изменение внутренней энергии:','200 Дж','400 Дж','100 Дж','ΔU = Q − A = 300 − 100.'],['Объём газа не меняется. Работа газа равна:','0','Q','ΔU','A = pΔV, а ΔV = 0.'],
  ['tf','Первый закон термодинамики — это закон сохранения энергии для тепловых процессов.',true,'Энергия не исчезает: она переходит в работу и внутреннюю энергию.'],['in','Газ расширился на 0,003 м³ при постоянном давлении 200 000 Па. Найдите работу газа в джоулях.',['600','600дж'],'A = 200 000 · 0,003 = 600 Дж.']]},
{id:'phys-emf',title:'Закон Ома для полной цепи',sum:'Источник тока характеризуют ЭДС ε и внутреннее сопротивление r. Ток в цепи: I = ε / (R + r), где R — внешнее сопротивление. Напряжение на внешней цепи U = I · R меньше ЭДС на величину I · r. При коротком замыкании R ≈ 0 и ток максимален: I = ε / r.',
 ex:['ε = 12 В, r = 1 Ом, R = 5 Ом: I = 12 / 6 = 2 А, U = 10 В','ε = 9 В, r = 0,5 Ом, короткое замыкание: I = 18 А'],tip:'Не забывайте внутреннее сопротивление: в знаменателе стоит R + r, а не только R.',
 qs:[['ε = 6 В, r = 1 Ом, R = 2 Ом. Сила тока:','2 А','3 А','6 А','I = 6 / (2 + 1) = 2 А.'],['Чем опасно короткое замыкание?','Ток становится очень большим','Ток исчезает','ЭДС падает до нуля','При R ≈ 0 ток ограничен только малым r.'],
  ['tf','Напряжение на зажимах работающего источника меньше его ЭДС.',true,'Часть напряжения падает на внутреннем сопротивлении.'],['in','ε = 10 В, r = 1 Ом, R = 4 Ом. Найдите напряжение на внешней цепи в вольтах.',['8','8в'],'I = 10 / 5 = 2 А, U = 2 · 4 = 8 В.']]},
{id:'phys-induction',title:'Электромагнитная индукция',sum:'Если магнитный поток через замкнутый контур меняется, в контуре возникает индукционный ток. ЭДС индукции по модулю равна скорости изменения потока: ε = ΔΦ / Δt. Магнитный поток: Φ = B · S, когда поле перпендикулярно контуру. На этом явлении работают генераторы и трансформаторы.',
 ex:['Магнит вдвигают в катушку — стрелка прибора отклоняется; магнит неподвижен — тока нет','Поток изменился на 0,6 Вб за 0,2 с: ε = 3 В'],tip:'Ток вызывает не само магнитное поле, а его изменение: неподвижный магнит в катушке тока не создаёт.',

  ['tf','Неподвижный магнит внутри катушки создаёт в ней постоянный ток.',false,'Поток не меняется — тока нет.'],['in','Поток изменился на 0,9 Вб за 0,3 с. Найдите ЭДС индукции в вольтах.',['3','3в'],'ε = 0,9 / 0,3 = 3 В.']]},
{id:'phys-oscillations',title:'Колебания и маятник',sum:'Колебание — движение, которое повторяется. Период T — время одного полного колебания, частота ν = 1 / T. Период математического маятника: T = 2π√(l / g) — он зависит от длины нити и не зависит от массы груза. Период груза на пружине: T = 2π√(m / k).',
 ex:['Маятник сделал 20 колебаний за 40 с: T = 2 с, ν = 0,5 Гц','Нить удлинили в 4 раза — период вырос в 2 раза'],tip:'Период маятника не зависит от массы груза и при малых отклонениях от размаха колебаний.',

  ['tf','Период математического маятника зависит от массы груза.',false,'В формуле T = 2π√(l / g) массы нет.'],['in','Период колебаний 0,25 с. Найдите частоту в герцах.',['4','4гц'],'ν = 1 / 0,25 = 4 Гц.']]},
{id:'phys-photoeffect',title:'Фотоэффект',sum:'Свет выбивает электроны из металла. Свет состоит из порций — фотонов с энергией E = hν, где h = 6,63 · 10⁻³⁴ Дж·с. Уравнение Эйнштейна: hν = A + Eк — энергия фотона идёт на работу выхода A и кинетическую энергию электрона. Если hν < A, фотоэффекта нет, каким бы ярким ни был свет.',
 ex:['Энергия фотона 5 эВ, работа выхода 3 эВ: электрон вылетает с энергией 2 эВ','Красный свет не выбивает электроны из цинка, а ультрафиолет выбивает'],tip:'Яркость света увеличивает число электронов, но не их энергию: энергия зависит от частоты.',

  ['tf','Если энергия фотона меньше работы выхода, очень яркий свет всё равно выбьет электроны.',false,'Каждый электрон получает энергию одного фотона, и её не хватает.'],['in','Энергия фотона 6 эВ, электрон вылетел с энергией 2 эВ. Найдите работу выхода в эВ.',['4','4эв'],'A = 6 − 2 = 4 эВ.']]},

 how:'Теория вероятностей началась с переписки Ферма и Блеза Паскаля в 1654 году. Игрок шевалье де Мере спросил Паскаля, как справедливо разделить ставку, если игру прервали раньше времени. Решая эту задачу в письмах, учёные заложили основы подсчёта шансов.'},

 ex:['270° = 3π/2 радиан','Угол π: точка (−1; 0), значит cos π = −1, sin π = 0','sin 150° = sin 30° = 1/2, cos 150° = −cos 30° = −√3/2'],tip:'Чтобы перевести градусы в радианы, умножьте на π/180; обратно — на 180/π.',

{id:'math-trig-formulas',title:'Тангенс, котангенс и основные формулы',sum:'tg α = sin α / cos α, ctg α = cos α / sin α, поэтому tg α · ctg α = 1. Основное тождество: sin² α + cos² α = 1. Из него следует 1 + tg² α = 1 / cos² α. Формулы двойного угла: sin 2α = 2 sin α cos α, cos 2α = cos² α − sin² α. Формула сложения: sin(α + β) = sin α cos β + cos α sin β.',

{id:'math-arc',title:'Арксинус, арккосинус, арктангенс',sum:'Обратные функции отвечают на вопрос «какой это угол?». arcsin a — угол от −π/2 до π/2, синус которого равен a. arccos a — угол от 0 до π, косинус которого равен a. Оба определены только при −1 ≤ a ≤ 1. arctg a — угол между −π/2 и π/2, тангенс которого равен a; он определён для любого a. arcctg a — угол между 0 и π с котангенсом a.',

{id:'logic',name:'Логика',color:'logic',sections:[
 {title:'Основы логики',topics:[
  {id:'logic-statements',title:'Высказывания и отрицание',sum:'Высказывание — предложение, о котором можно сказать, истинно оно или ложно. Отрицание «не A» истинно, когда A ложно. Отрицание «все…» — это «не все…», то есть «хотя бы один не…». Отрицание «существует…» — это «ни один не…».',
   ex:['«7 — простое число» — истинное высказывание','«Который час?» — не высказывание','Отрицание «все кошки серые» — «есть хотя бы одна несерая кошка»'],tip:'Отрицание «все ученики пришли» — не «никто не пришёл», а «кто-то не пришёл».',
   hist:{who:'Аристотель',years:'384–322 до н. э.',bio:'Греческий философ, ученик Платона и учитель Александра Македонского.',how:'Аристотель первым описал правила верного рассуждения как отдельную науку. Он разобрал силлогизмы — выводы из двух посылок вроде «все люди смертны, Сократ — человек, значит, Сократ смертен». Его логические сочинения позже объединили под названием «Органон», и по ним учились около двух тысяч лет.'},

  {id:'logic-and-or',title:'И, ИЛИ, таблицы истинности',sum:'«A и B» (конъюнкция) истинно, только когда истинны оба. «A или B» (дизъюнкция) истинно, когда истинно хотя бы одно; в логике «или» не исключает случая, когда верны оба. Таблица истинности перечисляет все сочетания значений.',
   ex:['«2 < 3 и 5 < 4» — ложно: второе ложно','«2 < 3 или 5 < 4» — истинно: первое истинно','Для двух высказываний в таблице 4 строки, для трёх — 8'],tip:'Законы де Моргана: «не (A и B)» — это «не A или не B»; «не (A или B)» — это «не A и не B».',

  {id:'logic-implication',title:'Если… то…',sum:'«Если A, то B» (импликация) ложно только в одном случае: A истинно, а B ложно. При ложном A импликация считается истинной. Обратное утверждение «если B, то A» не обязано быть верным. А вот «если не B, то не A» (контрапозиция) равносильно исходному.',

{id:'bio-blood',title:'Кровь и кровообращение',sum:'Кровь состоит из плазмы и клеток. Эритроциты переносят кислород с помощью гемоглобина, лейкоциты защищают от микробов, тромбоциты свёртывают кровь. Сердце человека четырёхкамерное: два предсердия и два желудочка. Большой круг несёт кровь от левого желудочка ко всем органам, малый — от правого желудочка к лёгким. Артерии несут кровь от сердца, вены — к сердцу.',

{id:'bio-dna',title:'ДНК и синтез белка',sum:'ДНК — двойная спираль из нуклеотидов четырёх видов: А, Т, Г, Ц. Цепи соединены по правилу комплементарности: А — с Т, Г — с Ц. Ген — участок ДНК, кодирующий белок. Сначала по гену строится иРНК (транскрипция; в РНК вместо Т стоит У), затем рибосома по иРНК собирает белок (трансляция). Три нуклеотида — кодон — кодируют одну аминокислоту.',

{id:'bio-mitosis',title:'Митоз и мейоз',sum:'Митоз — деление, при котором из одной клетки получаются две с таким же набором хромосом. Так растёт организм и заживают раны. Мейоз — два деления подряд, после которых получаются четыре клетки с половинным набором: так образуются половые клетки. При оплодотворении наборы складываются. У человека в клетках тела 46 хромосом, в половых — 23.',

{id:'chem-acids',title:'Кислоты, основания и соли',sum:'Кислоты в растворе дают ионы H⁺ (HCl, H₂SO₄), основания — ионы OH⁻ (NaOH, Ca(OH)₂). Кислота и основание нейтрализуют друг друга, образуя соль и воду: HCl + NaOH → NaCl + H₂O. Кислотность измеряют по шкале pH: меньше 7 — кислая среда, 7 — нейтральная, больше 7 — щелочная. Индикаторы меняют цвет: лакмус в кислоте красный, в щёлочи синий.',

  ['tf','Для прорастания семенам нужны вода, воздух и тепло.',true,'Без любого из этих условий семя не прорастёт.'],['in','Как называется часть семени, из которой вырастает новое растение?',['зародыш'],'Зародыш — будущее растение.']]},
{id:'bio-digestion',g:8,title:'Пищеварение',sum:'Пища проходит рот, пищевод, желудок, тонкий и толстый кишечник. Во рту её измельчают зубы, а слюна начинает расщеплять крахмал. В желудке сок с соляной кислотой расщепляет белки. В тонком кишечнике пищеварение завершается, и питательные вещества всасываются в кровь через ворсинки. В толстом кишечнике всасывается вода. Печень вырабатывает желчь, которая помогает переваривать жиры.',
 ex:['Если долго жевать хлеб, он становится сладковатым: крахмал расщепляется до сахаров','Ворсинки увеличивают поверхность кишечника во много раз'],tip:'Основное всасывание идёт не в желудке, а в тонком кишечнике.',
 hist:{who:'Иван Павлов',years:'1849–1936',bio:'Русский физиолог, лауреат Нобелевской премии 1904 года за работы по пищеварению.',how:'Павлов изучал работу пищеварительных желёз на собаках, наблюдая, когда и сколько сока выделяется. Он заметил, что слюна появляется не только на еду, но и на сигнал, который с ней связан, — например, на шаги человека, который обычно кормит. Так он открыл условные рефлексы.'},
 qs:[['Где начинается расщепление крахмала?','Во рту','В желудке','В толстом кишечнике','Фермент слюны расщепляет крахмал.'],['Где всасывается большая часть питательных веществ?','В тонком кишечнике','В желудке','В пищеводе','Через ворсинки тонкого кишечника.'],
  ['tf','Желчь вырабатывается в желудке.',false,'Желчь вырабатывает печень.'],['in','Какой орган вырабатывает желчь?',['печень'],'Желчь помогает переваривать жиры.']]},
{id:'bio-breathing',g:8,title:'Дыхание человека',sum:'Воздух проходит через нос, гортань, трахею и бронхи в лёгкие. Лёгкие состоят из миллионов пузырьков — альвеол, оплетённых капиллярами. В альвеолах кислород переходит в кровь, а углекислый газ — из крови в воздух. Вдох происходит, когда диафрагма и межрёберные мышцы сокращаются и грудная клетка расширяется. Во вдыхаемом воздухе около 21% кислорода, в выдыхаемом — около 16%.',
 ex:['При беге дыхание учащается: мышцам нужно больше кислорода','Нос согревает, увлажняет и очищает воздух'],tip:'Лёгкие сами не сокращаются: у них нет мышц, их растягивают диафрагма и грудная клетка.',
 qs:[['Где происходит газообмен в лёгких?','В альвеолах','В трахее','В гортани','Альвеолы оплетены капиллярами.'],['Какая мышца главная при вдохе?','Диафрагма','Бицепс','Сердце','Сокращаясь, она опускается и увеличивает объём грудной клетки.'],
  ['tf','В выдыхаемом воздухе совсем нет кислорода.',false,'Его около 16%.'],['in','Сколько примерно процентов кислорода во вдыхаемом воздухе?',['21','21%'],'Остальное — в основном азот.']]},
{id:'bio-nervous',g:8,title:'Нервная система и рефлексы',sum:'Нервная система состоит из центральной (головной и спинной мозг) и периферической (нервы). Её клетки — нейроны — передают сигналы. Рефлекс — ответ организма на раздражение при участии нервной системы. Безусловные рефлексы врождённые (отдёргивание руки, мигание), условные вырабатываются в течение жизни. Путь сигнала называют рефлекторной дугой: рецептор, чувствительный нейрон, мозг, двигательный нейрон, мышца.',
 ex:['Коленный рефлекс замыкается в спинном мозге','Слюна при виде лимона — условный рефлекс'],tip:'Отдёрнуть руку от горячего мы успеваем раньше, чем почувствуем боль: рефлекс замыкается в спинном мозге.',
 qs:[['Как называется нервная клетка?','Нейрон','Эритроцит','Альвеола','Нейроны передают нервные импульсы.'],['Какой рефлекс врождённый?','Отдёргивание руки от горячего','Умение писать','Реакция на звонок с урока','Безусловные рефлексы не требуют обучения.'],
  ['tf','Условные рефлексы одинаковы у всех людей с рождения.',false,'Они вырабатываются в течение жизни, у каждого свои.'],['in','Какой мозг находится в позвоночнике? Ответьте одним словом.',['спинной'],'Спинной мозг лежит в позвоночном канале.']]},
{id:'bio-skeleton',g:8,title:'Скелет и мышцы',sum:'Скелет взрослого человека состоит примерно из 206 костей. Он служит опорой, защищает органы (череп — мозг, рёбра — сердце и лёгкие) и вместе с мышцами обеспечивает движение. Кости соединяются неподвижно (швы черепа), полуподвижно (позвонки) и подвижно (суставы). Мышцы прикрепляются к костям сухожилиями и работают парами: одна сгибает, другая разгибает.',
 ex:['Бицепс сгибает руку в локте, трицепс разгибает','Коленный и плечевой суставы — подвижные соединения'],tip:'Мышца может только тянуть, а не толкать — поэтому для обратного движения нужна мышца-напарник.',
 qs:[['Что защищает головной мозг?','Череп','Рёбра','Таз','Кости черепа соединены неподвижно.'],['Как называется подвижное соединение костей?','Сустав','Шов','Сухожилие','Суставы позволяют костям двигаться.'],
  ['tf','Мышцы прикрепляются к костям сухожилиями.',true,'Сухожилия прочные и почти не растягиваются.'],['in','Какая мышца разгибает руку в локте?',['трицепс'],'Бицепс сгибает, трицепс разгибает.']]},
{id:'bio-immunity',g:8,title:'Иммунитет и прививки',sum:'Иммунитет — способность организма защищаться от микробов и чужеродных веществ. Лейкоциты поглощают микробов (фагоцитоз) и вырабатывают антитела, которые их обезвреживают. После болезни остаются клетки памяти, поэтому многими болезнями второй раз не болеют. Прививка содержит ослабленные или убитые микробы либо их части: организм вырабатывает защиту, не болея.',
 ex:['После ветрянки обычно остаётся иммунитет на всю жизнь','Вакцина от кори защищает на многие годы'],tip:'Вакцина — это профилактика заранее, а не лекарство для уже заболевшего.',
 hist:{who:'Эдвард Дженнер',years:'1749–1823',bio:'Английский сельский врач.',how:'Дженнер заметил, что доярки, переболевшие лёгкой коровьей оспой, не заболевают опасной натуральной оспой. В 1796 году он привил мальчику коровью оспу, и тот оказался защищён. Слово «вакцина» происходит от латинского vacca — «корова». В 1980 году оспу объявили полностью побеждённой.'},
 qs:[['Какие клетки крови защищают от микробов?','Лейкоциты','Эритроциты','Тромбоциты','Лейкоциты поглощают микробов и вырабатывают антитела.'],['Что содержит вакцина?','Ослабленные или убитые микробы либо их части','Антибиотик','Витамины','Организм учится распознавать микроб без болезни.'],
  ['tf','Антитела вырабатываются в ответ на чужеродные вещества.',true,'Каждое антитело подходит к своему «чужаку».'],['in','Как называется поглощение микробов лейкоцитами?',['фагоцитоз'],'Фагоцитоз открыл Илья Мечников.']]},
{id:'bio-organic',g:10,title:'Белки, жиры, углеводы',sum:'Клетка построена из органических веществ. Белки состоят из аминокислот; они строят клетку, ускоряют реакции (ферменты), переносят вещества и защищают. Углеводы (глюкоза, крахмал) — главный источник энергии. Жиры — запас энергии, теплоизоляция и основа мембран. Нуклеиновые кислоты (ДНК и РНК) хранят и передают наследственную информацию. Из 1 г жира выделяется примерно вдвое больше энергии, чем из 1 г углеводов или белков.',
 ex:['Гемоглобин и ферменты — белки','Крахмал в картофеле и гликоген в печени — запасные углеводы'],tip:'Ферменты — это белки: при сильном нагреве они разрушаются и перестают работать.',
 qs:[['Из чего состоят белки?','Из аминокислот','Из глюкозы','Из жирных кислот','Белок — цепочка аминокислот.'],['Какие вещества — главный источник энергии для клетки?','Углеводы','Вода','Минеральные соли','Глюкоза расщепляется первой.'],
  ['tf','Ферменты — это углеводы.',false,'Ферменты — белки.'],['in','Какое вещество хранит наследственную информацию? Напишите сокращённо.',['днк'],'ДНК — дезоксирибонуклеиновая кислота.']]},
{id:'bio-biosphere',g:11,title:'Биосфера и круговорот веществ',sum:'Биосфера — оболочка Земли, населённая живыми организмами: нижняя часть атмосферы, вся гидросфера и верхняя часть литосферы. Вещества в ней движутся по кругу. Углерод: растения поглощают CO₂ при фотосинтезе, все организмы возвращают его при дыхании, он выделяется также при горении и разложении. Сжигание угля, нефти и газа добавляет в атмосферу CO₂ и усиливает парниковый эффект.',
 ex:['Лес поглощает углекислый газ и выделяет кислород','Озоновый слой задерживает ультрафиолет'],tip:'Энергия в биосфере не движется по кругу: она приходит от Солнца и рассеивается как тепло. По кругу движутся вещества.',
 hist:{who:'Владимир Вернадский',years:'1863–1945',bio:'Русский и советский учёный, геохимик.',how:'В книге «Биосфера» (1926) Вернадский показал, что живые организмы — не просто жильцы планеты, а сила, которая меняет её облик: создаёт кислород атмосферы, почву, залежи известняка и угля.'},
 qs:[['Какой процесс забирает углекислый газ из атмосферы?','Фотосинтез','Дыхание','Горение','Растения используют CO₂ для создания глюкозы.'],['Что усиливает парниковый эффект?','Сжигание угля, нефти и газа','Посадка лесов','Фотосинтез','При сжигании топлива выделяется CO₂.'],
  ['tf','Энергия в биосфере, как и вещества, движется по замкнутому кругу.',false,'Энергия приходит от Солнца и рассеивается как тепло.'],['in','Какой слой атмосферы задерживает ультрафиолетовые лучи? Ответьте одним словом.',['озоновый'],'Озоновый слой находится в стратосфере.']]}
],
chem:[
{id:'chem-elements',g:7,title:'Простые и сложные вещества',sum:'Химический элемент — вид атомов с одинаковым зарядом ядра. У каждого свой знак: H — водород, O — кислород, C — углерод, N — азот, Na — натрий, Fe — железо, Cu — медь. Простое вещество состоит из атомов одного элемента (O₂, Fe), сложное — из атомов разных элементов (H₂O, CO₂). Один элемент может образовывать несколько простых веществ: кислород O₂ и озон O₃, алмаз и графит.',
 ex:['Fe — простое вещество, FeS — сложное','Алмаз и графит состоят из одного элемента — углерода'],tip:'Не путайте элемент и простое вещество: «кислород в составе воды» — это элемент, «кислородом дышат» — простое вещество O₂.',
 qs:[['Знак какого элемента — Fe?','Железо','Фтор','Фосфор','Fe — от латинского ferrum.'],['Какое вещество простое?','O₂','H₂O','CO₂','Оно состоит из атомов одного элемента.'],
  ['tf','Алмаз и графит состоят из атомов одного элемента.',true,'Оба — углерод, но с разным строением.'],['in','Напишите химический знак натрия.',['na'],'Na — от латинского natrium.']]},
{id:'chem-formulas',g:7,title:'Формулы и валентность',sum:'Формула показывает, какие атомы и в каком числе входят в вещество: в H₂O два атома водорода и один кислорода. Индекс относится к атому слева от него. Валентность — число связей, которые образует атом: у водорода I, у кислорода II. В формуле из двух элементов произведения валентности на индекс равны. Относительная молекулярная масса — сумма атомных масс всех атомов.',
 ex:['Al (III) и O (II): общее кратное 6, формула Al₂O₃','Mr(CO₂) = 12 + 2 · 16 = 44','В H₂SO₄ семь атомов: 2 + 1 + 4'],tip:'Коэффициент перед формулой — число молекул, индекс внутри — число атомов: 2H₂O — это две молекулы воды.',
 qs:[['Сколько атомов кислорода в молекуле H₂SO₄?','4','2','1','Индекс 4 стоит после O.'],['Формула оксида алюминия (Al — III, O — II):','Al₂O₃','AlO','Al₃O₂','2 · III = 3 · II.'],
  ['tf','В записи 3H₂O цифра 3 означает три молекулы воды.',true,'Это коэффициент.'],['in','Найдите относительную молекулярную массу воды (H = 1, O = 16).',['18'],'2 · 1 + 16 = 18.']]},
{id:'chem-oxides',g:8,title:'Оксиды',sum:'Оксид — соединение элемента с кислородом. Основные оксиды образованы металлами (Na₂O, CaO): с водой дают основания, с кислотами — соль и воду. Кислотные оксиды образованы неметаллами (CO₂, SO₃): с водой дают кислоты, со щелочами — соль и воду. Амфотерные оксиды (Al₂O₃, ZnO) реагируют и с кислотами, и со щелочами.',
 ex:['CaO + H₂O → Ca(OH)₂ — гашение извести','SO₃ + H₂O → H₂SO₄','CO₂ + 2NaOH → Na₂CO₃ + H₂O'],tip:'Не все оксиды реагируют с водой: песок SiO₂ — кислотный оксид, но в воде не растворяется.',
 qs:[['Какой оксид основный?','CaO','CO₂','SO₃','Он образован металлом.'],['Что образуется при реакции SO₃ с водой?','Кислота','Основание','Соль','SO₃ + H₂O → H₂SO₄.'],
  ['tf','CO₂ — кислотный оксид.',true,'С водой он даёт угольную кислоту.'],['in','Напишите формулу оксида кальция.',['cao'],'Кальций и кислород оба двухвалентны.']]},
{id:'chem-calc',g:8,title:'Расчёты по уравнениям реакций',sum:'Коэффициенты в уравнении показывают, в каких количествах (в молях) реагируют вещества. План расчёта: записать уравнение, перевести массу известного вещества в моли (n = m / M), по коэффициентам найти моли искомого вещества, перевести их в массу (m = n · M) или в объём газа (V = n · 22,4 л).',
 ex:['2H₂ + O₂ → 2H₂O: из 2 моль водорода получается 2 моль воды','4 г H₂ — это 2 моль; воды получится 2 моль, то есть 36 г'],tip:'Сравнивать по коэффициентам можно только моли, но не граммы.',
 qs:[['2H₂ + O₂ → 2H₂O. Сколько молей воды получится из 4 моль водорода?','4','2','8','Коэффициенты у H₂ и H₂O одинаковые.'],['C + O₂ → CO₂. Сколько молей кислорода нужно для сжигания 3 моль углерода?','3','6','1,5','Соотношение 1 : 1.'],
  ['tf','По коэффициентам уравнения можно напрямую сравнивать массы веществ в граммах.',false,'Коэффициенты показывают соотношение молей.'],['in','C + O₂ → CO₂. Сколько граммов CO₂ получится из 12 г углерода? (C = 12, O = 16)',['44','44г'],'12 г — это 1 моль C; получится 1 моль CO₂, то есть 44 г.']]},
{id:'chem-dissociation',g:9,title:'Электролитическая диссоциация',sum:'Электролиты — вещества, растворы которых проводят ток: кислоты, щёлочи, соли. В воде они распадаются на ионы: NaCl → Na⁺ + Cl⁻. Катионы заряжены положительно, анионы — отрицательно. Реакции обмена в растворах идут до конца, если образуется осадок, газ или вода. Сокращённое ионное уравнение показывает только те ионы, которые действительно реагируют.',
 ex:['HCl → H⁺ + Cl⁻','AgNO₃ + NaCl → AgCl↓ + NaNO₃; кратко: Ag⁺ + Cl⁻ → AgCl↓','Нейтрализация: H⁺ + OH⁻ → H₂O'],tip:'Сахар растворяется, но ток не проводит: он не распадается на ионы, это неэлектролит.',
 hist:{who:'Сванте Аррениус',years:'1859–1927',bio:'Шведский физик и химик, лауреат Нобелевской премии по химии 1903 года.',how:'В диссертации 1884 года Аррениус предположил, что соли, кислоты и щёлочи в воде сами распадаются на заряженные частицы — ионы, даже без электрического тока. Идею встретили с недоверием и оценили диссертацию низко, но через девятнадцать лет за неё дали Нобелевскую премию.'},
 qs:[['На какие ионы распадается NaCl?','Na⁺ и Cl⁻','Na⁻ и Cl⁺','Na и Cl₂','Металл даёт катион, кислотный остаток — анион.'],['Что из этого неэлектролит?','Сахар','Поваренная соль','Соляная кислота','Молекулы сахара не распадаются на ионы.'],
  ['tf','Катионы заряжены положительно.',true,'Анионы — отрицательно.'],['in','Какое вещество образуется в реакции H⁺ + OH⁻? Напишите формулу.',['h2o','h₂o'],'Это суть реакции нейтрализации.']]},
{id:'chem-metals',g:9,title:'Металлы и ряд активности',sum:'Атомы металлов легко отдают внешние электроны, поэтому металлы — восстановители. Общие свойства: блеск, тепло- и электропроводность, ковкость. Ряд активности: K, Ca, Na, Mg, Al, Zn, Fe, Pb, (H), Cu, Ag, Au. Металлы левее водорода вытесняют его из кислот. Более активный металл вытесняет менее активный из раствора его соли. Коррозия — разрушение металла под действием среды.',

{id:'chem-alcohols',g:10,title:'Спирты и карбоновые кислоты',sum:'Спирты содержат группу –OH: метанол CH₃OH, этанол C₂H₅OH. Карбоновые кислоты содержат группу –COOH: уксусная кислота CH₃COOH, муравьиная HCOOH. Кислоты меняют цвет индикаторов и реагируют с металлами и щелочами. Спирт и кислота образуют сложный эфир и воду — это реакция этерификации; сложные эфиры придают запах фруктам.',

{id:'chem-polymers',g:10,title:'Полимеры',sum:'Полимер — вещество из очень длинных молекул, собранных из повторяющихся звеньев. Исходное вещество называют мономером: из этилена получают полиэтилен. Природные полимеры — крахмал, целлюлоза, белки, ДНК. Синтетические — полиэтилен, полипропилен, капрон. Число звеньев в цепи называют степенью полимеризации.',

{id:'chem-thermo',g:11,title:'Тепловой эффект реакции',sum:'Реакции с выделением теплоты называют экзотермическими (горение, нейтрализация), с поглощением — эндотермическими (разложение известняка). Тепловой эффект Q записывают в термохимическом уравнении и измеряют в кДж. Он пропорционален количеству вещества: вдвое больше вещества — вдвое больше теплоты.',

{id:'logic-necessary',title:'Необходимое и достаточное условие',sum:'Если из A следует B, то A — достаточное условие для B, а B — необходимое условие для A. Достаточного условия хватает одного. Без необходимого никак, но его одного может не хватить. Условие, которое и необходимо, и достаточно, — это «тогда и только тогда».',

{id:'logic-fallacies',title:'Логические ошибки',sum:'Частые ошибки в рассуждениях. «После — значит вследствие»: два события подряд ещё не причина и следствие. Поспешное обобщение: вывод обо всех по нескольким случаям. Порочный круг: вывод опирается сам на себя. Переход на личности: критикуют человека вместо довода. Ложная дилемма: предлагают два варианта, хотя их больше.',

{id:'logic-contradiction',title:'Доказательство от противного',sum:'Чтобы доказать утверждение, предполагают, что оно неверно, и выводят из этого следствия. Если получается противоречие — с условием или с известным фактом, — предположение было ложным, значит, утверждение верно.',

{id:'logic-induction',title:'Индукция и дедукция',sum:'Дедукция — вывод от общего правила к частному случаю; если посылки верны, вывод верен наверняка. Индукция — обобщение от частных случаев к правилу; вывод правдоподобен, но не гарантирован. Наука сочетает оба пути: гипотезу находят индукцией, а следствия из неё выводят дедукцией и проверяют опытом.',
 ex:['Дедукция: все металлы расширяются при нагреве; рельс металлический; значит, он расширится','Индукция: медь, железо и алюминий проводят ток — вероятно, проводят все металлы'],tip:'Индуктивный вывод может рухнуть от одного нового случая, дедуктивный — нет.',

{id:'logic-counterexample',title:'Контрпример',sum:'Контрпример — пример, который опровергает общее утверждение. Чтобы опровергнуть «для всех…», достаточно одного контрпримера. Чтобы доказать «для всех…», примеров недостаточно — нужно рассуждение. Контрпримеры удобно искать на границах: ноль, единица, отрицательные и дробные числа, равные значения.',

{id:'logic-weighing',title:'Взвешивания',sum:'В задачах на поиск фальшивой монеты чашечные весы без гирь дают три исхода: перевесила левая чаша, правая или равновесие. Поэтому одно взвешивание различает до 3 вариантов, два — до 9, три — до 27. Приём: делить монеты на три равные кучки и сравнивать две из них.',
 ex:['3 монеты, одна легче: кладём по одной на чаши. Равновесие — фальшивая третья, иначе та, что легче','9 монет: кучки по 3; первое взвешивание находит кучку, второе — монету'],tip:'Делите на три кучки, а не на две: весы умеют показывать ещё и равновесие.',
 qs:[['Сколько исходов у одного взвешивания на чашечных весах?','3','2','1','Левая чаша, правая или равновесие.'],['Из 9 монет одна легче. За сколько взвешиваний её наверняка найти?','2','3','4','9 = 3 · 3.'],
  ['tf','Из 3 монет лёгкую фальшивую можно найти за одно взвешивание.',true,'Сравниваем две: равновесие укажет на третью.'],['in','Из 27 монет одна легче остальных. Сколько взвешиваний достаточно?',['3'],'27 = 3 · 3 · 3.']]},
{id:'logic-pouring',title:'Переливания',sum:'Есть сосуды без делений, нужно отмерить заданный объём. Разрешено наполнять сосуд доверху, выливать полностью и переливать из одного в другой, пока первый не опустеет или второй не наполнится. Удобно записывать состояние сосудов после каждого шага.',
 ex:['Сосуды 3 л и 5 л, нужно 4 л: наполнить 5; перелить в 3 (осталось 2); вылить 3; перелить 2 в трёхлитровый; наполнить 5; долить в трёхлитровый 1 л — в пятилитровом осталось 4 л'],tip:'Отмерить можно только объёмы, кратные наибольшему общему делителю вместимостей: сосудами 4 л и 6 л не получить 3 л.',
 qs:[['Сосуды 3 л и 5 л. Наполнили 5 л и перелили в 3 л до края. Сколько осталось в пятилитровом?','2 л','3 л','5 л','5 − 3 = 2.'],['Можно ли сосудами 4 л и 6 л отмерить ровно 3 л?','Нельзя','Можно за 2 шага','Можно за 4 шага','Все получаемые объёмы чётные.'],
  ['tf','Сосудами 3 л и 5 л можно отмерить 1 л.',true,'Наполнить 3, перелить в 5, снова наполнить 3 и долить в 5 до края: в трёхлитровом останется 1 л.'],['in','Сосуды 7 л и 4 л. Наполнили 7 л и перелили в 4 л до края. Сколько литров осталось в семилитровом?',['3','3л'],'7 − 4 = 3.']]},
{id:'logic-parity',title:'Чётность',sum:'Чётность часто не меняется при разрешённых действиях, и это помогает доказать, что что-то невозможно. Сумма двух чётных или двух нечётных чисел чётна, сумма чётного и нечётного нечётна. Сумма нечётного количества нечётных чисел нечётна. Если каждый ход меняет величину на чётное число, её чётность сохраняется.',

  ['tf','Сумма пяти нечётных чисел нечётна.',true,'Нечётное количество нечётных слагаемых даёт нечётную сумму.'],['in','Чётна или нечётна сумма 1 + 2 + 3 + … + 10?',['нечётна','нечётная'],'Сумма равна 55.']]},
{id:'logic-sequences',title:'Закономерности и ряды',sum:'Чтобы продолжить ряд, ищут правило. Проверьте разности соседних чисел (постоянны — арифметическая прогрессия), отношения (постоянны — геометрическая), разности разностей, квадраты и кубы, чередование двух правил. Числа Фибоначчи: каждое равно сумме двух предыдущих.',

{id:'logic-graphs',title:'Графы: рукопожатия и мосты',sum:'Граф — точки (вершины), соединённые линиями (рёбрами). Степень вершины — число выходящих из неё рёбер. Сумма степеней всех вершин вдвое больше числа рёбер, поэтому вершин с нечётной степенью всегда чётное число. Фигуру можно обвести, не отрывая карандаша и не проходя линию дважды, если вершин с нечётной степенью 0 или 2.',
 ex:['5 человек пожали друг другу руки: рукопожатий 5 · 4 / 2 = 10','Квадрат с двумя диагоналями обвести одним росчерком нельзя: у него 4 вершины нечётной степени'],tip:'Считая рукопожатия, не забудьте разделить на 2: пожатие A с B и B с A — одно и то же.',
 hist:{who:'Леонард Эйлер',years:'1707–1783',bio:'Швейцарский математик, большую часть жизни работал в Петербурге и Берлине.',how:'Жители Кёнигсберга спорили, можно ли пройти по всем семи мостам города, побывав на каждом ровно один раз. В 1736 году Эйлер заменил острова и берега точками, а мосты — линиями и показал, что это невозможно: к каждому из четырёх участков суши ведёт нечётное число мостов. С этой задачи началась теория графов.'},
 qs:[['4 человека пожали руки каждый каждому. Сколько было рукопожатий?','6','12','8','4 · 3 / 2 = 6.'],['В графе ровно 3 вершины с нечётной степенью. Возможно ли это?','Невозможно','Возможно','Только в большом графе','Таких вершин всегда чётное число.'],
  ['tf','Фигуру можно обвести одним росчерком, если у неё ровно 2 вершины с нечётной степенью.',true,'Начинать нужно в одной из них, закончится путь в другой.'],['in','6 команд сыграли каждая с каждой по одному разу. Сколько было матчей?',['15'],'6 · 5 / 2 = 15.']]}
]};

{id:'math-divisibility',g:7,title:'Делимость, НОД и НОК',sum:'Число a делится на b, если a = b · k для целого k. Признаки: на 2 — последняя цифра чётная; на 3 и на 9 — сумма цифр делится на 3 или на 9; на 5 — последняя цифра 0 или 5; на 10 — последняя цифра 0. Простое число имеет ровно два делителя: 1 и само себя. НОД — наибольший общий делитель, НОК — наименьшее общее кратное; НОД(a, b) · НОК(a, b) = a · b.',

{id:'math-monomials',g:7,title:'Одночлены и многочлены',sum:'Одночлен — произведение чисел и переменных: 3x²y. Многочлен — сумма одночленов. Подобные слагаемые имеют одинаковую буквенную часть, их складывают: 3x + 5x = 8x. Чтобы умножить одночлен на многочлен, его умножают на каждое слагаемое. Многочлен на многочлен — каждое слагаемое первого на каждое слагаемое второго.',

{id:'math-factoring',g:7,title:'Разложение на множители',sum:'Разложить на множители — записать выражение в виде произведения. Способы: вынести общий множитель за скобки, сгруппировать слагаемые, применить формулы сокращённого умножения. Разложение помогает сокращать дроби и решать уравнения: произведение равно нулю, когда хотя бы один множитель равен нулю.',

{id:'math-roots',g:8,title:'Квадратные корни',sum:'Арифметический квадратный корень √a — неотрицательное число, квадрат которого равен a. Он определён при a ≥ 0. Свойства: √(ab) = √a · √b, √(a/b) = √a / √b, √(a²) = |a|. Корень из суммы не равен сумме корней. Числа вроде √2 иррациональны: их нельзя записать дробью.',

{id:'math-vieta',g:8,title:'Теорема Виета',sum:'Для приведённого уравнения x² + px + q = 0 с корнями x₁ и x₂: x₁ + x₂ = −p, x₁ · x₂ = q. Это позволяет подбирать корни устно и проверять решение. Для ax² + bx + c = 0 сумма корней равна −b/a, произведение — c/a.',

{id:'math-similar',g:8,title:'Подобие треугольников',sum:'Подобные треугольники имеют равные углы и пропорциональные стороны. Отношение соответственных сторон — коэффициент подобия k. Признаки подобия: по двум равным углам; по двум пропорциональным сторонам и углу между ними; по трём пропорциональным сторонам. Периметры относятся как k, площади — как k².',

{id:'math-vectors',g:9,title:'Векторы',sum:'Вектор — направленный отрезок; у него есть длина и направление. Координаты вектора AB: из координат конца вычитают координаты начала. Длина вектора (x; y) равна √(x² + y²). Складывают и вычитают векторы по координатам. Скалярное произведение: a · b = x₁x₂ + y₁y₂; оно равно нулю, когда векторы перпендикулярны.',

{id:'math-statistics',g:9,title:'Среднее, медиана и мода',sum:'Среднее арифметическое — сумма чисел, делённая на их количество. Медиана — число в середине упорядоченного ряда; при чётном количестве — среднее двух центральных. Мода — значение, которое встречается чаще всего. Размах — разность наибольшего и наименьшего. Медиана устойчивее среднего к выбросам.',
