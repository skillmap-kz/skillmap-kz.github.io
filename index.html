 ex:['f(x) = x² − 4x: f′ = 2x − 4 = 0 при x = 2; слева минус, справа плюс — минимум, f(2) = −4','f(x) = −x² + 6x: максимум при x = 3, f(3) = 9'],tip:'f′(x) = 0 ещё не гарантирует экстремум: у f(x) = x³ в нуле производная равна нулю, а экстремума нет.',
 qs:[['f(x) = x² − 6x. В какой точке минимум?','x = 3','x = 6','x = −3','f′ = 2x − 6 = 0.'],['Производная меняет знак с плюса на минус. Это точка:','максимума','минимума','разрыва','Функция росла и начала убывать.'],
  ['tf','Если f′(x₀) = 0, то x₀ обязательно точка экстремума.',false,'Пример: f(x) = x³ в точке 0.'],['in','Найдите наибольшее значение функции f(x) = −x² + 4x.',['4'],'Максимум при x = 2: −4 + 8 = 4.']]}
],
phys:[
{id:'phys-friction',g:7,title:'Сила трения',sum:'Сила трения возникает при движении одного тела по поверхности другого и направлена против движения. Сила трения скольжения: F = μ · N, где μ — коэффициент трения, N — сила, прижимающая тело к опоре (на горизонтальной поверхности N = mg). Трение покоя удерживает тело на месте. Трение качения намного меньше трения скольжения.',
 ex:['Ящик 10 кг, μ = 0,3: F = 0,3 · 100 = 30 Н (при g ≈ 10 м/с²)','Лёд посыпают песком, чтобы увеличить трение','Колёса и подшипники уменьшают трение'],tip:'Сила трения скольжения не зависит от площади соприкосновения — только от μ и силы прижатия.',
 qs:[['Куда направлена сила трения скольжения?','Против движения','По движению','Вертикально вверх','Она тормозит тело.'],['μ = 0,2, сила прижатия 50 Н. Сила трения:','10 Н','250 Н','50,2 Н','F = 0,2 · 50.'],
  ['tf','Трение качения обычно меньше трения скольжения.',true,'Поэтому тяжёлые грузы возят на колёсах.'],['in','Санки массой 20 кг, μ = 0,1, g = 10 м/с². Найдите силу трения в ньютонах.',['20','20н'],'N = 200 Н, F = 0,1 · 200.']]},
{id:'phys-lever',g:7,title:'Рычаг и простые механизмы',sum:'Рычаг — твёрдое тело с точкой опоры. Плечо силы — расстояние от опоры до линии действия силы. Условие равновесия: F₁ · l₁ = F₂ · l₂. Выигрывая в силе, проигрываем в расстоянии — это «золотое правило механики»: ни один простой механизм не даёт выигрыша в работе. Неподвижный блок меняет направление силы, подвижный даёт выигрыш в силе в 2 раза.',
 ex:['Груз 600 Н на плече 0,5 м уравновешивает сила 100 Н на плече 3 м','Ножницы, лом, качели — рычаги'],tip:'Длинное плечо — меньшая сила, но и больший путь: работа остаётся той же.',
 hist:{who:'Архимед',years:'ок. 287–212 до н. э.',bio:'Греческий математик и инженер из Сиракуз.',how:'Закон рычага Архимед вывел математически в сочинении «О равновесии плоских фигур». Ему приписывают фразу «Дайте мне точку опоры, и я переверну Землю». По рассказам древних авторов, с помощью системы блоков он в одиночку сдвинул гружёный корабль.'},
 qs:[['Условие равновесия рычага:','F₁ · l₁ = F₂ · l₂','F₁ + l₁ = F₂ + l₂','F₁ / l₁ = F₂ / l₂','Произведения силы на плечо равны.'],['Какой выигрыш в силе даёт подвижный блок?','В 2 раза','В 4 раза','Не даёт','Груз висит на двух участках верёвки.'],
  ['tf','Рычаг даёт выигрыш в работе.',false,'Ни один простой механизм не даёт выигрыша в работе.'],['in','Груз 200 Н висит на плече 1 м. Какая сила в ньютонах уравновесит его на плече 4 м?',['50','50н'],'200 · 1 = F · 4.']]},
{id:'phys-hooke',g:7,title:'Сила упругости и закон Гука',sum:'При деформации тела возникает сила упругости, стремящаяся вернуть его форму. Закон Гука: F = k · x, где x — удлинение, k — жёсткость в Н/м. Закон верен при небольших деформациях. На нём основан динамометр. Вес — сила, с которой тело давит на опору или растягивает подвес.',
 ex:['Пружина k = 100 Н/м растянута на 0,05 м: F = 5 Н','Груз 2 Н растянул пружину на 4 см: k = 2 / 0,04 = 50 Н/м'],tip:'Удлинение подставляют в метрах: 5 см = 0,05 м.',
 hist:{who:'Роберт Гук',years:'1635–1703',bio:'Английский учёный и изобретатель.',how:'Закон Гук открыл в 1660 году, а опубликовал в 1678-м, сформулировав по-латыни: «каково растяжение, такова и сила». Чтобы закрепить первенство, он сначала напечатал его в виде анаграммы — набора перемешанных букв.'},
 qs:[['k = 200 Н/м, удлинение 0,1 м. Сила упругости:','20 Н','2000 Н','200,1 Н','F = 200 · 0,1.'],['Что измеряет динамометр?','Силу','Массу','Объём','Его работа основана на законе Гука.'],
  ['tf','По закону Гука сила упругости пропорциональна удлинению.',true,'Вдвое больше удлинение — вдвое больше сила.'],['in','Сила 10 Н растянула пружину на 0,2 м. Найдите жёсткость в Н/м.',['50'],'k = 10 / 0,2.']]},
{id:'phys-magnet',g:8,title:'Магнитное поле и электромагнит',sum:'У магнита два полюса: северный и южный. Одноимённые полюсы отталкиваются, разноимённые притягиваются. Магнитное поле существует вокруг магнитов и проводников с током. Катушка с током — электромагнит: его поле тем сильнее, чем больше ток и число витков, и оно усиливается железным сердечником. На проводник с током в магнитном поле действует сила — на этом работает электродвигатель.',
 ex:['Стрелка компаса поворачивается возле провода с током','Электромагнит можно включать и выключать'],tip:'Разрезав магнит пополам, полюсы не разделить: получатся два магнита, каждый с двумя полюсами.',
 hist:{who:'Ханс Кристиан Эрстед',years:'1777–1851',bio:'Датский физик.',how:'В 1820 году Эрстед показывал студентам опыты с током и заметил, что стрелка компаса рядом с проводом отклоняется, когда цепь замыкают. Так обнаружилась связь электричества и магнетизма. Узнав об этом, Андре Ампер за несколько недель вывел законы взаимодействия токов.'},
 qs:[['Как взаимодействуют одноимённые полюсы магнитов?','Отталкиваются','Притягиваются','Не взаимодействуют','Север к северу — отталкивание.'],['Как усилить электромагнит?','Увеличить ток или число витков','Уменьшить ток','Убрать сердечник','Поле растёт с током и числом витков.'],
  ['tf','Вокруг проводника с током есть магнитное поле.',true,'Это открыл Эрстед.'],['in','Сколько полюсов у каждой половинки разрезанного магнита?',['2','два'],'Получаются два полных магнита.']]},
{id:'phys-lens',g:8,title:'Линзы',sum:'Собирающая линза (выпуклая) сводит параллельные лучи в фокус, рассеивающая (вогнутая) — расходит их. Фокусное расстояние F — расстояние от линзы до фокуса. Оптическая сила D = 1 / F измеряется в диоптриях (F в метрах). Формула тонкой линзы: 1/F = 1/d + 1/f, где d — расстояние до предмета, f — до изображения.',
 ex:['F = 0,5 м: D = 2 дптр','d = 30 см, F = 10 см: 1/f = 1/10 − 1/30 = 1/15, f = 15 см','Лупа — собирающая линза'],tip:'Для расчёта оптической силы фокусное расстояние берут в метрах: 20 см = 0,2 м.',
 qs:[['Какая линза собирает лучи в фокус?','Выпуклая','Вогнутая','Плоская','Она толще в середине.'],['F = 0,25 м. Оптическая сила:','4 дптр','0,25 дптр','25 дптр','D = 1 / 0,25.'],
  ['tf','Оптическая сила измеряется в диоптриях.',true,'1 дптр = 1 / м.'],['in','Оптическая сила линзы 5 дптр. Найдите фокусное расстояние в сантиметрах.',['20','20см'],'F = 1 / 5 = 0,2 м.']]},
{id:'phys-circular',g:9,title:'Движение по окружности',sum:'При равномерном движении по окружности скорость постоянна по величине, но меняет направление, поэтому есть ускорение, направленное к центру: a = v² / R. Период T — время одного оборота, частота ν = 1 / T. Скорость: v = 2πR / T. Центростремительную силу создают натяжение нити, трение или тяготение.',
 ex:['v = 10 м/с, R = 20 м: a = 100 / 20 = 5 м/с²','Колесо делает 2 оборота в секунду: T = 0,5 с'],tip:'Скорость направлена по касательной, а ускорение — к центру: они перпендикулярны.',
 qs:[['Куда направлено ускорение при равномерном движении по окружности?','К центру','По касательной','От центра','Оно называется центростремительным.'],['v = 6 м/с, R = 3 м. Ускорение:','12 м/с²','2 м/с²','18 м/с²','a = 36 / 3.'],
  ['tf','При равномерном движении по окружности ускорение равно нулю.',false,'Меняется направление скорости, значит, ускорение есть.'],['in','Тело делает один оборот за 0,2 с. Найдите частоту в герцах.',['5','5гц'],'ν = 1 / 0,2.']]},
{id:'phys-energy-law',g:9,title:'Закон сохранения энергии',sum:'Полная механическая энергия — сумма кинетической и потенциальной. Если нет трения, она сохраняется: mgh + mv²/2 = const. При падении потенциальная энергия переходит в кинетическую. При трении часть механической энергии переходит во внутреннюю, тела нагреваются, но полная энергия не исчезает.',
 ex:['Тело падает с 5 м: mgh = mv²/2, v = √(2gh) = 10 м/с (g = 10 м/с²)','Маятник: в нижней точке наибольшая скорость, в крайних — наибольшая высота'],tip:'Скорость в конце падения не зависит от массы: m сокращается.',
 hist:{who:'Юлиус Майер',years:'1814–1878',bio:'Немецкий врач и физик.',how:'Корабельный врач Майер в 1840 году заметил в тропиках, что венозная кровь матросов ярче, чем в Европе: в жару телу нужно меньше «сжигать» пищи ради тепла. Это натолкнуло его на мысль, что тепло и работа — формы одного и того же, и в 1842 году он сформулировал закон сохранения энергии. Независимо к нему пришли Джоуль и Гельмгольц.'},
 qs:[['Какая энергия тела растёт при падении?','Кинетическая','Потенциальная','Никакая','Высота уменьшается, скорость растёт.'],['Тело падает без трения с высоты 20 м (g = 10 м/с²). Скорость у земли:','20 м/с','200 м/с','10 м/с','v = √(2 · 10 · 20) = 20.'],
  ['tf','При трении энергия исчезает бесследно.',false,'Она переходит во внутреннюю энергию — тела нагреваются.'],['in','Мяч массой 0,5 кг на высоте 4 м (g = 10 м/с²). Найдите его потенциальную энергию в джоулях.',['20','20дж'],'0,5 · 10 · 4.']]},
{id:'phys-capacitor',g:10,title:'Конденсатор',sum:'Конденсатор накапливает электрический заряд. Он состоит из двух проводящих пластин, разделённых диэлектриком. Ёмкость: C = q / U, единица — фарад. Ёмкость плоского конденсатора растёт с площадью пластин и уменьшается с расстоянием между ними. Энергия заряженного конденсатора: W = CU² / 2. При параллельном соединении ёмкости складываются.',
 ex:['q = 0,002 Кл, U = 100 В: C = 0,00002 Ф = 20 мкФ','C = 0,001 Ф, U = 10 В: W = 0,001 · 100 / 2 = 0,05 Дж','Вспышка фотоаппарата разряжает конденсатор'],tip:'1 фарад — очень большая ёмкость; обычно встречаются микрофарады: 1 мкФ = 10⁻⁶ Ф.',
 hist:{who:'Питер ван Мушенбрук',years:'1692–1761',bio:'Голландский физик, профессор в Лейдене.',how:'В 1746 году Мушенбрук пытался «зарядить» воду в стеклянной банке от электрической машины. Его помощник держал банку в руке и, коснувшись провода, получил сильнейший удар. Так появилась лейденская банка — первый конденсатор. Годом раньше похожий прибор независимо сделал немец Эвальд фон Клейст.'},
 qs:[['Ёмкость конденсатора — это:','отношение заряда к напряжению','произведение заряда на напряжение','сила тока','C = q / U.'],['Два конденсатора по 5 мкФ соединены параллельно. Общая ёмкость:','10 мкФ','2,5 мкФ','25 мкФ','При параллельном соединении ёмкости складываются.'],
  ['tf','Ёмкость плоского конденсатора растёт при увеличении площади пластин.',true,'Больше площадь — больше заряда помещается.'],['in','Заряд 0,06 Кл, напряжение 12 В. Найдите ёмкость в фарадах.',['0,005'],'C = 0,06 / 12.']]},
{id:'phys-em-waves',g:11,title:'Электромагнитные волны и спектр',sum:'Электромагнитная волна — колебания электрического и магнитного полей, распространяющиеся в пространстве. В вакууме все они летят со скоростью света c = 3 · 10⁸ м/с. Длина волны и частота связаны: c = λ · ν. Спектр по убыванию длины волны: радиоволны, микроволны, инфракрасное излучение, видимый свет, ультрафиолет, рентгеновское и гамма-излучение.',
 ex:['ν = 100 МГц (FM-радио): λ = 3 · 10⁸ / 10⁸ = 3 м','Красный свет — около 700 нм, фиолетовый — около 400 нм','Пульт телевизора работает на инфракрасных лучах'],tip:'Чем короче волна, тем выше частота и больше энергия фотона: гамма-лучи энергичнее радиоволн.',
 hist:{who:'Джеймс Клерк Максвелл',years:'1831–1879',bio:'Шотландский физик.',how:'В 1860-х годах Максвелл объединил законы электричества и магнетизма в систему уравнений. Из них следовало, что должны существовать волны, летящие со скоростью, совпадающей с измеренной скоростью света. Он заключил, что свет — электромагнитная волна. Опытом это подтвердил Герц уже после смерти Максвелла.'},
 qs:[['Что из этого имеет наибольшую длину волны?','Радиоволны','Видимый свет','Рентгеновские лучи','Радиоволны — самые длинные.'],['С какой скоростью электромагнитные волны летят в вакууме?','3 · 10⁸ м/с','340 м/с','3 · 10⁵ м/с','Это скорость света.'],
  ['tf','Свет — это электромагнитная волна.',true,'Видимый свет — узкая часть спектра.'],['in','Частота волны 3 · 10⁸ Гц. Найдите длину волны в метрах (c = 3 · 10⁸ м/с).',['1','1м'],'λ = c / ν.']]}
]};
var ENG7=[
[0,{id:'eng-a0-have',tag:G,title:'Have got и has got',sum:'Have got значит «иметь, у меня есть». С I, you, we, they — have got, с he, she, it — has got. Отрицание: haven\'t got, hasn\'t got. Вопрос: Have you got…? Has she got…? Краткие формы: I\'ve got, he\'s got.',
 ex:['I have got a brother.','She has got blue eyes.','Have you got a pen? — Yes, I have.'],tip:'He\'s got — это he has got, а не he is got.',
 qs:[['She ___ got a cat.','has','have','is','С he, she, it используется has.'],['___ you got a pencil?','Have','Has','Do','Вопрос начинается с have.'],
  ['tf','«They has got a car» — правильно.',false,'С they нужно have: They have got a car.'],['in','Впишите форму: We ___ got two dogs.',['have','\'ve'],'С we используется have.']]}],
[1,{id:'eng-a1-place',tag:G,title:'Предлоги места',sum:'In — внутри (in the box), on — на поверхности (on the table), under — под, next to — рядом, between — между, behind — за, in front of — перед, opposite — напротив. С городами и странами используют in, а с точкой или местом занятий — at: at home, at school, at the bus stop.',
 ex:['The cat is under the bed.','The bank is between the shop and the park.','I am at home.'],tip:'At home и at school говорят без артикля.',
 qs:[['The book is ___ the table. (на столе)','on','in','under','На поверхности — on.'],['The dog is ___ the chair. (под стулом)','under','behind','between','Under — под.'],
  ['tf','«In front of» значит «позади».',false,'In front of — перед; позади — behind.'],['in','Впишите предлог: She lives ___ Bishkek.',['in'],'С городами используется in.']]}],
[2,{id:'eng-a2-adverbs',tag:G,title:'Наречия на -ly',sum:'Наречие описывает действие и отвечает на вопрос «как?». Обычно его образуют от прилагательного с помощью -ly: slow — slowly, quick — quickly. Если слово кончается на -y, она меняется на -i: happy — happily. Исключения: good — well, fast — fast, hard — hard, late — late. Hardly значит «едва», а не «усердно».',
 ex:['She sings beautifully.','He drives carefully.','They work hard.'],tip:'После глагола нужно наречие, а не прилагательное: He speaks English well, а не good.',
 qs:[['She speaks ___. (тихо)','quietly','quiet','quieter','Действие описывает наречие.'],['Наречие от слова good:','well','goodly','gooder','Good — well, это исключение.'],
  ['tf','Наречие от слова fast — fastly.',false,'Fast не меняется: He runs fast.'],['in','Образуйте наречие от слова happy.',['happily'],'Буква y меняется на i.']]}],
[3,{id:'eng-b1-deduction',tag:G,title:'Must, might, can\'t: предположения',sum:'Модальные глаголы показывают, насколько мы уверены. Must — почти уверен, что это так: He must be tired. Might, may, could — возможно: She might be at home. Can\'t — уверен, что это не так: It can\'t be true. О прошлом: must have, might have, can\'t have + третья форма глагола.',
 ex:['The lights are on. They must be at home.','He isn\'t answering. He might be asleep.','She can\'t be 40 — she looks so young.','He must have forgotten.'],tip:'Противоположность must в предположениях — can\'t, а не mustn\'t.',
 qs:[['He has been working all day. He ___ be tired.','must','can\'t','mustn\'t','Мы почти уверены.'],['It ___ be true! I don\'t believe it.','can\'t','must','might','Мы уверены, что это не так.'],
  ['tf','«She might be late» значит, что она точно опоздает.',false,'Might — только «возможно».'],['in','Впишите модальный глагол: I\'m not sure, but it ___ rain tomorrow. (возможно)',['might','may','could'],'Возможность выражают might, may или could.']]}],
[4,{id:'eng-b2-perfect-cont',tag:G,title:'Present Perfect Continuous',sum:'Показывает действие, которое началось в прошлом и длится до сих пор или только что закончилось и оставило видимый след. Форма: have / has been + глагол с -ing. Слова-подсказки: for (в течение), since (с какого-то момента), how long. С глаголами состояния (know, like, be) используют Present Perfect.',

{id:'bio-fungi',g:7,title:'Грибы',sum:'Грибы — отдельное царство. Они не фотосинтезируют и питаются готовыми органическими веществами, всасывая их всей поверхностью. Тело гриба — грибница (мицелий) из тонких нитей — гиф. Шляпочный гриб, который мы собираем, — это плодовое тело для спор. Многие грибы живут в союзе с корнями деревьев (микориза). Дрожжи — одноклеточные грибы, а плесень пеницилл дала первый антибиотик.',

{id:'bio-insects',g:7,title:'Насекомые',sum:'Насекомые — самый многочисленный класс животных. Тело состоит из трёх отделов: голова, грудь, брюшко. У них три пары ног, у большинства две пары крыльев. Покров — хитиновый наружный скелет. Дышат трахеями. Развитие с полным превращением: яйцо, личинка, куколка, взрослое насекомое (бабочки, жуки, мухи). С неполным — без куколки (кузнечики, клопы).',

{id:'bio-senses',g:8,title:'Глаз и ухо',sum:'Глаз: свет проходит через роговицу, зрачок и хрусталик и попадает на сетчатку. Хрусталик фокусирует изображение, меняя кривизну. В сетчатке палочки отвечают за сумеречное зрение, колбочки — за цветное. Близорукость исправляют рассеивающими линзами, дальнозоркость — собирающими. Ухо: звук колеблет барабанную перепонку, три слуховые косточки передают колебания в улитку, где находятся слуховые рецепторы.',

{id:'bio-kidney',g:8,title:'Почки и выделение',sum:'Почки очищают кровь от ненужных веществ и лишней воды. Структурная единица почки — нефрон, их около миллиона в каждой. Сначала кровь фильтруется: получается первичная моча, около 150–180 л в сутки. Затем полезные вещества и вода всасываются обратно, и остаётся около 1,5 л вторичной мочи. Она по мочеточникам стекает в мочевой пузырь. Кожа и лёгкие тоже участвуют в выделении.',
 ex:['В жару мочи меньше: вода уходит с потом','Мочевина — конечный продукт распада белков'],tip:'Почки не только выводят лишнее, но и возвращают в кровь почти всю отфильтрованную воду.',

  ['tf','Почки очищают кровь.',true,'Они фильтруют её и выводят ненужные вещества.'],['in','Сколько почек у человека?',['2','две'],'Они расположены по бокам от позвоночника.']]},
{id:'bio-hormones',g:8,title:'Железы и гормоны',sum:'Железы внутренней секреции выделяют гормоны прямо в кровь. Гормоны — вещества, которые в малых количествах управляют работой органов. Гипофиз управляет другими железами и выделяет гормон роста. Щитовидная железа регулирует обмен веществ, ей нужен йод. Поджелудочная железа выделяет инсулин, понижающий уровень сахара в крови. Надпочечники выделяют адреналин при стрессе.',

{id:'bio-variation',g:9,title:'Изменчивость и мутации',sum:'Изменчивость — способность организмов приобретать новые признаки. Ненаследственная (модификационная) возникает под влиянием условий и детям не передаётся: загар, натренированные мышцы. Наследственная связана с генами: комбинативная — новые сочетания генов родителей, мутационная — изменения самих генов или хромосом. Мутации случайны; большинство вредны или нейтральны, но именно они дают материал для эволюции.',

{id:'bio-atp',g:10,title:'АТФ и энергетический обмен',sum:'АТФ — универсальный «аккумулятор» энергии в клетке. Энергия выделяется, когда от АТФ отщепляется фосфатная группа. Клетка получает АТФ, расщепляя глюкозу. Без кислорода (гликолиз, в цитоплазме) из одной молекулы глюкозы получается 2 молекулы АТФ. С кислородом (клеточное дыхание, в митохондриях) — ещё около 36, всего около 38. Конечные продукты — углекислый газ и вода.',

  ['tf','АТФ — источник энергии для процессов в клетке.',true,'Энергия выделяется при отщеплении фосфата.'],['in','Какой углевод клетка расщепляет в первую очередь, чтобы получить АТФ?',['глюкоза','глюкозу'],'Глюкоза — основное «топливо» клетки.']]},
{id:'bio-selection',g:11,title:'Селекция и биотехнология',sum:'Селекция — выведение новых сортов растений и пород животных. Основные методы: искусственный отбор и гибридизация, то есть скрещивание. Гибриды первого поколения часто мощнее родителей — это гетерозис. Биотехнология использует живые клетки для получения нужных веществ: бактерии со встроенным геном человека производят инсулин. Генная инженерия позволяет переносить гены между организмами.',
 ex:['Все породы собак выведены из волка искусственным отбором','Инсулин для больных диабетом производят бактерии'],tip:'Искусственный отбор ведёт человек по нужным ему признакам, естественный — среда по приспособленности.',

  ['tf','Гибриды первого поколения часто мощнее родительских форм.',true,'Это явление называется гетерозисом.'],['in','Как называется наука о выведении новых сортов и пород?',['селекция'],'От латинского selectio — отбор.']]}

chem:[

{id:'chem-gases',g:8,title:'Кислород и водород',sum:'Кислород O₂ — газ без цвета и запаха, поддерживает горение и дыхание. В лаборатории его получают разложением пероксида водорода: 2H₂O₂ → 2H₂O + O₂. Тлеющая лучинка в кислороде вспыхивает. Водород H₂ — самый лёгкий газ. Его получают реакцией металла с кислотой: Zn + 2HCl → ZnCl₂ + H₂. Смесь водорода с кислородом взрывоопасна; при горении водорода образуется вода.',
 ex:['2H₂ + O₂ → 2H₂O','Водород собирают в перевёрнутую пробирку: он легче воздуха'],tip:'Кислород собирают в сосуд дном вниз (он тяжелее воздуха), водород — дном вверх.',
 hist:{who:'Джозеф Пристли',years:'1733–1804',bio:'Английский священник и естествоиспытатель.',how:'В 1774 году Пристли с помощью большой линзы нагрел солнечными лучами оксид ртути и собрал выделившийся газ. Свеча в нём горела ослепительно ярко, а мышь жила дольше, чем в обычном воздухе. Чуть раньше тот же газ получил швед Карл Шееле, а название «кислород» дал Лавуазье.'},
 qs:[['Как распознать кислород?','Тлеющая лучинка вспыхивает','Газ мутнеет','Лучинка гаснет','Кислород поддерживает горение.'],['Что образуется при горении водорода?','Вода','Углекислый газ','Соль','2H₂ + O₂ → 2H₂O.'],
  ['tf','Водород — самый лёгкий газ.',true,'Он примерно в 14 раз легче воздуха.'],['in','Zn + 2HCl → ZnCl₂ + ? Напишите формулу выделяющегося газа.',['h2','h₂'],'Металл вытесняет водород из кислоты.']]},
{id:'chem-nonmetals',g:9,title:'Неметаллы',sum:'Неметаллы расположены в правой верхней части таблицы. Их атомы принимают электроны, поэтому неметаллы — окислители. Галогены (F, Cl, Br, I) — самые активные неметаллы; с металлами они образуют соли: 2Na + Cl₂ → 2NaCl. Сера горит с образованием SO₂. Азот N₂ малоактивен из-за прочной тройной связи; его важнейшее соединение — аммиак NH₃.',
 ex:['Хлор — жёлто-зелёный ядовитый газ','Йод — тёмные кристаллы; его раствор используют как антисептик','S + O₂ → SO₂'],tip:'Активность галогенов падает сверху вниз: фтор — самый активный, йод — наименее.',
 qs:[['Какой галоген самый активный?','Фтор','Йод','Бром','Активность падает сверху вниз по группе.'],['Что образуется при реакции натрия с хлором?','Поваренная соль','Вода','Кислота','2Na + Cl₂ → 2NaCl.'],
  ['tf','Азот при обычных условиях очень активен.',false,'Тройная связь в N₂ очень прочная.'],['in','Напишите формулу аммиака.',['nh3','nh₃'],'Один атом азота и три атома водорода.']]},
{id:'chem-carbon',g:9,title:'Углерод и его соединения',sum:'Углерод образует несколько простых веществ: алмаз (самое твёрдое природное вещество), графит (мягкий, проводит ток), уголь. Оксиды: угарный газ CO ядовит и образуется при нехватке кислорода; углекислый газ CO₂ образуется при полном сгорании и дыхании. Угольная кислота H₂CO₃ слабая и неустойчивая, её соли — карбонаты. Карбонаты узнают по «вскипанию» с кислотой: выделяется CO₂.',
 ex:['CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂↑','Газировка — раствор CO₂ в воде'],tip:'Угарный газ не имеет запаха — поэтому он так опасен при неисправной печи.',
 qs:[['Какой газ ядовит и образуется при нехватке кислорода?','CO','CO₂','O₂','Это угарный газ.'],['Чем отличаются алмаз и графит?','Строением кристалла','Химическим элементом','Числом протонов в атомах','Оба состоят из углерода.'],
  ['tf','Карбонаты выделяют углекислый газ при действии кислоты.',true,'Так определяют мел и известняк.'],['in','Напишите формулу углекислого газа.',['co2','co₂'],'Один атом углерода и два атома кислорода.']]},
{id:'chem-biochem',g:10,title:'Жиры, углеводы и белки',sum:'Жиры — сложные эфиры глицерина и жирных кислот; при щелочном гидролизе дают мыло. Углеводы: глюкоза C₆H₁₂O₆ — моносахарид, сахароза — дисахарид, крахмал и целлюлоза — полисахариды. Крахмал узнают по синему окрашиванию с йодом. Белки — полимеры аминокислот, соединённых пептидными связями; при нагревании белок сворачивается — это денатурация.',
 ex:['Йод на срезе картофеля синеет — там крахмал','Яичный белок при варке белеет — денатурация','Мыло получают из жира и щёлочи'],tip:'Глюкоза и фруктоза имеют одну формулу C₆H₁₂O₆, но разное строение — это изомеры.',
 qs:[['Чем обнаруживают крахмал?','Раствором йода','Лакмусом','Магнитом','Крахмал с йодом даёт синий цвет.'],['Формула глюкозы:','C₆H₁₂O₆','C₂H₅OH','CH₃COOH','В ней шесть атомов углерода.'],
  ['tf','Белки состоят из остатков аминокислот.',true,'Они соединены пептидными связями.'],['in','Как называется сворачивание белка при нагревании?',['денатурация'],'Структура белка разрушается.']]},
{id:'chem-electrolysis',g:11,title:'Электролиз',sum:'Электролиз — химические реакции на электродах при пропускании тока через раствор или расплав электролита. Катод заряжен отрицательно: к нему идут катионы и восстанавливаются. Анод заряжен положительно: к нему идут анионы и окисляются. Электролиз расплава NaCl даёт натрий и хлор. Электролизом получают алюминий, очищают медь, наносят покрытия.',
 ex:['2NaCl (расплав) → 2Na + Cl₂↑','2H₂O → 2H₂↑ + O₂↑ — электролиз воды','Никелирование и хромирование деталей'],tip:'Катионы идут к катоду, анионы — к аноду: названия подсказывают.',
 hist:{who:'Гемфри Дэви',years:'1778–1829',bio:'Английский химик.',how:'В 1807 году Дэви пропустил ток от огромной батареи через расплавленную едкую щёлочь и увидел на катоде шарики неизвестного металла, которые тут же вспыхивали. Так он открыл калий, а через несколько дней — натрий. Законы электролиза позже установил его ученик Майкл Фарадей.'},
 qs:[['К какому электроду движутся катионы?','К катоду','К аноду','Не движутся','Катод заряжен отрицательно.'],['Что получается при электролизе расплава NaCl?','Натрий и хлор','Вода и соль','Кислород и водород','На катоде — натрий, на аноде — хлор.'],
  ['tf','На катоде происходит восстановление.',true,'Катионы принимают электроны.'],['in','Какой металл в промышленности получают электролизом из глинозёма?',['алюминий'],'Глинозём — оксид алюминия.']]}
]};
var CRIT=[
{id:'logic-critical',title:'Факт, мнение и источник',sum:'Факт можно проверить, мнение — это оценка. «Вода кипит при 100 °C» — факт, «химия скучная» — мнение. Оценивая сообщение, спросите: кто автор и откуда он это знает? Есть ли первоисточник? Подтверждают ли это другие независимые источники? Выгодно ли автору, чтобы вы поверили? Громкий заголовок и слова «учёные доказали» без ссылки — повод насторожиться.',
 ex:['«Этот телефон лучший» — мнение; «у него батарея 5000 мА·ч» — факт','Новость с одним анонимным источником требует проверки'],tip:'То, что сообщение повторяют многие, не делает его правдой: все могли переписать его из одного места.',
 qs:[['Что из этого факт?','В неделе семь дней','Понедельник — худший день','Математика интереснее истории','Его можно проверить.'],['Что первым делом стоит проверить в громкой новости?','Источник','Количество лайков','Красоту картинки','Кто сообщил и откуда он это знает.'],
  ['tf','Если новость повторили сто сайтов, она точно правдива.',false,'Все они могли взять её из одного непроверенного источника.'],['in','«Этот фильм ужасный». Это факт или мнение?',['мнение'],'Это оценка, её нельзя проверить.']]},
{id:'logic-hypothesis',title:'Проверка гипотез',sum:'Гипотеза — предположение, которое можно проверить. Честный опыт меняет только одно условие, а остальные оставляет одинаковыми. Нужна контрольная группа — та, с которой ничего не делали, для сравнения. Один случай ничего не доказывает: нужны повторы и достаточно участников. У хорошей гипотезы ясно, какой результат её опровергнет.',
 ex:['Удобрение проверяют на двух одинаковых грядках: с ним и без него','«Мне помогло» — один случай, а не доказательство'],tip:'Ищите не только подтверждения своей идеи, но и то, что могло бы её опровергнуть.',
 hist:{who:'Джеймс Линд',years:'1716–1794',bio:'Шотландский корабельный врач.',how:'В 1747 году Линд провёл один из первых сравнительных опытов в медицине.',
  exp:['На корабле заболели цингой двенадцать моряков. Линд разделил их на шесть пар.','Все ели одинаковую пищу и лежали в одном месте.','Каждой паре добавляли своё средство: сидр, уксус, морскую воду, апельсины с лимонами и другое.','Через несколько дней быстро пошли на поправку только те двое, кто получал цитрусы.','Вывод: разницу в результате можно объяснить только тем единственным, что различалось.']},
 qs:[['Зачем нужна контрольная группа?','Для сравнения','Для красоты','Чтобы участников было больше','Без неё не понять, сработало ли воздействие.'],['Сколько условий меняют в честном опыте?','Одно','Все сразу','Ни одного','Иначе неясно, что именно повлияло.'],
  ['tf','Один удачный случай доказывает гипотезу.',false,'Нужны повторы и сравнение.'],['in','Проверяют, помогает ли музыка расти цветам. Десять цветов растут с музыкой. Как должны расти десять контрольных цветов: с музыкой или без?',['без','без музыки'],'Контрольная группа отличается только отсутствием воздействия.']]},
{id:'logic-lateral',title:'Взгляд с другой стороны',sum:'Если задача не решается «в лоб», меняют подход. Приёмы: переформулировать вопрос; идти от конца к началу; проверить скрытые допущения — что я считаю очевидным, хотя этого нет в условии; рассмотреть крайний случай; встать на место другого участника; упростить задачу и решить сначала её.',
 ex:['«Как бросить мяч, чтобы он вернулся?» — подбросить вверх: никто не говорил, что бросать надо вперёд','От конца: чтобы прийти к 8:00 при дороге в 40 минут, выйти надо в 7:20'],tip:'Спросите себя: «Какое условие я придумал сам?» — часто именно оно мешает решению.',
 qs:[['У отца Мэри пять дочерей: Нана, Нэнэ, Нини, Ноно. Как зовут пятую?','Мэри','Нуну','Нана','Пятая дочь названа в самом начале условия.'],['Какой приём помогает, если задача не решается прямо?','Идти от конца к началу','Перечитывать условие, не думая','Угадать ответ','Обратный ход часто проще.'],
  ['tf','В условии задачи всегда сказано всё, что мы считаем очевидным.',false,'Часть «условий» мы додумываем сами.'],['in','Нужно быть в школе в 8:30, дорога занимает 25 минут. Во сколько надо выйти? Запишите в виде 7:45.',['8:05','08:05','8.05'],'8:30 минус 25 минут.']]},
{id:'logic-chains',title:'Много фактов — один вывод',sum:'В задачах со многими условиями нельзя держать всё в голове — записывайте. Выпишите факты по одному, пронумеруйте, начните с самого определённого и после каждого вывода перечитывайте остальные: какой из них теперь «заработал»? Каждый вывод — новый факт. Если упёрлись, предположите вариант и доведите его до противоречия.',
 ex:['Аня выше Бори. Боря выше Веры. Вера выше Гали. Значит, Аня выше Гали — цепочка из трёх фактов','Три дома в ряд: красный не с краю, синий левее зелёного — значит, порядок: синий, красный, зелёный'],tip:'Рисуйте схему: линию, таблицу или стрелки. Картинка держит факты вместо памяти.',
 qs:[['Аня старше Бори, Боря старше Веры. Кто младше всех?','Вера','Боря','Аня','Цепочка: Аня, Боря, Вера.'],['Три дома в ряд. Красный не с краю. Синий левее зелёного. Какой дом слева?','Синий','Красный','Зелёный','Красный в середине, синий левее зелёного.'],
  ['tf','Каждый сделанный вывод можно использовать как новый факт.',true,'Так строится цепочка рассуждений.'],['in','Али выше Бека. Бек выше Влада. Влад выше Гани. Сколько человек ниже Али?',['3','три'],'Бек, Влад и Гани.']]},
{id:'logic-bias',title:'Ловушки мышления',sum:'Мозг экономит силы и поэтому систематически ошибается. Склонность к подтверждению: замечаем то, что согласуется с нашим мнением. Ошибка выжившего: судим по тем, кто «выжил», не видя остальных. Эффект якоря: первое названное число влияет на оценку. Эффект ореола: приятный человек кажется умнее. Стадное чувство: «все так думают — значит, верно».',
 ex:['«Многие миллионеры бросили учёбу» — а сколько бросивших не стали миллионерами?','Цена «было 9000, стало 5000» кажется выгодной из-за якоря'],tip:'Спрашивайте себя: «Кого я не вижу?» и «Что убедило бы меня в обратном?».',
 hist:{who:'Абрахам Вальд',years:'1902–1950',bio:'Математик венгерского происхождения, во время Второй мировой войны работал в США.',how:'Военные изучали пробоины на самолётах, вернувшихся с заданий, и хотели укрепить места, где дыр больше всего. Вальд возразил: укреплять нужно там, где пробоин нет. Самолёты с попаданиями в эти места просто не вернулись. Эта история стала классическим примером ошибки выжившего.'},
 qs:[['«Дельфины толкают тонущих к берегу» — мы знаем это от спасённых. Какая здесь ловушка?','Ошибка выжившего','Эффект якоря','Эффект ореола','Те, кого толкали от берега, рассказать не смогли.'],['Продавец сначала называет завышенную цену. На что он рассчитывает?','На эффект якоря','На ошибку выжившего','На стадное чувство','Первое число становится точкой отсчёта.'],
  ['tf','Склонность к подтверждению — это привычка искать только то, что согласуется с нашим мнением.',true,'Поэтому полезно искать и возражения.'],['in','«Он красиво говорит, значит, он прав». Какой это эффект: ореола или якоря?',['ореола','эффект ореола','ореол'],'Одно приятное качество переносят на всё остальное.']]},
{id:'logic-fermi',title:'Прикидка и здравый смысл',sum:'Многие вопросы можно оценить без точных данных. Разбейте вопрос на части, каждую оцените грубо и перемножьте. Ошибки в разные стороны частично гасят друг друга. Проверяйте ответ на правдоподобие: порядок величины, единицы, крайние случаи. Такие задачи называют задачами Ферми.',
 ex:['Сколько ударов делает сердце за сутки? 70 в минуту · 60 · 24 ≈ 100 000','Сколько учеников в школе? 11 параллелей · 3 класса · 30 человек ≈ 1000'],tip:'Цель прикидки — не точность, а порядок: тысяча это, миллион или миллиард.',
 hist:{who:'Энрико Ферми',years:'1901–1954',bio:'Итальянский физик, лауреат Нобелевской премии 1938 года.',how:'Ферми славился умением быстро оценивать то, что кажется непосчитаемым. При первом испытании атомной бомбы в 1945 году он бросил клочки бумаги, когда дошла ударная волна, и по тому, как далеко их отнесло, прикинул мощность взрыва. Студентам он задавал вопросы вроде «сколько настройщиков пианино в Чикаго?».'},
 qs:[['Примерно сколько секунд в сутках?','Около 86 000','Около 8 600','Около 860 000','24 · 60 · 60 = 86 400.'],['Вы посчитали, что школьник весит 500 кг. Что нужно сделать?','Искать ошибку: ответ неправдоподобен','Записать ответ','Округлить до 1000','Проверка на здравый смысл ловит грубые ошибки.'],

{id:'logic-argument',title:'Аргумент и контраргумент',sum:'Аргумент состоит из тезиса (что утверждаю) и доводов (почему). Сильный довод — факт, расчёт, результат опыта, мнение специалиста в его области. Слабый — «все так говорят», «мне так кажется». Чтобы понять вопрос глубже, сформулируйте лучший довод противоположной стороны и ответьте на него. Менять мнение под давлением хороших доводов — признак силы, а не слабости.',

  ['tf','КПД теплового двигателя может быть равен 100%.',false,'Часть теплоты всегда уходит холодильнику.'],['in','КПД двигателя 30%, он получил 2000 Дж теплоты. Какую работу в джоулях он совершил?',['600','600дж'],'2000 · 0,3 = 600 Дж.']]},
{id:'phys-jet',g:9,title:'Реактивное движение',sum:'Реактивное движение возникает, когда от тела с большой скоростью отделяется часть его массы. По закону сохранения импульса тело получает толчок в противоположную сторону. Так летают ракеты и плавают кальмары. Ракете не нужен воздух: она отталкивается от собственных газов, поэтому летает и в космосе.',
 ex:['Надутый шарик, выпуская воздух, летит в обратную сторону','Ракета массой 1 т выбросила 10 кг газа со скоростью 1000 м/с: её скорость изменится примерно на 10 м/с'],tip:'Ракета толкается не от воздуха, а от вылетающих газов.',
 hist:{who:'Константин Циолковский',years:'1857–1935',bio:'Русский учёный и школьный учитель из Калуги, основоположник космонавтики.',how:'В 1903 году Циолковский опубликовал статью «Исследование мировых пространств реактивными приборами». Он вывел формулу скорости ракеты и показал, что для полёта в космос нужна ракета на жидком топливе, а лучше — многоступенчатая.'},
 qs:[['Почему ракета может лететь в безвоздушном пространстве?','Она отталкивается от собственных газов','Она отталкивается от воздуха','Её притягивают звёзды','Работает закон сохранения импульса.'],['Какой закон лежит в основе реактивного движения?','Закон сохранения импульса','Закон Ома','Закон Архимеда','Суммарный импульс газа и ракеты не меняется.'],
  ['tf','Кальмары используют реактивное движение.',true,'Они с силой выталкивают воду из полости тела.'],['in','Неподвижная лодка массой 200 кг. Из неё прыгнул человек массой 50 кг со скоростью 4 м/с. С какой скоростью в м/с поплывёт лодка?',['1','1м/с'],'50 · 4 = 200 · v.']]},
{id:'phys-efield',g:10,title:'Электрическое поле',sum:'Вокруг заряда существует электрическое поле, которое действует на другие заряды. Напряжённость E = F / q показывает силу, действующую на единичный заряд; единица — Н/Кл, или В/м. Поле точечного заряда: E = kq / r². Линии напряжённости выходят из положительного заряда и входят в отрицательный. Между пластинами конденсатора поле однородное: E = U / d.',
 ex:['На заряд 2 · 10⁻⁶ Кл действует сила 0,04 Н: E = 20 000 Н/Кл','Пластины на расстоянии 0,01 м, напряжение 100 В: E = 10 000 В/м'],tip:'Напряжённость — свойство поля в точке, она не зависит от того, какой пробный заряд туда поместили.',
 qs:[['Единица напряжённости электрического поля:','Н/Кл','Кл/Н','Дж','E = F / q.'],['Расстояние до точечного заряда увеличили в 2 раза. Напряжённость поля:','уменьшилась в 4 раза','уменьшилась в 2 раза','не изменилась','E обратно пропорциональна r².'],
  ['tf','Линии напряжённости начинаются на положительных зарядах.',true,'И заканчиваются на отрицательных.'],['in','Напряжение между пластинами 200 В, расстояние 0,02 м. Найдите напряжённость в В/м.',['10000','10000в/м'],'200 / 0,02 = 10 000 В/м.']]},
{id:'phys-ac',g:11,title:'Переменный ток и трансформатор',sum:'Переменный ток периодически меняет направление. В бытовой сети его частота 50 Гц, а действующее напряжение 220 В. Его вырабатывают генераторы на основе электромагнитной индукции. Трансформатор повышает или понижает напряжение: U₁ / U₂ = N₁ / N₂, где N — число витков. Для передачи на большие расстояния напряжение повышают: при меньшем токе меньше потери на нагрев проводов.',
 ex:['N₁ = 1000, N₂ = 50: из 220 В получается 11 В','Зарядное устройство телефона понижает напряжение сети'],tip:'Трансформатор работает только на переменном токе: постоянный ток не создаёт меняющегося магнитного потока.',
 hist:{who:'Никола Тесла',years:'1856–1943',bio:'Изобретатель и инженер сербского происхождения, работал в США.',how:'В 1880-х годах Тесла создал двигатель и систему передачи переменного тока. Компания Джорджа Вестингауза купила его патенты, и в 1890-х годах переменный ток победил в «войне токов» с постоянным током Эдисона: благодаря трансформаторам его проще передавать на большие расстояния.'},
 qs:[['Частота тока в бытовой сети:','50 Гц','220 Гц','1 Гц','Ток меняет направление 100 раз в секунду.'],['Зачем при передаче энергии повышают напряжение?','Чтобы уменьшить потери в проводах','Чтобы увеличить ток','Чтобы ток стал постоянным','При той же мощности ток меньше, и провода меньше греются.'],
  ['tf','Трансформатор работает на постоянном токе.',false,'Ему нужен меняющийся магнитный поток.'],['in','Первичная обмотка 2000 витков, вторичная 100. На входе 220 В. Найдите напряжение на выходе в вольтах.',['11','11в'],'220 · 100 / 2000 = 11 В.']]},
{id:'phys-bohr',g:11,title:'Строение атома и спектры',sum:'По модели Бора электрон в атоме может находиться только на определённых орбитах с определённой энергией. Переходя с более высокого уровня на более низкий, атом испускает фотон, энергия которого равна разности уровней: hν = E₂ − E₁. Поэтому каждый элемент излучает свет только определённых длин волн — линейчатый спектр, по которому вещество можно узнать даже на далёкой звезде.',
 ex:['Неоновая трубка светится красным: таков спектр неона','Гелий нашли в спектре Солнца раньше, чем на Земле'],tip:'Атом излучает свет при переходе электрона вниз, а поглощает — при переходе вверх.',
 hist:{who:'Нильс Бор',years:'1885–1962',bio:'Датский физик, лауреат Нобелевской премии 1922 года.',how:'В 1913 году Бор предложил модель атома, в которой электрон движется только по разрешённым орбитам. Модель объяснила, почему водород излучает свет строго определённых длин волн, и стала шагом к квантовой механике.'},
 qs:[['Когда атом излучает фотон?','При переходе электрона на более низкий уровень','При переходе на более высокий уровень','Всегда, без всяких переходов','Излучается разность энергий уровней.'],['Что позволяет узнать состав далёкой звезды?','Спектр её света','Её яркость','Её размер','У каждого элемента свой линейчатый спектр.'],
  ['tf','У каждого химического элемента свой линейчатый спектр.',true,'Так в спектре Солнца открыли гелий.'],['in','Электрон перешёл с уровня −1,5 эВ на уровень −3,4 эВ. Найдите энергию фотона в эВ.',['1,9','1.9'],'−1,5 − (−3,4) = 1,9 эВ.']]},
{id:'phys-relativity',g:11,title:'Основы теории относительности',sum:'Специальная теория относительности стоит на двух постулатах: законы физики одинаковы во всех инерциальных системах отсчёта, и скорость света в вакууме одинакова для всех наблюдателей. Следствия: при скоростях, близких к скорости света, время для движущегося тела течёт медленнее, а разогнать тело с массой до скорости света нельзя. Масса и энергия связаны формулой E = mc².',
 ex:['Часы на спутниках GPS поправляют с учётом теории относительности','Массе 1 г соответствует энергия mc² = 9 · 10¹³ Дж'],tip:'При обычных скоростях эффекты теории относительности ничтожно малы, поэтому в жизни мы их не замечаем.',
 hist:{who:'Альберт Эйнштейн',years:'1879–1955',bio:'Физик-теоретик, лауреат Нобелевской премии 1921 года.',how:'В 1905 году, работая экспертом патентного бюро в Берне, Эйнштейн опубликовал специальную теорию относительности и вывод о связи массы и энергии. В 1915 году он завершил общую теорию относительности, в которой тяготение описано как искривление пространства-времени.'},
 qs:[['Скорость света в вакууме для разных наблюдателей:','одинакова','зависит от скорости наблюдателя','всегда меньше 1000 м/с','Это постулат Эйнштейна.'],['Формула связи массы и энергии:','E = mc²','E = mgh','F = ma','c — скорость света.'],
  ['tf','Тело с массой можно разогнать быстрее света.',false,'Скорость света — предел.'],['in','Какая энергия соответствует массе 1 кг (c = 3 · 10⁸ м/с)? Запишите в виде 9e16.',['9e16','9*10^16','9·10^16'],'E = 1 · (3 · 10⁸)² = 9 · 10¹⁶ Дж.']]}
],
chem:[
{id:'chem-sulfur',g:9,title:'Сера и серная кислота',sum:'Сера — жёлтое твёрдое вещество, неметалл VI группы. Горит синим пламенем: S + O₂ → SO₂. Из SO₂ получают SO₃, а из него — серную кислоту H₂SO₄. Концентрированная серная кислота обугливает органические вещества и сильно нагревается при смешивании с водой. Её соли — сульфаты; сульфат-ион узнают по белому осадку с ионами бария: Ba²⁺ + SO₄²⁻ → BaSO₄↓.',
 ex:['Сахар в концентрированной серной кислоте чернеет','Серная кислота нужна для производства удобрений'],tip:'Разбавляя кислоту, льют кислоту в воду, а не воду в кислоту: иначе вода вскипает и разбрызгивает кислоту.',
 qs:[['Какой газ образуется при горении серы?','SO₂','CO₂','H₂S','S + O₂ → SO₂.'],['Как обнаружить сульфат-ион?','Ионами бария: выпадает белый осадок','Лакмусом','Тлеющей лучинкой','Образуется нерастворимый BaSO₄.'],
  ['tf','При разбавлении серной кислоты воду льют в кислоту.',false,'Наоборот: кислоту в воду, тонкой струйкой.'],['in','Найдите молярную массу H₂SO₄ в г/моль (H = 1, S = 32, O = 16).',['98'],'2 + 32 + 64 = 98.']]},
{id:'chem-nitrogen',g:9,title:'Азот, аммиак и азотная кислота',sum:'Азот N₂ составляет около 78% воздуха и малоактивен из-за прочной тройной связи. Аммиак NH₃ — газ с резким запахом, хорошо растворимый в воде; его получают из азота и водорода: N₂ + 3H₂ ⇌ 2NH₃. Азотная кислота HNO₃ — сильная кислота и сильный окислитель. Её соли — нитраты — используют как удобрения.',
 ex:['Нашатырный спирт — раствор аммиака','Калийная селитра KNO₃ — удобрение'],tip:'Азотная кислота реагирует с металлами без выделения водорода: вместо него выделяются оксиды азота.',
 hist:{who:'Фриц Габер',years:'1868–1934',bio:'Немецкий химик, лауреат Нобелевской премии 1918 года.',how:'В 1909 году Габер нашёл условия синтеза аммиака из азота воздуха и водорода: высокое давление, нагрев и катализатор. Карл Бош превратил этот способ в промышленный. Удобрения из такого аммиака помогают кормить значительную часть людей на Земле.'},
 qs:[['Формула аммиака:','NH₃','N₂O','HNO₃','Атом азота и три атома водорода.'],['Как называются соли азотной кислоты?','Нитраты','Сульфаты','Хлориды','Например, KNO₃ — нитрат калия.'],
  ['tf','Азот — самый распространённый газ в воздухе.',true,'Его около 78%.'],['in','N₂ + 3H₂ ⇌ 2NH₃. Сколько молей аммиака образуется из 3 моль водорода?',['2'],'Соотношение 3 : 2.']]},
{id:'chem-benzene',g:10,title:'Бензол',sum:'Бензол C₆H₆ — простейший ароматический углеводород. Его молекула — плоское кольцо из шести атомов углерода, где электроны связей распределены по всему кольцу. Поэтому бензол устойчив и, в отличие от алкенов, вступает в основном в реакции замещения, а не присоединения. Бензол ядовит; его производные — сырьё для лекарств, красителей и пластмасс.',
 ex:['C₆H₆ + Br₂ → C₆H₅Br + HBr (с катализатором)','Толуол C₆H₅CH₃ используют как растворитель'],tip:'Бензол не обесцвечивает бромную воду, хотя в его формуле рисуют «двойные связи».',
 hist:{who:'Август Кекуле',years:'1829–1896',bio:'Немецкий химик.',how:'В 1865 году Кекуле предложил для бензола кольцевую формулу из шести атомов углерода. По его собственному рассказу, идея пришла в полудрёме: ему привиделась змея, кусающая свой хвост. Современное объяснение устойчивости бензола дала квантовая химия.'},
 qs:[['Формула бензола:','C₆H₆','C₆H₁₂','C₆H₁₄','Шесть атомов углерода и шесть водорода.'],['Какие реакции типичны для бензола?','Замещения','Только горения','Только присоединения','Кольцо устойчиво, поэтому атомы водорода замещаются.'],
  ['tf','Молекула бензола — плоское кольцо.',true,'Все 12 атомов лежат в одной плоскости.'],['in','Сколько атомов углерода в кольце бензола?',['6','шесть'],'C₆H₆.']]},
{id:'chem-aldehydes',g:10,title:'Альдегиды',sum:'Альдегиды содержат группу –CHO. Простейшие из них — формальдегид HCHO и уксусный альдегид CH₃CHO. Альдегиды получают окислением спиртов, а сами они окисляются до карбоновых кислот. Качественная реакция — «серебряное зеркало»: с аммиачным раствором оксида серебра на стенке пробирки появляется блестящий слой серебра.',
 ex:['Этанол → уксусный альдегид → уксусная кислота','Раствор формальдегида (формалин) используют для хранения биологических препаратов'],tip:'Альдегид — промежуточная ступень: спирт окисляется до альдегида, альдегид — до кислоты.',
 qs:[['Какая группа есть у альдегидов?','–CHO','–OH','–COOH','Это альдегидная группа.'],['Во что окисляется альдегид?','В карбоновую кислоту','В спирт','В алкан','Например, CH₃CHO → CH₃COOH.'],
  ['tf','Реакция «серебряного зеркала» — качественная реакция на альдегиды.',true,'Выделяется металлическое серебро.'],['in','Напишите формулу уксусного альдегида.',['ch3cho','ch₃cho'],'CH₃CHO.']]},
{id:'chem-hydrolysis',g:11,title:'Гидролиз солей',sum:'Гидролиз — реакция соли с водой, из-за которой раствор становится кислым или щелочным. Соль сильной кислоты и слабого основания (CuCl₂, NH₄Cl) даёт кислую среду. Соль слабой кислоты и сильного основания (Na₂CO₃) — щелочную. Соль сильной кислоты и сильного основания (NaCl) гидролизу не подвергается: среда нейтральная.',
 ex:['Раствор соды Na₂CO₃: pH > 7','Раствор NaCl: pH = 7','Раствор NH₄Cl: pH < 7'],tip:'Простое правило: среду определяет «сильный» участник соли.',
 qs:[['Какая среда у раствора Na₂CO₃?','Щелочная','Кислая','Нейтральная','Соль сильного основания NaOH и слабой угольной кислоты.'],['Какая соль не подвергается гидролизу?','NaCl','CuCl₂','Na₂CO₃','Она образована сильной кислотой и сильным основанием.'],
  ['tf','Раствор хлорида аммония NH₄Cl имеет кислую среду.',true,'Сильная кислота HCl и слабое основание.'],['in','Какой pH у раствора NaCl?',['7'],'Среда нейтральная.']]},
{id:'chem-corrosion',g:11,title:'Коррозия металлов',sum:'Коррозия — разрушение металла под действием окружающей среды. Железо ржавеет, когда рядом есть и вода, и кислород; соль ускоряет процесс. Способы защиты: краска и смазка, покрытие другим металлом (цинком, хромом), сплавы вроде нержавеющей стали и протекторы — к детали присоединяют более активный металл, который разрушается вместо неё.',
 ex:['Оцинкованное ведро не ржавеет даже с царапиной: цинк активнее железа','Зимой машины ржавеют быстрее из-за соли на дорогах'],tip:'Железу для ржавления нужны одновременно вода и кислород: в сухом воздухе оно почти не ржавеет.',
 qs:[['Что нужно для ржавления железа?','Вода и кислород','Только азот','Только тепло','Без одного из них ржавления нет.'],['Почему цинк защищает железо даже при царапине?','Цинк активнее и разрушается первым','Цинк тяжелее','Цинк не проводит ток','Это протекторная защита.'],
  ['tf','Соль на дорогах ускоряет коррозию.',true,'Солёная вода лучше проводит ток.'],['in','Какой металл защищает железо в оцинкованном ведре?',['цинк'],'Цинк активнее железа.']]}
],
bio:[
{id:'bio-sporeplants',g:7,title:'Водоросли, мхи и папоротники',sum:'Водоросли живут в воде, у них нет корней, стеблей и листьев: их тело называют слоевищем. Мхи растут во влажных местах, у них есть стебель и листья, но нет корней — их заменяют ризоиды. У папоротников есть корни, стебли и листья. Все они размножаются спорами, и для оплодотворения им нужна вода.',
 ex:['Мох сфагнум накапливает воду и со временем образует торф','На нижней стороне листа папоротника видны бурые кучки спорангиев со спорами'],tip:'Цветок папоротника — легенда: папоротники не цветут, они размножаются спорами.',
 qs:[['Чем размножаются мхи и папоротники?','Спорами','Семенами','Клубнями','Это споровые растения.'],['Что заменяет мхам корни?','Ризоиды','Листья','Цветки','Ризоиды — тонкие выросты, которые удерживают мох.'],
  ['tf','Папоротники цветут.',false,'Цветков у папоротников нет.'],['in','Как называется тело водоросли, не разделённое на органы?',['слоевище','таллом'],'Его называют слоевищем.']]},
{id:'bio-protists',g:7,title:'Простейшие',sum:'Простейшие — одноклеточные организмы с ядром. Амёба передвигается ложноножками и захватывает пищу, обволакивая её. Инфузория-туфелька покрыта ресничками. Эвглена зелёная на свету фотосинтезирует, а в темноте питается готовыми веществами. Некоторые простейшие вызывают болезни: малярийного плазмодия переносят комары.',
 ex:['Амёба живёт в прудах и лужах','Малярия передаётся через укус комара'],tip:'Простейшие — не бактерии: у них есть ядро.',
 qs:[['Чем передвигается амёба?','Ложноножками','Ресничками','Плавниками','Цитоплазма перетекает в выступ клетки.'],['Кто из простейших может фотосинтезировать?','Эвглена зелёная','Амёба','Инфузория-туфелька','У эвглены есть хлоропласты.'],
  ['tf','Простейшие — одноклеточные организмы с ядром.',true,'Поэтому их относят к эукариотам.'],['in','Как называется простейшее, покрытое ресничками и похожее на туфельку?',['инфузория','инфузория-туфелька','инфузориятуфелька'],'Инфузория-туфелька.']]},
{id:'bio-vitamins',g:8,title:'Обмен веществ и витамины',sum:'Обмен веществ — все превращения веществ и энергии в организме: из пищи строятся собственные вещества, а при их расщеплении выделяется энергия. Витамины нужны в малых количествах, но без них работа организма нарушается. Витамин C укрепляет иммунитет, его нехватка вызывает цингу. Витамин D помогает усваивать кальций и образуется в коже на солнце. Витамин A нужен для зрения.',
 ex:['Много витамина C в шиповнике, смородине и цитрусовых','Нехватка витамина D у детей вызывает рахит'],tip:'Больше — не значит лучше: избыток некоторых витаминов тоже вреден.',
 qs:[['Нехватка какого витамина вызывает цингу?','C','D','A','Цингой болели моряки в долгих плаваниях.'],['Какой витамин образуется в коже на солнце?','D','C','A','Ультрафиолет запускает его образование.'],
  ['tf','Витамин A нужен для зрения.',true,'При его нехватке хуже видно в сумерках.'],['in','Какой витамин помогает усваивать кальций? Напишите букву.',['d','д'],'Витамин D.']]},
{id:'bio-sexlinked',g:9,title:'Наследование пола',sum:'У человека 23 пары хромосом, одна из них — половые. У женщин две X-хромосомы (XX), у мужчин — X и Y (XY). Яйцеклетка всегда несёт X, а сперматозоид — X или Y, поэтому пол ребёнка определяется сперматозоидом, и вероятность мальчика или девочки около 50%. Гены, лежащие в X-хромосоме, наследуются сцепленно с полом: так передаются дальтонизм и гемофилия.',
 ex:['XX × XY: половина потомков XX, половина XY','Дальтонизм чаще у мужчин: у них одна X-хромосома'],tip:'Сын получает X-хромосому от матери, а Y — от отца. Поэтому признаки из X-хромосомы он наследует от матери.',
 hist:{who:'Томас Морган',years:'1866–1945',bio:'Американский генетик, лауреат Нобелевской премии 1933 года.',how:'В 1910 году в Колумбийском университете Морган нашёл среди мух-дрозофил самца с белыми глазами вместо красных. Скрещивая мух, он увидел, что признак наследуется по-разному у самцов и самок, и доказал, что гены находятся в хромосомах.'},
 qs:[['Какой набор половых хромосом у мужчин?','XY','XX','YY','У женщин XX.'],['Чем определяется пол ребёнка?','Хромосомой сперматозоида','Хромосомой яйцеклетки','Временем года','Яйцеклетка всегда несёт X.'],
  ['tf','Дальтонизм чаще встречается у мужчин.',true,'Ген лежит в X-хромосоме, а у мужчин она одна.'],['in','Сколько пар хромосом у человека?',['23'],'Всего 46 хромосом.']]},
{id:'bio-viruses',g:10,title:'Вирусы',sum:'Вирус — неклеточная форма жизни: молекула ДНК или РНК в белковой оболочке. Вне клетки вирус не размножается. Попав в клетку, он заставляет её производить новые вирусы, и клетка часто гибнет. Вирусы вызывают грипп, корь, ВИЧ-инфекцию. От них защищают прививки и противовирусные средства; антибиотики на вирусы не действуют.',
 ex:['Вирус гриппа быстро меняется, поэтому прививку делают каждый год','Бактериофаги — вирусы, которые поражают бактерии'],tip:'Вирусы намного меньше бактерий: их видно только в электронный микроскоп.',
 hist:{who:'Дмитрий Ивановский',years:'1864–1920',bio:'Русский ботаник и микробиолог.',how:'В 1892 году Ивановский изучал мозаичную болезнь табака. Он пропустил сок больного растения через фильтр, задерживающий бактерии, но сок всё равно заражал здоровые листья. Вывод: болезнь вызывает возбудитель меньше бактерий. Позже такие возбудители назвали вирусами.'},
 qs:[['Из чего состоит вирус?','Нуклеиновая кислота в белковой оболочке','Клетка с ядром','Клетка без ядра','Клеточного строения у вируса нет.'],['Что помогает предупредить вирусную болезнь?','Прививка','Антибиотик','Витамин D','Антибиотики на вирусы не действуют.'],
  ['tf','Вирусы размножаются вне клеток.',false,'Только внутри клетки-хозяина.'],['in','Как называются вирусы, поражающие бактерии?',['бактериофаги','бактериофаг','фаги'],'Бактериофаги.']]},
{id:'bio-populations',g:11,title:'Экологические факторы и популяции',sum:'Экологические факторы делят на абиотические (свет, температура, влажность), биотические (влияние других организмов) и антропогенные (деятельность человека). Фактор, который сильнее всего отклоняется от нормы, ограничивает жизнь организма — это ограничивающий фактор. Популяция — группа особей одного вида на общей территории. Её численность зависит от рождаемости, смертности и переселений.',
 ex:['В пустыне ограничивающий фактор — вода','Число зайцев и рысей колеблется: больше зайцев — больше рысей, затем зайцев становится меньше'],tip:'Ограничивающим становится тот фактор, которого не хватает больше всего, даже если остальных в избытке.',
 qs:[['Какой фактор абиотический?','Температура','Хищник','Вырубка леса','Абиотические — факторы неживой природы.'],['Что такое популяция?','Особи одного вида на общей территории','Все организмы леса','Один организм','Особи популяции скрещиваются между собой.'],
  ['tf','Вырубка леса — антропогенный фактор.',true,'Он связан с деятельностью человека.'],['in','В популяции было 100 особей, за год родилось 30 и погибло 20. Сколько особей стало?',['110'],'100 + 30 − 20.']]}
]};
var LOGIC9=[
[1,{id:'logic-analogies',title:'Аналогии',sum:'Аналогия — перенос отношения с одной пары на другую. Чтобы решить задачу «A : B = C : ?», сформулируйте отношение первой пары одним предложением («A — жилище B», «A — инструмент для B», «A противоположно B») и примените его ко второй паре. Если подходит несколько ответов, уточните отношение. Такие задания есть в ОРТ, ЕНТ и многих других тестах.',
 ex:['Птица : гнездо = пчела : улей (жилище)','Горячий : холодный = высокий : низкий (противоположность)','Ножницы : резать = кисть : рисовать (инструмент и действие)'],tip:'Отношение важнее темы: «врач : больница» относится к «учитель : школа», хотя медицина и школа не связаны.',
 qs:[['Птица : гнездо = пчела : ?','улей','мёд','цветок','Отношение — жилище.'],['Глаз : видеть = ухо : ?','слышать','звук','голова','Орган и его действие.'],
  ['tf','В аналогии главное — найти отношение внутри первой пары.',true,'Затем его переносят на вторую пару.'],['in','Книга : читать = песня : ?',['петь','слушать'],'Предмет и действие с ним.']]}],
[3,{id:'logic-cause',title:'Причина и совпадение',sum:'Корреляция — связь, при которой две величины меняются вместе. Причина — то, что вызывает следствие. Корреляция ещё не доказывает причину: обе величины может вызывать третий фактор, связь может быть обратной или случайной. Чтобы доказать причину, нужен опыт, в котором меняют только один фактор, или много независимых подтверждений.',
 ex:['Продажи мороженого и число купающихся растут вместе — общая причина: жара','В городах, где больше пожарных, больше пожаров: и то и другое зависит от размера города'],tip:'Увидев связь, спросите себя: нет ли третьего фактора, который влияет на обе величины?',
 qs:[['Летом растут продажи и вентиляторов, и мороженого. В чём причина?','Жара влияет на оба','Вентиляторы вызывают желание есть мороженое','Мороженое заставляет покупать вентиляторы','Это общий третий фактор.'],['Что лучше всего доказывает причинную связь?','Опыт с контрольной группой','Совпадение двух графиков','Мнение друга','В опыте меняют только один фактор.'],
  ['tf','Если две величины растут вместе, одна обязательно вызывает другую.',false,'Связь ещё не доказывает причину.'],['in','«В дни, когда у людей много зонтов, на улице много луж». Это корреляция или причина?',['корреляция'],'И зонты, и лужи вызывает дождь.']]}],
[2,{id:'logic-games',title:'Игры и выигрышные стратегии',sum:'В играх двух игроков ищут выигрышную стратегию — план, который приводит к победе при любых ходах соперника. Главный приём — анализ с конца. Позиция проигрышная, если любой ход из неё ведёт в выигрышную для соперника, и выигрышная, если есть ход в проигрышную. Часто помогает симметрия или «дополнение» хода соперника до постоянного числа.',
 ex:['В кучке 21 камень, за ход берут от 1 до 3, взявший последний побеждает. Первый берёт 1, а потом дополняет ход соперника до 4 и оставляет ему 16, 12, 8, 4 и 0 камней.'],tip:'Ищите ключевые позиции, кратные сумме «ход + ответ», — их выгодно оставлять сопернику.',
 qs:[['В кучке 8 камней, берут по 1–3, взявший последний побеждает. Кто выиграет при правильной игре?','Второй игрок','Первый игрок','Зависит от удачи','8 кратно 4: второй дополняет каждый ход соперника до 4.'],['Что такое выигрышная стратегия?','План, который побеждает при любых ходах соперника','Самый быстрый ход','Ход наугад','Она работает против любой игры соперника.'],
  ['tf','Анализ с конца — полезный приём в играх.',true,'Выигрышные позиции определяют, начиная с финала.'],['in','В кучке 13 камней, берут по 1–3, взявший последний побеждает. Сколько камней должен взять первый игрок первым ходом?',['1'],'Нужно оставить 12 — число, кратное 4.']]}],
[2,{id:'logic-invariant',title:'Инварианты',sum:'Инвариант — величина, которая не меняется при разрешённых действиях. Если в начале и в конце она разная, перейти от одного к другому невозможно. Частые инварианты: чётность, остаток от деления, сумма чисел, цвет клетки на шахматной доске.',
 ex:['На доске числа от 1 до 10. Разрешено стереть два числа и записать их разность. Чётность суммы не меняется, а сумма 55 нечётна — значит, последнее оставшееся число нечётно.','Ход конём всегда меняет цвет клетки.'],tip:'Если спрашивают «можно ли когда-нибудь получить…», ищите то, что не меняется.',
 qs:[['Как меняется цвет клетки под конём после хода?','Всегда меняется','Никогда не меняется','Как повезёт','Конь всегда ходит на клетку другого цвета.'],['Что такое инвариант?','Величина, не меняющаяся при разрешённых действиях','Самое большое число','Любое правило','Он помогает доказывать, что что-то невозможно.'],
  ['tf','Конь может вернуться на исходную клетку ровно за 5 ходов.',false,'После нечётного числа ходов цвет клетки другой.'],['in','На доске числа 1, 2, 3, 4. Стирают два числа и пишут их сумму, пока не останется одно. Какое число останется?',['10'],'Сумма не меняется: 1 + 2 + 3 + 4 = 10.']]}]
];
var ENG9=[
[0,{id:'eng-a0-colours',tag:V,title:'Дни, месяцы и цвета',sum:'Дни недели: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday. Месяцы: January, February, March, April, May, June, July, August, September, October, November, December. Цвета: red, blue, green, yellow, black, white, orange, pink, brown, grey. Дни и месяцы в английском всегда пишутся с большой буквы.',
 ex:['My birthday is in May.','I go to the pool on Saturday.','The sky is blue.'],tip:'Wednesday читается [ˈwenzdeɪ]: первая буква d не произносится.',
 qs:[['Какой день идёт после Monday?','Tuesday','Thursday','Sunday','Monday — понедельник, Tuesday — вторник.'],['Как по-английски «зелёный»?','green','grey','yellow','Grey — серый, yellow — жёлтый.'],
  ['tf','Названия месяцев в английском пишутся с маленькой буквы.',false,'С большой: January, May.'],['in','Напишите по-английски первый месяц года.',['january'],'January — январь.']]}],
[1,{id:'eng-a1-object',tag:G,title:'Объектные местоимения: me, him, her',sum:'Объектные местоимения стоят после глагола или предлога: me, you, him, her, it, us, them. Сравните: I love music — Music makes me happy. В роли подлежащего — I, he, she; в роли дополнения — me, him, her.',
 ex:['Can you help me?','I see him every day.','Give it to them.'],tip:'После предлогов with, for, to нужно объектное местоимение: with me, а не with I.',
 qs:[['Please call ___ tomorrow. (я)','me','I','my','После глагола нужно дополнение me.'],['This present is for ___. (она)','her','she','hers','После предлога for — her.'],
  ['tf','«Come with I» — правильно.',false,'После with нужно me.'],['in','Впишите местоимение: I know Tom and Ann. I like ___. (они)',['them'],'«Они» в роли дополнения — them.']]}],
[2,{id:'eng-a2-travel',tag:V,title:'Путешествия и транспорт',sum:'Транспорт: by bus, by train, by plane, by car, on foot (пешком). Полезные слова: ticket — билет, luggage — багаж, passport — паспорт, departure — отправление, arrival — прибытие, platform — платформа, gate — выход на посадку. Фразы: How much is a ticket to…? What time does the train leave? Where is the bus stop?',
 ex:['I go to school by bus.','The plane leaves from gate 5.','We walked there on foot.'],tip:'Говорят by car и by bus, но on foot — без by.',
 qs:[['Как сказать «пешком»?','on foot','by foot','with foot','Устойчивое выражение — on foot.'],['Что значит luggage?','Багаж','Билет','Паспорт','Luggage — сумки и чемоданы.'],
  ['tf','Arrival — это прибытие.',true,'Departure — отправление.'],['in','Впишите предлог: I travel to work ___ train.',['by'],'By train — на поезде.']]}],
[3,{id:'eng-b1-tags',tag:G,title:'Разделительные вопросы',sum:'Разделительный вопрос — короткий «хвостик» в конце предложения: «не так ли?». Если утверждение положительное, хвост отрицательный, и наоборот. В хвосте повторяют вспомогательный глагол и местоимение: You are tired, aren\'t you? She doesn\'t eat meat, does she? Исключение: I am…, aren\'t I?',
 ex:['It\'s cold, isn\'t it?','They went home, didn\'t they?','You can swim, can\'t you?'],tip:'Если в предложении нет вспомогательного глагола, в хвосте появляется do, does или did.',
 qs:[['She likes tea, ___?','doesn\'t she','isn\'t she','don\'t she','Present Simple с she — does.'],['You haven\'t seen it, ___?','have you','haven\'t you','do you','Отрицательное утверждение — положительный хвост.'],
  ['tf','«I am right, aren\'t I?» — правильно.',true,'Это исключение для I am.'],['in','Допишите хвост: They were late, ___ they?',['weren\'t','were not'],'Положительное утверждение — отрицательный хвост.']]}],
[4,{id:'eng-b2-mixed',tag:G,title:'Смешанные условные предложения',sum:'Смешанные условные предложения соединяют разное время в условии и в результате. Условие в прошлом, результат сейчас: If + Past Perfect, would + глагол — If I had studied medicine, I would be a doctor now. Условие постоянное, результат в прошлом: If + Past Simple, would have + третья форма — If I were braver, I would have said it.',
 ex:['If she had taken the map, she wouldn\'t be lost now.','If he weren\'t so shy, he would have asked her.'],tip:'Ищите подсказки времени: now и today указывают на настоящий результат, yesterday и last year — на прошлый.',
 qs:[['If I ___ breakfast, I wouldn\'t be hungry now.','had eaten','ate','have eaten','Условие в прошлом, результат сейчас.'],['If I spoke French, I ___ the job last year.','would have got','would get','will get','Постоянное условие, результат в прошлом.'],
  ['tf','В смешанных условных предложениях время условия и результата может различаться.',true,'Поэтому они и называются смешанными.'],['in','Впишите глагол: If you had listened, you ___ (know) the answer now.',['would know','\'d know'],'Результат в настоящем — would + глагол.']]}],
