{id:'phys-free-fall',g:9,lab:'phys-energy-law',title:'Свободное падение',sum:'Свободное падение — движение только под действием силы тяжести. Без сопротивления воздуха все тела падают с одинаковым ускорением g ≈ 9,8 м/с² (в задачах часто берут 10 м/с²), независимо от массы. Из состояния покоя: v = g · t, h = g · t² / 2. Тело, брошенное вверх со скоростью v₀, поднимается на высоту v₀² / (2g).',
 ex:['За 3 с падения: v = 10 · 3 = 30 м/с, h = 10 · 9 / 2 = 45 м','Опыт Галилея: в трубке без воздуха перо и монета падают одновременно'],tip:'Тяжёлое тело не падает быстрее лёгкого: разница бывает только из-за сопротивления воздуха.',
 qs:[['Скорость тела через 4 с свободного падения (g = 10 м/с²):','40 м/с','20 м/с','80 м/с','v = g · t.'],['Путь за 2 с свободного падения из покоя (g = 10 м/с²):','20 м','10 м','40 м','h = 10 · 4 / 2 = 20 м.'],
  ['tf','В вакууме молоток и перо падают с одинаковым ускорением.',true,'Это показали и астронавты на Луне.'],['in','Мяч бросили вверх со скоростью 20 м/с. На какую высоту (м) он поднимется? g = 10 м/с².',['20','20м'],'h = v² / (2g) = 400 / 20 = 20 м.']]},
{id:'phys-lorentz',g:11,title:'Сила Ампера и сила Лоренца',sum:'Магнитное поле действует на проводник с током с силой Ампера: F = B · I · l · sin α, где α — угол между проводником и линиями поля. На движущийся заряд действует сила Лоренца: F = q · v · B · sin α. Направление определяют правилом левой руки. Сила Лоренца перпендикулярна скорости, поэтому заряд в однородном поле движется по окружности, а модуль его скорости не меняется.',
 ex:['B = 0,5 Тл, I = 4 А, l = 0,2 м, α = 90°: F = 0,4 Н','На этом принципе работают электродвигатели','Полярное сияние: частицы солнечного ветра закручиваются в магнитном поле Земли'],tip:'Если проводник параллелен линиям поля (α = 0), сила Ампера равна нулю.',
 qs:[['B = 0,2 Тл, I = 5 А, l = 0,5 м, проводник перпендикулярен полю. Сила Ампера:','0,5 Н','5 Н','0,05 Н','F = 0,2 · 5 · 0,5 = 0,5 Н.'],['Чем определяют направление силы Ампера?','правилом левой руки','правилом буравчика','правилом правой руки','Линии поля входят в ладонь, четыре пальца — по току.'],
  ['tf','Сила Лоренца меняет модуль скорости заряда.',false,'Она перпендикулярна скорости и меняет только направление.'],['in','Проводник параллелен линиям поля. Чему равна сила Ампера (Н)?',['0'],'sin 0° = 0.']]}
],
chem:[
{id:'chem-separation',g:7,title:'Способы разделения смесей',sum:'Смеси разделяют, используя различия в свойствах веществ. Отстаивание и фильтрование отделяют нерастворимые вещества — например, песок от воды. Выпаривание выделяет растворённое твёрдое вещество — соль из раствора. Перегонка (дистилляция) разделяет жидкости с разной температурой кипения. Магнитом отделяют железо, а делительной воронкой — несмешивающиеся жидкости, например масло и воду.',
 ex:['Смесь соли и песка: растворить в воде, отфильтровать песок, выпарить соль','Дистиллированную воду получают перегонкой','Железные опилки из смеси с серой отделяют магнитом'],tip:'Фильтр задерживает только нерастворимые частицы: растворённую соль фильтрованием не отделить.',
 qs:[['Как получить соль из солёной воды?','выпариванием','фильтрованием','магнитом','Вода испаряется, соль остаётся.'],['Как отделить железные опилки от песка?','магнитом','выпариванием','перегонкой','Железо притягивается к магниту.'],
  ['tf','Растворённый сахар можно отделить от воды фильтрованием.',false,'Растворённые частицы проходят через фильтр.'],['in','Как называют разделение жидкостей по температуре кипения? Одно слово.',['перегонка','дистилляция'],'Перегонка, или дистилляция.']]},
{id:'chem-mass-law',g:7,title:'Закон сохранения массы',sum:'Масса веществ, вступивших в реакцию, равна массе веществ, получившихся в результате реакции. Закон открыли М. В. Ломоносов (1756) и А. Лавуазье (1789). Атомы при реакции не исчезают и не появляются, они только перегруппировываются. Поэтому в уравнении реакции число атомов каждого элемента слева и справа должно быть одинаковым — уравнение уравнивают коэффициентами.',
 ex:['Сожгли 12 г угля в 32 г кислорода — получилось 44 г углекислого газа','2H₂ + O₂ = 2H₂O: слева 4 атома H и 2 атома O, справа столько же'],tip:'Если масса будто «пропала», значит, газ ушёл в воздух: в закрытом сосуде масса не меняется.',
 qs:[['В реакцию вступили 56 г железа и 32 г серы. Масса сульфида железа:','88 г','24 г','56 г','56 + 32 = 88 г.'],['Кто вместе с Лавуазье открыл закон сохранения массы?','Ломоносов','Менделеев','Бойль','Ломоносов сформулировал закон раньше Лавуазье.'],
  ['tf','Свеча при горении теряет массу, и это нарушает закон сохранения массы.',false,'Продукты горения — газы — уходят в воздух.'],['in','10 г вещества A прореагировали с B, получилось 25 г продукта. Сколько граммов B вступило в реакцию?',['15'],'25 − 10 = 15 г.']]},
{id:'chem-bases',g:8,title:'Основания',sum:'Основания — сложные вещества из атома металла и одной или нескольких гидроксогрупп OH: NaOH, Ca(OH)₂, Fe(OH)₃. Растворимые в воде основания называют щелочами: NaOH, KOH, Ca(OH)₂. Щёлочи окрашивают фенолфталеин в малиновый цвет, а лакмус — в синий. Основания реагируют с кислотами — это реакция нейтрализации, в ней образуются соль и вода.',
 ex:['NaOH + HCl = NaCl + H₂O — нейтрализация','Cu(OH)₂ — нерастворимое основание голубого цвета','Ca(OH)₂ — гашёная известь'],tip:'Щёлочь — только растворимое основание: Fe(OH)₃ и Cu(OH)₂ — основания, но не щёлочи.',
 qs:[['Какое вещество — щёлочь?','KOH','Cu(OH)₂','HCl','KOH хорошо растворим в воде.'],['В какой цвет щёлочь окрашивает фенолфталеин?','малиновый','синий','бесцветный','В щелочной среде фенолфталеин малиновый.'],
  ['tf','При реакции основания с кислотой образуются соль и вода.',true,'Это реакция нейтрализации.'],['in','Сколько гидроксогрупп OH в формуле Ca(OH)₂?',['2','две'],'Индекс 2 за скобкой.']]},
{id:'chem-isotopes',g:8,title:'Изотопы',sum:'Изотопы — атомы одного элемента с одинаковым числом протонов, но разным числом нейтронов. Заряд ядра и химические свойства у них одинаковые, а масса разная. У водорода три изотопа: протий ¹H (0 нейтронов), дейтерий ²H (1 нейтрон) и тритий ³H (2 нейтрона). Относительная атомная масса в таблице Менделеева — среднее с учётом распространённости изотопов, поэтому она часто дробная, как у хлора 35,5.',
 ex:['¹²C и ¹⁴C — изотопы углерода: 6 и 8 нейтронов','По изотопу ¹⁴C определяют возраст древних находок'],tip:'Порядковый номер (число протонов) у изотопов одинаковый — меняется только массовое число.',
 qs:[['Чем отличаются изотопы одного элемента?','числом нейтронов','числом протонов','числом электронов','Протонов столько же, нейтронов — разное число.'],['Сколько нейтронов в ядре ¹⁴C (Z = 6)?','8','6','14','14 − 6 = 8.'],
  ['tf','Дейтерий — изотоп водорода.',true,'В его ядре 1 протон и 1 нейтрон.'],['in','Сколько нейтронов в ядре изотопа ³⁷Cl (Z = 17)?',['20'],'37 − 17 = 20.']]},
{id:'chem-ion-exchange',g:9,title:'Реакции ионного обмена',sum:'В растворах электролиты обмениваются ионами. Реакция ионного обмена идёт до конца, если образуется осадок, газ или малодиссоциирующее вещество, например вода. Сначала пишут молекулярное уравнение, затем полное ионное (растворимые сильные электролиты — в виде ионов) и сокращённое ионное, убрав одинаковые ионы слева и справа. Растворимость проверяют по таблице растворимости.',
 ex:['BaCl₂ + Na₂SO₄ = BaSO₄↓ + 2NaCl; сокращённо Ba²⁺ + SO₄²⁻ = BaSO₄↓','Na₂CO₃ + 2HCl = 2NaCl + H₂O + CO₂↑','NaOH + HCl: H⁺ + OH⁻ = H₂O'],tip:'Если все продукты растворимы и нет ни газа, ни воды, реакция не идёт: в растворе остаются те же ионы.',
 qs:[['Какая пара веществ даёт осадок?','AgNO₃ и NaCl','NaCl и KNO₃','HCl и NaNO₃','AgCl нерастворим.'],['Сокращённое ионное уравнение нейтрализации:','H⁺ + OH⁻ = H₂O','Na⁺ + Cl⁻ = NaCl','H₂ + O = H₂O','Нейтрализация сводится к образованию воды.'],
  ['tf','Реакция между растворами NaCl и KNO₃ идёт до конца.',false,'Все возможные продукты растворимы.'],['in','Какой газ выделяется при реакции карбоната натрия с соляной кислотой? Впишите формулу.',['CO2','CO₂'],'Образуется углекислый газ CO₂.']]},
{id:'chem-halogens',g:9,title:'Галогены',sum:'Галогены — элементы VIIA-группы: фтор F, хлор Cl, бром Br, йод I. На внешнем слое у них 7 электронов, поэтому они легко принимают один электрон и являются сильными окислителями. Сверху вниз по группе неметаллические свойства ослабевают: фтор — самый активный неметалл. Хлор — ядовитый жёлто-зелёный газ, бром — красно-бурая жидкость, йод — тёмно-фиолетовые кристаллы. Более активный галоген вытесняет менее активный из солей: Cl₂ + 2KBr = 2KCl + Br₂.',
 ex:['Хлором обеззараживают воду','Спиртовой раствор йода — антисептик','Фторид в зубной пасте укрепляет эмаль'],tip:'Активность галогенов уменьшается от F к I, поэтому йод не может вытеснить хлор из хлорида.',
 qs:[['Самый активный неметалл:','фтор','хлор','йод','Активность галогенов падает сверху вниз.'],['Сколько электронов на внешнем слое атома галогена?','7','1','8','Галогены — VIIA-группа.'],
  ['tf','Бром при комнатной температуре — жидкость.',true,'Это одно из двух жидких при комнатной температуре простых веществ.'],['in','Какой галоген хлор вытесняет из KBr? Впишите название.',['бром','br','br2'],'Cl₂ + 2KBr = 2KCl + Br₂.']]},
{id:'chem-alkali',g:9,title:'Щелочные и щелочноземельные металлы',sum:'Щелочные металлы — литий, натрий, калий и другие элементы IA-группы — имеют один электрон на внешнем слое и легко его отдают. Это мягкие и очень активные металлы: они бурно реагируют с водой, образуя щёлочь и водород: 2Na + 2H₂O = 2NaOH + H₂↑. Их хранят под слоем керосина. Щелочноземельные металлы IIA-группы (Mg, Ca, Ba) отдают два электрона и реагируют спокойнее. Активность растёт сверху вниз по группе.',
 ex:['Калий реагирует с водой бурнее натрия','Ca + 2H₂O = Ca(OH)₂ + H₂↑','Соли натрия окрашивают пламя в жёлтый цвет, соли калия — в фиолетовый'],tip:'Чем ниже металл в группе, тем легче он отдаёт электроны и тем он активнее.',
 qs:[['Что образуется при реакции натрия с водой?','щёлочь и водород','соль и вода','оксид и кислород','2Na + 2H₂O = 2NaOH + H₂.'],['Где хранят натрий?','под слоем керосина','в воде','на открытом воздухе','Натрий реагирует с водой и кислородом воздуха.'],
  ['tf','Калий активнее лития.',true,'Активность растёт сверху вниз по группе.'],['in','Сколько электронов на внешнем слое у атома щелочноземельного металла?',['2','два'],'IIA-группа — два внешних электрона.']]},
{id:'chem-isomers',g:10,title:'Изомерия',sum:'Изомеры — вещества с одинаковым составом (одной молекулярной формулой), но разным строением и потому разными свойствами. Структурная изомерия бывает изомерией углеродного скелета (бутан и изобутан, C₄H₁₀), положения кратной связи или функциональной группы и межклассовой (этанол и диметиловый эфир, C₂H₆O). Пространственная изомерия — например, цис- и транс-изомеры. Чем больше атомов углерода, тем больше изомеров: у C₅H₁₂ их три.',
 ex:['C₄H₁₀: бутан CH₃–CH₂–CH₂–CH₃ и изобутан (2-метилпропан)','C₂H₆O: этанол C₂H₅OH и диметиловый эфир CH₃–O–CH₃','Бутен-1 и бутен-2 различаются положением двойной связи'],tip:'Если молекулярные формулы разные, это не изомеры, а, например, гомологи.',
 qs:[['Изомеры имеют:','одинаковый состав и разное строение','разный состав и одинаковое строение','одинаковые свойства','Поэтому и свойства у них разные.'],['Изомер бутана:','2-метилпропан','пропан','бутен','Оба вещества — C₄H₁₀.'],
  ['tf','Этанол и диметиловый эфир — изомеры.',true,'У обоих формула C₂H₆O.'],['in','Сколько структурных изомеров у пентана C₅H₁₂?',['3','три'],'Пентан, 2-метилбутан и 2,2-диметилпропан.']]},
{id:'chem-oil',g:10,title:'Нефть, природный газ и уголь',sum:'Природные источники углеводородов — нефть, природный газ и каменный уголь. Природный газ в основном состоит из метана CH₄. Нефть — смесь углеводородов, её разделяют перегонкой на фракции: бензин, керосин, дизельное топливо, мазут. Крекинг расщепляет длинные молекулы на короткие и увеличивает выход бензина. Коксованием угля получают кокс для металлургии. Это невозобновляемые ресурсы, а их сжигание даёт углекислый газ.',
 ex:['Бензин выкипает примерно при 40–200 °C, мазут остаётся при перегонке выше 350 °C','C₁₆H₃₄ → C₈H₁₈ + C₈H₁₆ — пример крекинга','Октановое число показывает устойчивость бензина к детонации'],tip:'Перегонка нефти — физический процесс (вещества не меняются), а крекинг — химический.',
 qs:[['Главный компонент природного газа:','метан','этан','бутан','Метана в природном газе до 98%.'],['Как называется расщепление длинных молекул углеводородов?','крекинг','перегонка','полимеризация','Крекинг увеличивает выход бензина.'],
  ['tf','Перегонка нефти — химическая реакция.',false,'Это разделение смеси по температурам кипения.'],['in','Какую фракцию нефти заливают в бак большинства легковых автомобилей? Одно слово.',['бензин'],'Бензин — самая известная фракция.']]},
{id:'chem-catalysis',g:11,title:'Катализ',sum:'Катализатор — вещество, которое ускоряет реакцию, но само в ней не расходуется: он открывает путь с меньшей энергией активации. Ингибитор, наоборот, замедляет реакцию. Катализ бывает гомогенным (катализатор и реагенты в одной фазе) и гетерогенным (например, твёрдый катализатор и газы). Биологические катализаторы — ферменты: они очень избирательны и работают при температуре тела.',
 ex:['2H₂O₂ → 2H₂O + O₂ быстро идёт с MnO₂','В автомобильном нейтрализаторе платина помогает превращать CO в CO₂','Фермент каталаза разлагает пероксид водорода в клетках'],tip:'Катализатор не смещает равновесие: он одинаково ускоряет и прямую, и обратную реакцию.',
 qs:[['Катализатор:','ускоряет реакцию и не расходуется','расходуется в реакции','смещает равновесие','Его масса после реакции та же.'],['Биологические катализаторы — это:','ферменты','гормоны','витамины','Ферменты — белковые катализаторы.'],
  ['tf','Ингибитор замедляет реакцию.',true,'Это противоположность катализатору.'],['in','Какой газ выделяется при разложении пероксида водорода с MnO₂? Впишите формулу.',['O2','O₂','кислород'],'2H₂O₂ → 2H₂O + O₂.']]},
{id:'chem-ph',g:11,lab:'chem-acids',title:'Водородный показатель pH',sum:'pH показывает кислотность раствора. При pH < 7 среда кислая, при pH = 7 — нейтральная, при pH > 7 — щелочная. pH = −lg[H⁺]: если концентрация ионов водорода уменьшилась в 10 раз, pH вырос на 1. Кислотность определяют индикаторами — лакмусом, метиловым оранжевым, универсальной бумагой — или прибором pH-метром.',
 ex:['Желудочный сок — около pH 1–2, чистая вода — 7, мыльный раствор — около 9–10','[H⁺] = 10⁻³ моль/л — pH 3'],tip:'Разница в 1 единицу pH — это разница кислотности в 10 раз.',
 qs:[['Раствор с pH = 3:','кислый','нейтральный','щелочной','pH < 7.'],['pH чистой воды при 25 °C:','7','0','14','Нейтральная среда.'],

bio:[
{id:'bio-symbiosis',g:9,title:'Взаимоотношения организмов',sum:'Организмы в природе связаны разными отношениями. Хищничество — один организм поедает другого. Паразитизм — паразит живёт за счёт хозяина, обычно не убивая его сразу. Конкуренция — виды борются за одну пищу или территорию. Симбиоз (мутуализм) — взаимовыгодное сожительство, например лишайник: гриб и водоросль. Комменсализм — один получает пользу, другому всё равно, как рыбам-прилипалам рядом с акулой.',
 ex:['Клубеньковые бактерии на корнях бобовых дают растению азот, а получают органические вещества — симбиоз','Аскарида в кишечнике человека — паразитизм','Волки и лисы, охотящиеся на зайцев, — конкуренты'],tip:'Паразиту невыгодно быстро убивать хозяина: вместе с хозяином погибнет и он.',
 qs:[['Лишайник — пример:','симбиоза','паразитизма','хищничества','Гриб и водоросль помогают друг другу.'],['Клещ, питающийся кровью собаки, — это:','паразитизм','симбиоз','комменсализм','Клещ живёт за счёт хозяина.'],
  ['tf','При конкуренции два вида используют одни и те же ресурсы.',true,'Поэтому они и конкурируют.'],['in','Как называется взаимовыгодное сожительство разных видов? Одно слово.',['симбиоз','мутуализм'],'Симбиоз, или мутуализм.']]},
{id:'bio-dihybrid',g:9,lab:'bio-genetics',title:'Дигибридное скрещивание',sum:'При дигибридном скрещивании следят сразу за двумя признаками, например за цветом (A — жёлтый, a — зелёный) и формой горошин (B — гладкая, b — морщинистая). Мендель показал, что если гены лежат в разных хромосомах, признаки наследуются независимо (третий закон Менделя). Дигетерозигота AaBb даёт 4 типа гамет: AB, Ab, aB, ab. При скрещивании AaBb × AaBb потомство расщепляется по фенотипу в соотношении 9 : 3 : 3 : 1.',
 ex:['AaBb × AaBb: 9 жёлтых гладких, 3 жёлтых морщинистых, 3 зелёных гладких, 1 зелёная морщинистая','AaBb × aabb (анализирующее скрещивание): 1 : 1 : 1 : 1'],tip:'Число типов гамет равно 2ⁿ, где n — число генов в гетерозиготном состоянии: у AaBb это 2² = 4.',
 qs:[['Сколько типов гамет даёт AaBb?','4','2','8','2² = 4.'],['Расщепление по фенотипу при AaBb × AaBb:','9 : 3 : 3 : 1','3 : 1','1 : 2 : 1','Третий закон Менделя.'],
  ['tf','При анализирующем скрещивании AaBb × aabb расщепление 1 : 1 : 1 : 1.',true,'Каждый тип гамет AaBb проявляется в фенотипе.'],['in','Сколько типов гамет даёт организм AaBbCc?',['8'],'2³ = 8.']]},
{id:'bio-origin-life',g:9,title:'Происхождение жизни на Земле',sum:'Земля образовалась около 4,5 млрд лет назад, а первые живые организмы — бактерии — появились примерно 3,5–4 млрд лет назад. По гипотезе Опарина — Холдейна, жизнь возникла из неживой материи: в первичном океане из простых веществ образовались органические молекулы, а затем первые клетки. В 1953 году Миллер и Юри в опыте с электрическими разрядами получили аминокислоты из смеси газов. Фотосинтезирующие цианобактерии постепенно насытили атмосферу кислородом.',
 ex:['Строматолиты — слоистые известняки, созданные древними цианобактериями','Опыт Миллера — Юри: метан, аммиак, водород и вода + «молнии» → аминокислоты'],tip:'Опыт Миллера показал, что органические вещества могут образоваться без живых организмов, но живую клетку он не создал.',
 qs:[['Какие организмы появились на Земле первыми?','бактерии','рыбы','грибы','Первые организмы были одноклеточными и без ядра.'],['Что получили Миллер и Юри в своём опыте?','аминокислоты','живые клетки','ДНК','Из простых газов под действием разрядов.'],
  ['tf','Кислород в атмосфере появился благодаря фотосинтезу.',true,'Его выделяли цианобактерии, а затем растения.'],['in','Примерно сколько миллиардов лет назад образовалась Земля? Впишите число.',['4,5','4.5'],'Около 4,5 млрд лет назад.']]},
{id:'bio-enzymes',g:10,title:'Ферменты',sum:'Ферменты — белки-катализаторы, которые ускоряют реакции в клетке в миллионы раз. Каждый фермент работает только со своим веществом — субстратом: они подходят друг к другу, как ключ к замку. Лучше всего ферменты работают при определённой температуре и pH; у ферментов человека оптимум — около 37 °C. При сильном нагреве белок фермента разрушается (денатурирует), и фермент перестаёт работать.',
 ex:['Амилаза слюны расщепляет крахмал','Пепсин желудка работает в кислой среде, при pH около 2','Каталаза разлагает пероксид водорода: кусочек картофеля в перекиси «шипит»'],tip:'Фермент не расходуется в реакции и может работать много раз.',
 qs:[['По химической природе большинство ферментов — это:','белки','жиры','углеводы','Ферменты — белковые катализаторы.'],['Фермент слюны, расщепляющий крахмал:','амилаза','пепсин','липаза','Поэтому хлеб, если долго жевать, кажется сладким.'],
  ['tf','При кипячении ферменты обычно перестают работать.',true,'Белок денатурирует.'],['in','При какой температуре (°C) лучше всего работают ферменты человека?',['37','36,6','36.6'],'Температура тела — около 37 °C.']]},
{id:'bio-chromosomes',g:10,title:'Хромосомы и кариотип',sum:'Хромосомы — структуры в ядре из ДНК и белков, в них записаны гены. Набор хромосом клетки называют кариотипом. В соматических клетках человека 46 хромосом — 23 пары (диплоидный набор 2n), а в половых клетках 23 (гаплоидный набор n). 22 пары — аутосомы, одна пара — половые хромосомы: XX у женщин и XY у мужчин. Перед делением хромосома удваивается и состоит из двух хроматид.',
 ex:['У человека 2n = 46, у собаки 2n = 78, у гороха 2n = 14','Синдром Дауна — лишняя 21-я хромосома: 47 вместо 46'],tip:'Число хромосом не говорит о сложности организма: у картофеля их 48, а у человека 46.',
 qs:[['Сколько хромосом в соматической клетке человека?','46','23','48','23 пары.'],['Набор половых хромосом мужчины:','XY','XX','YY','Y-хромосома есть только у мужчин.'],
  ['tf','В яйцеклетке человека 23 хромосомы.',true,'Половые клетки гаплоидны.'],['in','У кошки 2n = 38. Сколько хромосом в её яйцеклетке?',['19'],'n = 38 / 2 = 19.']]},
{id:'bio-reproduction',g:10,title:'Размножение организмов',sum:'Бесполое размножение идёт без гамет: делением клетки (бактерии, амёба), почкованием (гидра, дрожжи), спорами (грибы, мхи) и вегетативно — частями тела (усами, клубнями, черенками). Потомки при этом генетически копируют родителя. При половом размножении сливаются две гаметы и образуется зигота с новым сочетанием генов. Поэтому потомки разнообразны, а это помогает виду приспосабливаться.',
 ex:['Картофель размножают клубнями — вегетативно','Клубника размножается усами','Оплодотворение: яйцеклетка (n) + сперматозоид (n) = зигота (2n)'],tip:'Бесполое размножение быстрее, а половое даёт разнообразие потомства.',
 qs:[['Почкование — это размножение:','бесполое','половое','с помощью гамет','Новая особь вырастает из выроста родителя.'],['Как называется клетка, образованная слиянием гамет?','зигота','спора','почка','Зигота — оплодотворённая яйцеклетка.'],
  ['tf','При вегетативном размножении потомки генетически похожи на родителя.',true,'Они получают те же гены.'],['in','Сколько хромосом в зиготе человека? Впишите число.',['46'],'23 + 23 = 46.']]},
{id:'bio-evidence',g:11,title:'Доказательства эволюции',sum:'Эволюцию подтверждают разные науки. Палеонтология — ископаемые остатки и переходные формы, например археоптерикс между рептилиями и птицами. Сравнительная анатомия — гомологичные органы, разные по виду, но одинаковые по происхождению (рука человека, крыло летучей мыши, ласт кита), и рудименты — органы, утратившие функцию (аппендикс, копчик). Эмбриология — зародыши позвоночных на ранних стадиях очень похожи. Молекулярная биология — чем ближе виды, тем больше сходство их ДНК и белков.',
 ex:['Атавизм — проявление признаков предков, например густой волосяной покров по всему телу','ДНК человека и шимпанзе совпадает примерно на 98–99%'],tip:'Крыло бабочки и крыло птицы — аналогичные, а не гомологичные органы: функция одна, происхождение разное.',
 qs:[['Рука человека и ласт кита — органы:','гомологичные','аналогичные','рудиментарные','Одинаковое происхождение, разная функция.'],['Археоптерикс — переходная форма между:','рептилиями и птицами','рыбами и земноводными','птицами и млекопитающими','У него были перья и зубы.'],
  ['tf','Аппендикс человека — рудимент.',true,'Он почти утратил пищеварительную функцию.'],['in','Как называются органы, утратившие значение в ходе эволюции? Одно слово.',['рудименты','рудимент'],'Например, копчик и аппендикс.']]},
{id:'bio-speciation',g:11,title:'Вид и видообразование',sum:'Вид — совокупность особей, сходных по строению и поведению, которые свободно скрещиваются и дают плодовитое потомство. Новые виды возникают, когда популяции изолированы. При географическом видообразовании популяции разделяет преграда — горы, река, море — и они накапливают различия. При экологическом популяции живут рядом, но в разных условиях или размножаются в разное время. Пример — дарвиновы вьюрки Галапагосских островов с разными клювами.',
 ex:['Мул — потомок лошади и осла — бесплоден, значит лошадь и осёл — разные виды','В озере Байкал в изоляции возникли сотни видов рачков'],tip:'Главный признак вида — репродуктивная изоляция: особи разных видов не дают плодовитого потомства.',
 qs:[['Главный критерий вида:','плодовитое потомство при скрещивании','одинаковый цвет','одинаковый размер','Это репродуктивный критерий.'],['Дарвиновы вьюрки — пример видообразования:','географического','искусственного','полового','Птицы на разных островах изолированы.'],
  ['tf','Мул способен давать потомство.',false,'Мул бесплоден.'],['in','На каких островах Дарвин изучал вьюрков? Одно слово.',['галапагосских','галапагос','галапагосы','галапагосские'],'Галапагосские острова.']]},
{id:'bio-human-biosphere',g:11,title:'Человек и биосфера',sum:'Человек изменяет биосферу сильнее любого другого вида. Вырубка лесов, распашка земель и застройка разрушают места обитания, и виды исчезают. Сжигание топлива увеличивает содержание CO₂ в атмосфере и усиливает парниковый эффект. Пластик и химикаты загрязняют воду и почву. Природу охраняют заповедники и национальные парки, Красная книга, переработка отходов и переход на возобновляемую энергию.',
 ex:['Снежный барс занесён в Красную книгу Казахстана','Озоновый слой разрушали фреоны — их запретили Монреальским протоколом 1987 года','Аральское море обмелело из-за забора воды на орошение'],tip:'Парниковый эффект сам по себе нужен — без него Земля была бы холодной; проблема в его усилении.',
 qs:[['Какой газ от сжигания топлива сильнее всего усиливает парниковый эффект?','CO₂','O₂','N₂','Углекислый газ задерживает тепло.'],['Что защищает Землю от ультрафиолета?','озоновый слой','облака','азот','Озон поглощает УФ-излучение.'],
  ['tf','Снежный барс занесён в Красную книгу.',true,'Это редкий вид гор Центральной Азии.'],['in','Как называется книга, куда заносят редкие и исчезающие виды? Впишите цвет.',['красная'],'Красная книга.']]}
]

var LOGIC13=[
[2,{id:'logic-binary',title:'Двоичная система счисления',sum:'В двоичной системе только две цифры — 0 и 1, а каждый разряд в 2 раза «тяжелее» предыдущего: 1, 2, 4, 8, 16… Число 1011₂ = 8 + 0 + 2 + 1 = 11. Чтобы перевести число в двоичную систему, его делят на 2 и записывают остатки снизу вверх. Компьютеры используют двоичную систему, потому что 0 и 1 легко представить: нет тока — есть ток.',
 ex:['13 = 8 + 4 + 1 = 1101₂','100₂ = 4, 111₂ = 7, 1000₂ = 8','Восемь двоичных разрядов — байт — хранят числа от 0 до 255'],tip:'Разряды считают справа налево: 1, 2, 4, 8…',
 qs:[['Чему равно 101₂ в десятичной системе?','5','101','3','4 + 0 + 1 = 5.'],['Как записать 6 в двоичной системе?','110','101','111','4 + 2 = 6.'],
  ['tf','Наибольшее число из трёх двоичных разрядов — 7.',true,'111₂ = 4 + 2 + 1 = 7.'],['in','Переведите 1001₂ в десятичную систему.',['9'],'8 + 1 = 9.']]}],
[2,{id:'logic-combinatorics',title:'Правило суммы и правило произведения',sum:'Правило произведения: если первое действие можно выполнить m способами, а второе — n способами, то оба по очереди — m · n способами. Правило суммы: если выбирают один предмет из двух непересекающихся групп, способов m + n. Число перестановок n предметов: n! = 1 · 2 · … · n. Эти правила помогают считать варианты, не выписывая их все.',
 ex:['3 футболки и 4 пары брюк: 3 · 4 = 12 нарядов','Из 5 книг и 3 журналов выбрать одно издание: 5 + 3 = 8 способов','Рассадить 4 человек в ряд: 4! = 24'],tip:'Союз «и» обычно означает умножение, «или» — сложение.',
 qs:[['В кафе 3 супа и 5 вторых блюд. Сколько вариантов обеда «суп и второе»?','15','8','35','3 · 5 = 15.'],['Сколько трёхзначных кодов можно составить из цифр 1 и 2?','8','6','3','2 · 2 · 2 = 8.'],
  ['tf','5! = 120.',true,'1 · 2 · 3 · 4 · 5 = 120.'],['in','Сколькими способами можно выбрать одного дежурного из 12 мальчиков и 15 девочек?',['27'],'12 + 15 = 27.']]}],
[3,{id:'logic-statistics-traps',title:'Ловушки статистики и графиков',sum:'Числа и графики можно подать так, что они введут в заблуждение. Ось графика, начинающаяся не с нуля, превращает маленькую разницу в огромную. Среднее значение искажают выбросы: если в класс войдёт миллиардер, «средний доход» станет огромным, хотя никто не разбогател, — тогда честнее медиана. Корреляция не означает причинность. Маленькая выборка и отбор «удобных» данных тоже дают ложные выводы.',
 ex:['«Продажи выросли вдвое» — с 1 до 2 штук','Опрос в спортзале: «90% людей занимаются спортом»','График от 98 до 100 показывает «огромный» рост на 2%'],tip:'Смотрите, с чего начинается ось, кого опрашивали и сколько было наблюдений.',
 qs:[['Зарплаты: 50, 55, 60, 65 и 1000 тысяч. Что лучше описывает типичную зарплату?','медиана','среднее','максимум','Выброс 1000 сильно сдвигает среднее, а медиана — 60.'],['Опрос о любви к чтению провели только в библиотеке. Главная проблема:','выборка не представительна','слишком много вопросов','ответы честные','В библиотеку ходят те, кто любит читать.'],
  ['tf','Если два явления растут вместе, одно обязательно вызывает другое.',false,'Корреляция не означает причинность.'],['in','Числа 2, 3, 4, 5, 100. Найдите медиану.',['4'],'Средний элемент упорядоченного ряда — 4.']]}],
[0,{id:'logic-definitions',title:'Определение и классификация',sum:'Определение раскрывает смысл понятия: обычно называют более общее понятие (род) и отличительный признак (видовое отличие). «Квадрат — это ромб с прямым углом»: ромб — род, прямой угол — отличие. Хорошее определение не должно идти по кругу («логика — наука о логике») и не должно быть слишком широким или узким. Классификация делит понятия на группы по одному основанию; группы не должны пересекаться и вместе должны охватывать всё.',
 ex:['«Треугольник — многоугольник с тремя сторонами»','Треугольники по углам: остроугольные, прямоугольные, тупоугольные — одно основание','Ошибка: делить людей на «школьников и спортсменов» — группы пересекаются'],tip:'В одной классификации нельзя менять основание, например делить книги сразу по цвету и по жанру.',

[0,{id:'eng-a0-this-that',tag:G,title:'This, that, these, those',sum:'This и these указывают на то, что рядом, а that и those — на то, что далеко. This и that — для одного предмета, these и those — для нескольких. Например: This is my book (книга у меня в руках). Those are birds (птицы далеко в небе).',
 ex:['This is my pen.','That is a big house.','These apples are red.','Those boys are my friends.'],tip:'После these и those глагол во множественном числе: These are…, а не These is…',

  ['tf','«These is my book» — правильное предложение.',false,'Правильно: This is my book.'],['in','Впишите слово: ___ are my shoes (обувь рядом со мной).',['these'],'Много предметов рядом — these.']]}],
[1,{id:'eng-a1-can',tag:G,title:'Can: умею и могу',sum:'Can выражает умение или возможность: I can swim. После can глагол стоит без to и без окончаний: She can dance (не cans и не to dance). Отрицание — cannot или can’t: He can’t drive. В вопросе can выходит вперёд: Can you speak English? — Yes, I can. / No, I can’t. Can используют и для просьбы: Can I open the window?',
 ex:['I can play chess.','My sister can’t swim.','Can you help me?'],tip:'He can swims — ошибка: после can глагол всегда в начальной форме.',

  ['tf','«He can plays tennis» — правильно.',false,'Правильно: He can play tennis.'],['in','Впишите краткую отрицательную форму: I ___ (can not) swim.',["can't",'cannot','can’t'],'Can’t = cannot.']]}],
[1,{id:'eng-a1-frequency',tag:G,title:'Наречия частоты',sum:'Наречия частоты показывают, как часто что-то происходит: always (всегда), usually (обычно), often (часто), sometimes (иногда), rarely (редко), never (никогда). Обычно они стоят перед основным глаголом: I often read books. Но после глагола to be: She is always happy. Sometimes может стоять и в начале предложения.',
 ex:['I always get up at 7.','He is never late.','We usually have lunch at school.'],tip:'С never не нужно второе отрицание: I never eat fish, а не I don’t never eat.',
 qs:[['She ___ late (никогда не опаздывает).','is never','never is','does never','После to be наречие идёт после глагола.'],['I ___ (всегда) drink tea in the morning.','always','never','rarely','Always — всегда.'],
  ['tf','«I don’t never watch TV» — правильно.',false,'Двойное отрицание в английском не используют.'],['in','Переведите одним словом: «иногда».',['sometimes'],'Sometimes — иногда.']]}],
[2,{id:'eng-a2-too-enough',tag:G,title:'Too и enough',sum:'Too означает «слишком» и стоит перед прилагательным: The tea is too hot (чай слишком горячий, пить нельзя). Enough означает «достаточно» и стоит после прилагательного: He is old enough to drive. Перед существительным enough ставят впереди: We have enough time. Not … enough — «недостаточно»: The room isn’t big enough.',
 ex:['These shoes are too small for me.','She is tall enough to play basketball.','I don’t have enough money.'],tip:'Прилагательное + enough, но enough + существительное: old enough, enough water.',

  ['tf','«We have enough chairs» — правильно.',true,'Перед существительным enough стоит впереди.'],['in','Впишите слово: The water is ___ cold to swim (слишком холодная).',['too'],'Too cold — слишком холодная.']]}],
[3,{id:'eng-b1-past-perfect',tag:G,title:'Past Perfect',sum:'Past Perfect показывает действие, которое случилось раньше другого действия в прошлом. Образуется так: had + третья форма глагола: I had finished my homework before Mum came. Часто используется со словами before, after, by the time, already, when. Отрицание — hadn’t, вопрос — Had you…?',
 ex:['When we arrived, the film had already started.','She had never seen the sea before 2020.','By the time I got home, everyone had gone to bed.'],tip:'Если действия идут просто по порядку, Past Perfect не нужен: I came home and had dinner.',

  ['tf','Past Perfect образуется с помощью had и третьей формы глагола.',true,'had + V3.'],['in','Впишите форму: By 9 pm we ___ (finish) the project.',['had finished'],'К моменту в прошлом — had finished.']]}],
[4,{id:'eng-b2-modals-past',tag:G,title:'Модальные глаголы о прошлом',sum:'Модальный глагол + have + третья форма говорит о прошлом. Should have done — «следовало сделать» (но не сделали): You should have called me. Must have done — «наверняка сделал»: He must have forgotten. Can’t have done — «не мог сделать»: She can’t have seen us. Might/could have done — «возможно, сделал» или «мог бы сделать».',

  ['tf','«She can’t have seen us» значит «она не могла нас видеть».',true,'Это уверенность, что этого не было.'],['in','Впишите целиком: I ___ (should / tell) you the truth.',['should have told'],'should + have + told.']]}],
[4,{id:'eng-b2-causative',tag:G,title:'Have something done',sum:'Конструкция have + предмет + третья форма означает, что действие для вас сделал кто-то другой: I had my hair cut — меня подстригли (а не я сам). Её используют в любом времени: I’m having my car repaired, We will have the house painted. В разговорной речи вместо have часто говорят get: I got my phone fixed.',

[5,{id:'eng-c1-passive-reporting',tag:G,title:'It is said that…: безличный пассив',sum:'Чтобы передать мнение многих людей, не называя их, используют безличный пассив: It is said that he is rich. Другой вариант — с подлежащим и инфинитивом: He is said to be rich. Так же работают believe, think, know, report, expect: The prices are expected to rise. Для событий в прошлом нужен перфектный инфинитив: She is believed to have left the country.',

var MORE16=[
{id:'math-combinatorics',g:10,title:'Комбинаторика: перестановки, размещения, сочетания',
 sum:'Комбинаторика считает, сколькими способами можно что-то выбрать или расставить. Правило произведения: если первое действие можно сделать m способами, а второе — n способами, то оба вместе — m · n способами. Перестановки: n разных предметов можно расставить по порядку Pₙ = n! = 1 · 2 · … · n способами (0! = 1). Размещения: выбрать k предметов из n, когда порядок важен, — Aₙᵏ = n! / (n − k)! = n · (n − 1) · … (k множителей). Сочетания: выбрать k из n, когда порядок не важен, — Cₙᵏ = n! / (k! · (n − k)!). Главный вопрос в каждой задаче: изменится ли ответ, если поменять выбранных местами?',
 ex:['5 разных книг на полке: P₅ = 5! = 120 способов','Из 20 учеников выбрать старосту и заместителя (роли разные, порядок важен): A₂₀² = 20 · 19 = 380','Из 10 учеников выбрать 3 дежурных (роли одинаковые): C₁₀³ = 10 · 9 · 8 / (1 · 2 · 3) = 120','Трёхзначные числа из цифр 1, 2, 3, 4, 5 без повторов: A₅³ = 5 · 4 · 3 = 60'],
 tip:'Если поменять выбранных местами и получится то же самое (два дежурных, три пункта меню) — это сочетания, делите на k!. Если получится другое (капитан и вратарь, цифры в числе) — размещения.',

  ['Чем размещения отличаются от сочетаний?','В размещениях важен порядок','В сочетаниях важен порядок','Ничем','Aₙᵏ учитывает порядок, поэтому Aₙᵏ = Cₙᵏ · k!.'],
  ['tf','0! = 0.',false,'По определению 0! = 1: пустой набор можно расставить одним способом.'],

  ['in','Из 6 кандидатов выбирают президента и секретаря клуба. Сколько способов?',['30'],'Роли разные, порядок важен: A₆² = 6 · 5 = 30.']]},
{id:'math-binomial',g:10,title:'Бином Ньютона и треугольник Паскаля',

  ['Коэффициент при a²b² в (a + b)⁴:','6','4','2','C₄² = 4 · 3 / 2 = 6.'],

function xp(v,e){return e===1?v:v+sup(e);}
function fact(n){var f=1;for(var i=2;i<=n;i++)f*=i;return f;}
function cC(n,k){var r=1;for(var i=1;i<=k;i++)r=r*(n-k+i)/i;return Math.round(r);}
function cA(n,k){var r=1;for(var i=0;i<k;i++)r*=n-i;return r;}
add('math-combinatorics',[function(n){

  if(k===0){var p=gR(3,7),obj=gP(['книг на полке','человек в очереди','учеников в ряд на фото','разных цветов в линию']);
    return T('Сколькими способами можно расставить '+p+' '+obj+'?',fact(p),'',gW(fact(p),[p*p,fact(p-1),p*(p-1)]),'Это перестановки: P'+sub(p)+' = '+p+'! = '+fact(p)+'.');}
  if(k===1){var N=gR(5,15),roles=gP([['капитана','вратаря'],['старосту','заместителя'],['президента','секретаря'],['ведущего','помощника']]);
    return T('Из '+N+' учеников выбирают '+roles[0]+' и '+roles[1]+'. Сколько способов?',cA(N,2),'',gW(cA(N,2),[cC(N,2),N*2,N*N]),'Роли разные, порядок важен — размещения: A = '+N+' · '+(N-1)+' = '+cA(N,2)+'.');}
  if(k===2){var M=gR(6,12),kk=gP([2,3]);
    return T('Из '+M+' учеников нужно выбрать '+kk+' дежурных (роли одинаковые). Сколько способов?',cC(M,kk),'',gW(cC(M,kk),[cA(M,kk),M*kk]),'Порядок не важен — сочетания: C = '+cA(M,kk)+' / '+kk+'! = '+cA(M,kk)+' / '+fact(kk)+' = '+cC(M,kk)+'.');}
  if(k===3){var d=gR(4,7),len=gP([2,3]);
    return T('Сколько '+(len===2?'двузначных':'трёхзначных')+' чисел можно составить из цифр 1–'+d+', если цифры не повторяются?',cA(d,len),'',gW(cA(d,len),[Math.pow(d,len),cC(d,len)]),'Порядок цифр важен — размещения: A = '+(len===2?d+' · '+(d-1):d+' · '+(d-1)+' · '+(d-2))+' = '+cA(d,len)+'.');}
  var a=gR(2,5),b=gR(2,6),c=gR(2,4);
  return T('В кафе '+a+' супа, '+b+' вторых блюд и '+c+' напитка. Сколько разных обедов «суп + второе + напиток»?',a*b*c,'',gW(a*b*c,[a+b+c,a*b+c]),'Правило произведения: '+a+' · '+b+' · '+c+' = '+(a*b*c)+'.');
}]);

note:'Темы подобраны по программе 9709. Перед экзаменом сверяйтесь с официальным syllabus и прошлыми экзаменационными работами (past papers) на сайте Cambridge.',
sections:[
{title:'Pure Mathematics 1 (AS)',topics:[
{id:'alm-quadratics',tag:'P1',title:'Quadratics',

  ['For which k > 0 does x² + kx + 9 = 0 have equal roots?','6','3','9','b² − 4ac = k² − 36 = 0, k = 6.'],

  ['tf','If the discriminant is negative, the graph of y = ax² + bx + c does not meet the x-axis.',true,'No real roots — no x-intercepts.'],
  ['tf','The line y = 2x + c is a tangent to y = x² when c = −1.',true,'x² − 2x − c = 0, discriminant 4 + 4c = 0, c = −1.'],
  ['in','Find the y-coordinate of the minimum point of y = x² − 10x + 30.',['5'],'(x − 5)² + 5: minimum point (5, 5).']]},
{id:'alm-functions',tag:'P1',title:'Functions',
 sum:'Функция f переводит область определения (domain) в множество значений (range). Обратная функция f⁻¹ есть только у взаимно однозначной (one-one) функции: поменяйте x и y и выразите y; график f⁻¹ — отражение графика f в прямой y = x, а domain f⁻¹ = range f. Композиция fg(x) = f(g(x)): сначала g, потом f. Преобразования графиков: y = f(x) + a — сдвиг вверх на a; y = f(x + a) — сдвиг влево на a; y = af(x) — растяжение вдоль оси y (stretch parallel to the y-axis); y = f(ax) — растяжение с коэффициентом 1/a вдоль оси x; y = −f(x) — отражение в оси x.',

{id:'alm-coord',tag:'P1',title:'Coordinate geometry',

{id:'alm-trig',tag:'P1',title:'Trigonometry',

 ex:['sin x = 0.5, 0° ≤ x ≤ 360°: x = 30°, 150°','2cos²x + sin x = 1 ⇒ 2sin²x − sin x − 1 = 0 ⇒ sin x = 1 or −½','cos x = −0.5: x = 120°, 240°'],
 tip:'Не теряйте решения: после principal value всегда проверьте весь заданный интервал.',

  ['Solve cos x = 0.5 for 0° ≤ x ≤ 360°.','60° and 300°','60° and 120°','30° and 330°','cos x = k ⇒ x and 360° − x.'],
  ['Simplify (1 − cos²θ)/sin θ.','sin θ','cos θ','1','1 − cos²θ = sin²θ.'],
  ['tf','sin 120° = sin 60°.',true,'sin(180° − x) = sin x.'],
  ['tf','The period of y = tan x is 360°.',false,'It is 180°.'],

{id:'alm-series',tag:'P1',title:'Series: binomial expansion, AP and GP',
 sum:'Бином: (a + b)ⁿ = Σ ⁿCᵣ aⁿ⁻ʳ bʳ. Арифметическая прогрессия (AP): uₙ = a + (n − 1)d, Sₙ = n/2 · (2a + (n − 1)d). Геометрическая прогрессия (GP): uₙ = arⁿ⁻¹, Sₙ = a(1 − rⁿ)/(1 − r). Сумма бесконечной GP (sum to infinity) S∞ = a/(1 − r) существует только при |r| < 1.',
 ex:['Term in x² in (2 + x)⁵: ⁵C₂ · 2³ · x² = 80x²','AP a = 3, d = 4: S₁₀ = 5 · (6 + 36) = 210','GP 12, 6, 3, …: S∞ = 12/(1 − ½) = 24'],
 tip:'Sum to infinity существует только при |r| < 1 — пишите это условие в решении.',
 qs:[['Coefficient of x² in (1 + 3x)⁴:','54','36','12','⁴C₂ · 3² = 6 · 9 = 54.'],
  ['AP with a = 5, d = 3. Find u₂₀.','62','65','60','5 + 19 · 3 = 62.'],
  ['Sum to infinity of 8 + 4 + 2 + …','16','14','It does not exist','a/(1 − r) = 8/(1 − ½) = 16.'],
  ['tf','A GP with r = 1.5 has a sum to infinity.',false,'Need |r| < 1.'],
  ['tf','(a + b)⁷ has 8 terms.',true,'n + 1 terms.'],
  ['in','Find S₁₀ for the AP 2, 5, 8, …',['155'],'S₁₀ = 10/2 · (4 + 27) = 155.']]},
{id:'alm-diff1',tag:'P1',title:'Differentiation',
 sum:'d/dx (xⁿ) = nxⁿ⁻¹. Производная dy/dx — gradient кривой. Касательная (tangent): y − y₁ = m(x − x₁); у нормали (normal) gradient −1/m. Стационарные точки (stationary points): dy/dx = 0; характер по второй производной: d²y/dx² > 0 — minimum, < 0 — maximum. Chain rule: d/dx (ax + b)ⁿ = an(ax + b)ⁿ⁻¹. Функция возрастает (increasing), где dy/dx > 0. Связанные скорости (connected rates of change): dA/dt = dA/dr · dr/dt.',
 ex:['y = x³ − 3x: y′ = 3x² − 3 = 0 ⇒ x = ±1; y″ = 6x: x = 1 minimum, x = −1 maximum','y = (2x + 1)⁴: y′ = 8(2x + 1)³','y = √x = x^½: y′ = 1/(2√x)'],
 tip:'Сначала запишите корни и дроби как степени: 1/x² = x⁻², √x = x^½ — и только потом дифференцируйте.',
 qs:[['dy/dx for y = 4x³ − 2x + 7:','12x² − 2','12x² − 2x','4x² − 2','Power rule term by term.'],
  ['Gradient of y = x² + 3x at x = 2:','7','10','4','y′ = 2x + 3 = 7.'],
  ['dy/dx for y = (3x − 1)⁵:','15(3x − 1)⁴','5(3x − 1)⁴','15(3x − 1)⁵','Chain rule: 5 · 3 · (3x − 1)⁴.'],
  ['tf','If d²y/dx² > 0 at a stationary point, it is a maximum.',false,'Positive second derivative means a minimum.'],
  ['tf','The normal to a curve is perpendicular to the tangent.',true,'Normal gradient = −1/m.'],
  ['in','y = x² − 8x + 1. At which x is the stationary point?',['4'],'2x − 8 = 0.']]},
{id:'alm-int1',tag:'P1',title:'Integration',
 sum:'∫xⁿ dx = xⁿ⁺¹/(n + 1) + c при n ≠ −1; ∫(ax + b)ⁿ dx = (ax + b)ⁿ⁺¹/(a(n + 1)) + c. Если известен gradient и точка на кривой — интегрируйте и найдите c по точке. Определённый интеграл — площадь под кривой; часть под осью x даёт отрицательное значение. Площадь между кривыми ∫(верхняя − нижняя) dx. Объём тела вращения (volume of revolution) вокруг оси x: V = π∫y² dx, вокруг оси y: V = π∫x² dy.',
 ex:['∫(6x² + 2) dx = 2x³ + 2x + c','∫₀² x³ dx = [x⁴/4]₀² = 4','dy/dx = 2x through (1, 5): y = x² + 4'],
 tip:'Не забывайте + c в неопределённом интеграле — за это снимают балл.',
 qs:[['∫ 3x² dx =','x³ + c','6x + c','3x³ + c','3 · x³/3 = x³.'],
  ['∫₁³ 2x dx =','8','9','4','[x²]₁³ = 9 − 1.'],
  ['Volume when y = x, 0 ≤ x ≤ 3, is rotated 360° about the x-axis:','9π','3π','27π','π∫₀³ x² dx = π · 27/3 = 9π.'],
  ['tf','∫ x⁻¹ dx can be found with xⁿ⁺¹/(n + 1).',false,'n = −1 is excluded; the answer is ln|x| (Pure 3).'],
  ['tf','Area below the x-axis gives a negative definite integral.',true,'Take the modulus for the area.'],
  ['in','dy/dx = 4x and the curve passes through (0, 3). Find y when x = 2.',['11'],'y = 2x² + 3 = 11.']]}
]},
{title:'Pure Mathematics 3 (A Level)',topics:[
{id:'alm-algebra3',tag:'P3',title:'Algebra: modulus, polynomials, partial fractions',
 sum:'Модуль: |f(x)| = |g(x)| удобно решать возведением в квадрат или как f(x) = ±g(x); |x − a| < b ⇔ a − b < x < a + b. Теорема о множителе (factor theorem): если p(a) = 0, то (x − a) — множитель p(x). Теорема об остатке (remainder theorem): остаток от деления p(x) на (x − a) равен p(a). Простейшие дроби (partial fractions): (px + q)/((x − a)(x − b)) = A/(x − a) + B/(x − b); для повторного множителя (x − a)² нужны A/(x − a) + B/(x − a)².',
 ex:['p(x) = x³ − 2x² − 5x + 6: p(1) = 0, so (x − 1) is a factor','Remainder of (x³ + 2x + 1) ÷ (x − 2): 8 + 4 + 1 = 13','5/((x − 1)(x + 4)) = 1/(x − 1) − 1/(x + 4)'],
 tip:'В partial fractions подставляйте x = корень знаменателя (cover-up) — быстрее, чем решать систему.',
 qs:[['Remainder when x³ − 4x + 2 is divided by (x − 3):','17','−13','5','p(3) = 27 − 12 + 2 = 17.'],
  ['Solve |x − 2| < 5.','−3 < x < 7','x < 7','x < −3 or x > 7','−5 < x − 2 < 5.'],
  ['(x + 7)/((x − 1)(x + 2)) = A/(x − 1) + B/(x + 2). Find A.','8/3','2','7','Put x = 1: A = 8/3.'],
  ['tf','If p(−2) = 0, then (x + 2) is a factor of p(x).',true,'Factor theorem.'],
  ['tf','|x| = −3 has two solutions.',false,'A modulus is never negative.'],
  ['in','(x − 1) is a factor of x³ + ax − 4. Find a.',['3'],'1 + a − 4 = 0.']]},
{id:'alm-explog',tag:'P3',title:'Logarithms and exponential functions',
 sum:'logₐ b = c ⇔ aᶜ = b. Законы: log(xy) = log x + log y, log(x/y) = log x − log y, log xⁿ = n log x. Число e ≈ 2,718, ln x = logₑ x, e^(ln x) = x. Уравнение aˣ = b: x = ln b / ln a. Линеаризация (используется с графиками по данным): y = kxⁿ ⇒ ln y = ln k + n ln x — прямая с gradient n; y = k · aˣ ⇒ ln y = ln k + x ln a.',
 ex:['3ˣ = 20: x = ln 20 / ln 3 ≈ 2.73','log₂ 8 + log₂ 4 = 3 + 2 = 5','ln y against ln x: gradient 3, intercept 0.7 ⇒ y = e^0.7 · x³ ≈ 2.01x³'],
 tip:'ln(a + b) ≠ ln a + ln b — самая частая ошибка с логарифмами.',
 qs:[['log₃ 81 =','4','3','27','3⁴ = 81.'],
  ['Solve eˣ = 5.','x = ln 5','x = 5/e','x = 5e','Take ln of both sides.'],
  ['ln y = 2 + 3 ln x. Then y =','e²x³','2x³','e^(2 + 3x)','y = e² · x³.'],
  ['tf','ln(xy) = ln x + ln y.',true,'Product law.'],
  ['tf','ln 0 = 1.',false,'ln 0 is undefined; ln 1 = 0.'],
  ['in','log₂ 32 = ?',['5'],'2⁵ = 32.']]},
{id:'alm-trig3',tag:'P3',title:'Trigonometry: identities and R-formula',
 sum:'sec θ = 1/cos θ, cosec θ = 1/sin θ, cot θ = 1/tan θ. Тождества: 1 + tan²θ ≡ sec²θ, 1 + cot²θ ≡ cosec²θ. Формулы сложения (compound angles): sin(A ± B) = sin A cos B ± cos A sin B, cos(A ± B) = cos A cos B ∓ sin A sin B. Двойной угол: sin 2A = 2 sin A cos A, cos 2A = cos²A − sin²A = 2cos²A − 1 = 1 − 2sin²A. Выражение a sin θ + b cos θ = R sin(θ + α), где R = √(a² + b²), tan α = b/a.',
 ex:['3 sin θ + 4 cos θ = 5 sin(θ + 53.13°), greatest value 5','sin 75° = sin(45° + 30°) = (√6 + √2)/4','cos 2θ = 1 − 2sin²θ ⇒ sin²θ = (1 − cos 2θ)/2'],
 tip:'Максимум R sin(θ + α) равен R — экзамен часто спрашивает «state the greatest value».',
 qs:[['Greatest value of 5 sin θ + 12 cos θ:','13','17','12','R = √(25 + 144) = 13.'],
  ['sin 2θ =','2 sin θ cos θ','2 sin θ','sin²θ − cos²θ','Double-angle formula.'],
  ['1 + tan²θ ≡','sec²θ','cosec²θ','cot²θ','Divide sin²θ + cos²θ = 1 by cos²θ.'],
  ['tf','cos 2A = 1 − 2sin²A.',true,'One of the three forms.'],
  ['tf','sec θ = 1/sin θ.',false,'sec θ = 1/cos θ.'],
  ['in','6 sin θ + 8 cos θ = R sin(θ + α). Find R.',['10'],'√(36 + 64) = 10.']]},
{id:'alm-diff3',tag:'P3',title:'Differentiation: product, quotient, implicit, parametric',
 sum:'Производные: (eˣ)′ = eˣ, (ln x)′ = 1/x, (sin x)′ = cos x, (cos x)′ = −sin x, (tan x)′ = sec²x — x в радианах. Product rule: (uv)′ = u′v + uv′. Quotient rule: (u/v)′ = (u′v − uv′)/v². Неявное дифференцирование (implicit): дифференцируйте обе части по x, d/dx(y²) = 2y · dy/dx. Параметрическое задание: dy/dx = (dy/dt)/(dx/dt).',
 ex:['y = x²eˣ: y′ = 2xeˣ + x²eˣ','y = ln(3x + 1): y′ = 3/(3x + 1)','x² + y² = 25: dy/dx = −x/y; x = t², y = 2t: dy/dx = 1/t'],
 tip:'Производные тригонометрических функций верны только в радианах.',
 qs:[['d/dx (e^(3x)) =','3e^(3x)','e^(3x)','3xe^(3x − 1)','Chain rule.'],
  ['d/dx (ln 5x) =','1/x','5/x','1/(5x)','ln 5x = ln 5 + ln x.'],
  ['x = 2t + 1, y = t³. dy/dx =','3t²/2','3t²','2/(3t²)','(dy/dt) ÷ (dx/dt).'],
  ['tf','d/dx (sin x) = cos x when x is in degrees.',false,'Only in radians.'],
  ['tf','For x² + y² = 25, dy/dx = −x/y.',true,'2x + 2y · dy/dx = 0.'],
  ['in','y = x ln x. Find dy/dx at x = 1.',['1'],'ln x + 1 = 1.']]},
{id:'alm-int3',tag:'P3',title:'Integration techniques',
 sum:'∫eᵃˣ dx = eᵃˣ/a + c; ∫1/x dx = ln|x| + c; ∫1/(ax + b) dx = (1/a) ln|ax + b| + c; ∫cos ax dx = (1/a) sin ax + c; ∫sin ax dx = −(1/a) cos ax + c; ∫sec²x dx = tan x + c. Вид f′(x)/f(x) интегрируется в ln|f(x)|. По частям (integration by parts): ∫u dv = uv − ∫v du, за u берите ln x или многочлен. Замена (substitution): замените x и dx и пересчитайте пределы. Дроби сначала раскладывают на partial fractions. Приближённо — правило трапеций (trapezium rule).',
 ex:['∫xeˣ dx = xeˣ − eˣ + c','∫2x/(x² + 1) dx = ln(x² + 1) + c','∫₀^(π/2) cos x dx = 1'],
 tip:'В by parts берите u = ln x, даже если рядом многочлен: ln легче дифференцировать, чем интегрировать.',
 qs:[['∫ e^(2x) dx =','½e^(2x) + c','2e^(2x) + c','e^(2x) + c','Divide by 2.'],
  ['∫ 1/(2x + 1) dx =','½ ln|2x + 1| + c','ln|2x + 1| + c','2 ln|2x + 1| + c','Divide by the coefficient of x.'],
  ['∫₀^π sin x dx =','2','0','1','[−cos x]₀^π = 1 − (−1) = 2.'],
  ['tf','∫ 3x²/(x³ + 4) dx = ln|x³ + 4| + c.',true,'It has the form f′(x)/f(x).'],
  ['tf','For ∫ x ln x dx by parts, take u = x.',false,'Take u = ln x.'],
  ['in','∫₁^e (1/x) dx = ?',['1'],'ln e − ln 1 = 1.']]},
{id:'alm-numerical',tag:'P3',title:'Numerical solution of equations',
 sum:'Смена знака (sign change): если f непрерывна и f(a), f(b) разных знаков, между a и b есть корень. Итерация xₙ₊₁ = F(xₙ) сходится к корню α, если |F′(x)| < 1 около α. Чтобы дать ответ с нужной точностью, итерируйте, пока значения не совпадут после округления, а затем подтвердите корень сменой знака на границах интервала.',
 ex:['f(x) = x³ − x − 1: f(1) = −1, f(2) = 5 ⇒ root in (1, 2)','xₙ₊₁ = ∛(xₙ + 1), x₀ = 1.5: 1.3572, 1.3309, 1.3259, … → 1.32','f(x) = 1/(x − 2) changes sign at x = 2 but has no root there'],
 tip:'Чтобы доказать, что корень 1.32 верен до 2 d.p., проверьте знаки f(1.315) и f(1.325).',
 qs:[['f(1) = −2, f(2) = 3 and f is continuous. Then…','there is a root between 1 and 2','x = 1.5 is the root','there are no roots','Sign change.'],
  ['The iteration xₙ₊₁ = F(xₙ) converges to α if near α…','|F′(x)| < 1','F′(x) > 1','F(α) = 0','Standard condition.'],
  ['xₙ₊₁ = (xₙ + 6/xₙ)/2 converges to…','√6','6','3','At the limit x = (x + 6/x)/2 ⇒ x² = 6.'],
  ['tf','A sign change always shows a root.',false,'Not if f is discontinuous, e.g. 1/(x − 2).'],
  ['tf','To show α = 1.32 to 2 d.p., check the signs of f(1.315) and f(1.325).',true,'These are the bounds of the interval.'],
  ['in','xₙ₊₁ = (2xₙ + 10/xₙ²)/3 converges to ∛10. Give it to 1 d.p.',['2.2'],'∛10 ≈ 2.154 → 2.2.']]},
{id:'alm-vectors',tag:'P3',title:'Vectors',
 sum:'Вектор в пространстве: ai + bj + ck, длина |v| = √(a² + b² + c²). Скалярное произведение (scalar product): a·b = a₁b₁ + a₂b₂ + a₃b₃ = |a||b| cos θ; векторы перпендикулярны ⇔ a·b = 0. Уравнение прямой: r = a + λb (a — точка, b — направляющий вектор, direction vector). Две прямые в 3D бывают параллельными, пересекающимися или скрещивающимися (skew). Угол между прямыми ищут по направляющим векторам.',
 ex:['a = (1, 2, 2): |a| = 3','(1, 2, 3)·(4, −5, 2) = 4 − 10 + 6 = 0 ⇒ perpendicular','Line through (1, 0, 2), direction (3, 1, −1): r = (1, 0, 2) + λ(3, 1, −1)'],
 tip:'Skew lines не параллельны и не пересекаются — такое возможно только в пространстве.',
 qs:[['|2i − 3j + 6k| =','7','5','11','√(4 + 9 + 36) = 7.'],
  ['(1, 2, −1)·(3, 0, 4) =','−1','7','3','3 + 0 − 4.'],
  ['Two vectors are perpendicular when…','their scalar product is 0','their magnitudes are equal','one is a multiple of the other','cos 90° = 0.'],
  ['tf','Two non-parallel lines in 3D always intersect.',false,'They may be skew.'],
  ['tf','In r = a + λb, b is the direction vector.',true,'a is the position vector of a point.'],
  ['in','Find p if (2, p, 1)·(1, 3, −8) = 0.',['2'],'2 + 3p − 8 = 0.']]},
{id:'alm-de',tag:'P3',title:'Differential equations',
 sum:'Уравнения с разделяющимися переменными (separable): dy/dx = f(x)g(y) ⇒ ∫dy/g(y) = ∫f(x) dx. Общее решение (general solution) содержит константу c, частное (particular) находят по начальному условию. Модели: «rate proportional to N» значит dN/dt = kN, решение N = Ae^(kt); убывание — со знаком минус.',
 ex:['dy/dx = 2xy ⇒ ln|y| = x² + c ⇒ y = Ae^(x²)','dN/dt = −0.1N, N(0) = 500 ⇒ N = 500e^(−0.1t)','dy/dx = x/y ⇒ y² = x² + c'],
 tip:'Одну константу ставьте сразу после интегрирования — две константы с обеих сторон лишние.',
 qs:[['General solution of dy/dx = 3y:','y = Ae^(3x)','y = 3x + c','y = e^(3x) + c','∫dy/y = ∫3 dx.'],
  ['«The rate of decrease of mass m is proportional to m» means…','dm/dt = −km','dm/dt = km','dm/dt = −k','Decrease gives the minus sign.'],
  ['N = 200e^(0.5t). N when t = 0:','200','0','100','e⁰ = 1.'],
  ['tf','dy/dx = x + y is separable.',false,'It cannot be written as f(x) · g(y).'],
  ['tf','dy/dx = xy² is separable.',true,'f(x) = x, g(y) = y².'],
  ['in','dy/dx = 2x and y = 3 when x = 0. Find y when x = 4.',['19'],'y = x² + 3.']]},
{id:'alm-complex',tag:'P3',title:'Complex numbers',
 sum:'i² = −1; z = x + iy, Re z = x, Im z = y, сопряжённое (conjugate) z* = x − iy. Модуль |z| = √(x² + y²), аргумент arg z — угол на диаграмме Аргана (Argand diagram), −π < arg z ≤ π. Деление: умножьте числитель и знаменатель на сопряжённое знаменателя. Форма z = r(cos θ + i sin θ) = re^(iθ): при умножении модули перемножаются, аргументы складываются. У многочлена с действительными коэффициентами комплексные корни идут сопряжёнными парами. Множества точек (loci): |z − a| = r — окружность, |z − a| = |z − b| — серединный перпендикуляр, arg(z − a) = θ — луч.',
 ex:['(2 + 3i)(1 − i) = 5 + i','(3 + 4i)/(1 + 2i) = (3 + 4i)(1 − 2i)/5 = (11 − 2i)/5','If 2 + i is a root of a real cubic, so is 2 − i'],
 tip:'Аргумент считайте по рисунку: во II и III четвертях к arctan(y/x) нужно прибавить или вычесть π.',
 qs:[['(1 + 2i)(3 − i) =','5 + 5i','3 − 2i','1 + 5i','3 − i + 6i − 2i² = 5 + 5i.'],
  ['|−5 + 12i| =','13','7','17','√(25 + 144).'],
  ['arg(i) =','π/2','0','π','i lies on the positive imaginary axis.'],
  ['tf','If 3 − 2i is a root of a polynomial with real coefficients, so is 3 + 2i.',true,'Roots come in conjugate pairs.'],
  ['tf','|z − 2| = 3 is a straight line on an Argand diagram.',false,'It is a circle, centre 2, radius 3.'],
  ['in','i⁴ = ?',['1'],'(i²)² = 1.']]}
]},
{title:'Mechanics',topics:[
{id:'alm-kinematics',tag:'M1',title:'Kinematics: suvat and graphs',
 sum:'Равноускоренное движение: v = u + at, s = ut + ½at², v² = u² + 2as, s = ½(u + v)t. На графике displacement–time gradient — скорость; на графике velocity–time gradient — ускорение, площадь — перемещение. При переменном ускорении: v = ds/dt, a = dv/dt, s = ∫v dt. В 9709 берут g = 10 m s⁻².',
 ex:['u = 0, a = 4, t = 5: v = 20 m/s, s = 50 m','Stone dropped from rest: after 3 s v = 30 m/s, s = 45 m','v = 3t² − 2t ⇒ a = 6t − 2'],
 tip:'Выпишите s, u, v, a, t: три известны, одна нужна — выберите формулу без пятой величины.',
 qs:[['A car accelerates from 4 m/s at 2 m/s² for 6 s. Final speed:','16 m/s','12 m/s','24 m/s','v = 4 + 2 · 6.'],
  ['The area under a velocity–time graph gives…','displacement','acceleration','speed','∫v dt.'],
  ['A ball is thrown up at 20 m/s (g = 10). Greatest height:','20 m','40 m','10 m','0 = 400 − 20s ⇒ s = 20.'],
  ['tf','The gradient of a displacement–time graph is acceleration.',false,'It is velocity.'],
  ['tf','In 9709 you take g = 10 m s⁻² unless told otherwise.',true,'Standard instruction.'],
  ['in','s = 2t³. Find the velocity when t = 2.',['24'],'v = 6t² = 24.']]},
{id:'alm-forces',tag:'M1',title:'Forces and equilibrium',
 sum:'Силы раскладывают (resolve) в двух перпендикулярных направлениях; в равновесии (equilibrium) суммы составляющих равны нулю. Вес W = mg, нормальная реакция R. Трение F ≤ μR; предельное трение (limiting friction) F = μR — тело на грани скольжения. На наклонной плоскости с углом α: составляющая веса вдоль склона mg sin α, перпендикулярно склону mg cos α.',
 ex:['5 kg on a smooth 30° slope: component along the slope 25 N','2 kg on a rough floor, μ = 0.3: limiting friction 6 N','Three forces in equilibrium form a closed triangle of forces'],
 tip:'R = mg cos α на склоне только тогда, когда нет других сил, направленных поперёк склона.',
 qs:[['A 4 kg block rests on a rough horizontal floor, μ = 0.5. Limiting friction:','20 N','2 N','40 N','F = μR = 0.5 · 40.'],
  ['Component of the weight along a slope at angle α:','mg sin α','mg cos α','mg tan α','Resolve parallel to the plane.'],
  ['A particle is in equilibrium. The resultant force is…','zero','equal to the weight','equal to friction','Definition of equilibrium.'],
  ['tf','Friction always equals μR.',false,'F ≤ μR; equality only when friction is limiting.'],
  ['tf','On a horizontal floor with no other vertical forces, R = mg.',true,'R − mg = 0.'],
  ['in','A 10 kg crate is on a smooth 30° slope. Force along the slope needed to hold it (N)?',['50'],'mg sin 30° = 100 · 0.5.']]},
{id:'alm-newton',tag:'M1',title:'Newton’s laws and connected particles',
 sum:'Второй закон: F = ma, где F — равнодействующая (resultant). Связанные тела (лифт, машина с прицепом, блок): пишите F = ma для каждого тела или для системы целиком; натяжение (tension) по обе стороны гладкого блока одинаковое. На шероховатом склоне равнодействующая = составляющая веса − трение.',
 ex:['2 kg and 3 kg over a smooth pulley: a = (3 − 2) · 10/5 = 2 m/s², T = 24 N','Lift 500 kg accelerating up at 1 m/s²: T = 500 · 11 = 5500 N','Car 1200 kg, driving force 3000 N, resistance 600 N: a = 2 m/s²'],
 tip:'Для блока: a = (разность весов)/(сумма масс), а натяжение находите из уравнения для одного тела.',
 qs:[['5 kg and 3 kg hang over a smooth pulley (g = 10). Acceleration:','2.5 m/s²','5 m/s²','2 m/s²','a = (5 − 3) · 10/8.'],
  ['A 400 kg lift moves up with acceleration 2 m/s². Tension:','4800 N','4000 N','3200 N','T − 4000 = 400 · 2.'],
  ['A 1000 kg car: driving force 2500 N, resistance 500 N. a =','2 m/s²','2.5 m/s²','3 m/s²','2000/1000.'],
  ['tf','The tension is the same on both sides of a smooth light pulley.',true,'Smooth pulley assumption.'],
  ['tf','A body moving at constant velocity has a non-zero resultant force.',false,'Constant velocity means zero resultant force.'],
  ['in','A resultant force of 30 N acts on a 6 kg mass. Find a (m/s²).',['5'],'a = F/m.']]},
{id:'alm-energy',tag:'M1',title:'Work, energy and power',
 sum:'Работа W = Fd cos θ. Кинетическая энергия ½mv², потенциальная mgh. Работа сил = изменение энергии; работа против сопротивления = потеря механической энергии. Мощность P = W/t = Fv (сила тяги × скорость); на максимальной скорости сила тяги равна сопротивлению.',
 ex:['2 kg falls 5 m from rest: v = 10 m/s','Car 60 kW at maximum speed 30 m/s ⇒ resistance 2000 N','Pulling 10 m with 50 N at 60°: W = 250 J'],
 tip:'«At maximum speed» — ускорение 0, значит P/v = resistance.',
 qs:[['A 3 kg mass moves at 4 m/s. Its KE:','24 J','12 J','48 J','½ · 3 · 16.'],
  ['An engine works at 40 kW when the car moves at 20 m/s. Driving force:','2000 N','800 N','20 000 N','F = P/v.'],
  ['Work done by a 20 N force over 5 m at 60° to the motion:','50 J','100 J','86.6 J','20 · 5 · cos 60°.'],
  ['tf','At maximum speed on a level road, the driving force equals the resistance.',true,'a = 0.'],
  ['tf','Power is measured in joules.',false,'In watts (J/s).'],
  ['in','A 0.5 kg ball is dropped from 20 m (g = 10). Speed just before impact (m/s)?',['20'],'v² = 2gh = 400.']]},
{id:'alm-momentum',tag:'M1',title:'Momentum',
 sum:'Импульс p = mv — вектор, направление важно. При столкновении суммарный импульс до = после (conservation of momentum). Слипшиеся тела (coalesce) движутся с общей скоростью. Кинетическая энергия при столкновении обычно теряется.',
 ex:['2 kg at 6 m/s hits a stationary 4 kg, they coalesce: v = 12/6 = 2 m/s','3 kg at 5 m/s and 2 kg at −4 m/s; after, 3 kg moves at 1 m/s: 15 − 8 = 3 + 2v ⇒ v = 2 m/s','Loss of KE = KE before − KE after'],
 tip:'Выберите положительное направление и пишите все скорости со знаком.',
 qs:[['A 4 kg particle at 3 m/s hits a stationary 2 kg particle and they coalesce. Common speed:','2 m/s','3 m/s','1.5 m/s','12/6.'],
  ['Momentum is measured in…','N s','J','N/m','p = mv, kg m/s = N s.'],
  ['Total momentum of 2 kg at 5 m/s and 3 kg at −5 m/s:','−5 N s','25 N s','0','10 − 15.'],
  ['tf','In a collision, kinetic energy is always conserved.',false,'Momentum is conserved; KE is usually lost.'],
  ['tf','Momentum is a vector quantity.',true,'Direction matters.'],
  ['in','A 0.2 kg ball at 10 m/s is brought to rest. Change in momentum, magnitude (N s)?',['2'],'0.2 · 10.']]}
]},
{title:'Probability & Statistics 1',topics:[
{id:'alm-data',tag:'S1',title:'Representation of data',
 sum:'Среднее x̄ = Σx/n, дисперсия σ² = Σx²/n − x̄², стандартное отклонение σ. Кодированные данные: mean = a + Σ(x − a)/n, а сдвиг на a не меняет σ. Медиана и квартили, IQR = Q3 − Q1. Гистограмма: высота — плотность частоты (frequency density = frequency / class width), площадь столбца = частота. Ещё: box-and-whisker plot, cumulative frequency graph, stem-and-leaf diagram.',
 ex:['2, 4, 6, 8: mean 5, variance 120/4 − 25 = 5','Class 10–20 with frequency 30: frequency density 3','n = 20, Σ(x − 50) = 40 ⇒ mean 52'],
 tip:'В гистограмме по вертикали frequency density, а не frequency.',
 qs:[['Class 20–30 has frequency 15. Frequency density:','1.5','15','0.5','15/10.'],
  ['Data 1, 3, 5, 7. Variance:','5','4','2.24','84/4 − 16 = 21 − 16.'],
  ['Adding 10 to every value changes the standard deviation by…','0','10','100','The spread does not change.'],
  ['tf','The median is affected by extreme values more than the mean.',false,'The mean is affected more.'],
  ['tf','IQR = Q3 − Q1.',true,'Interquartile range.'],
  ['in','n = 10, Σ(x − 20) = 30. Find the mean.',['23'],'20 + 30/10.']]},
{id:'alm-perm',tag:'S1',title:'Permutations and combinations',
 sum:'n разных предметов расставляют n! способами; с повторами делите на факториалы повторов: n!/(p! q!). ⁿPᵣ = n!/(n − r)! — порядок важен; ⁿCᵣ — не важен. «Вместе» — склейте в один блок и умножьте на перестановки внутри блока; «не вместе» = всего − вместе; ограничения на позиции выполняйте первыми.',
 ex:['Arrangements of BANANA: 6!/(3! 2!) = 60','5 books, 2 particular ones together: 4! · 2! = 48','Choose 3 from 7 men and 2 from 5 women: 35 · 10 = 350'],
 tip:'«At least one» обычно проще считать как total − «none».',
 qs:[['Arrangements of the letters of LEVEL:','30','120','60','5!/(2! 2!) = 30.'],
  ['Committees of 3 chosen from 8 people:','56','336','24','⁸C₃.'],
  ['6 people in a row, A and B must be together:','240','720','120','5! · 2!.'],
  ['tf','ⁿPᵣ ≥ ⁿCᵣ for all valid n and r.',true,'ⁿPᵣ = ⁿCᵣ · r!.'],
  ['tf','The letters AAB have 3! = 6 arrangements.',false,'3!/2! = 3.'],
  ['in','Arrangements of the letters of MATHS?',['120'],'5! = 120.']]},
{id:'alm-prob',tag:'S1',title:'Probability',
 sum:'P(A ∪ B) = P(A) + P(B) − P(A ∩ B). Несовместные (mutually exclusive): P(A ∩ B) = 0. Независимые (independent): P(A ∩ B) = P(A)P(B). Условная вероятность P(A | B) = P(A ∩ B)/P(B). Дерево вероятностей: вдоль ветки умножаем, разные исходы складываем.',
 ex:['P(A) = 0.4, P(B) = 0.5, independent: P(A ∩ B) = 0.2, P(A ∪ B) = 0.7','3 red and 2 blue, two taken without replacement: P(both red) = 3/5 · 2/4 = 3/10','P(A | B) = 0.2/0.5 = 0.4'],
 tip:'Independent и mutually exclusive — разное: несовместные события с ненулевыми вероятностями всегда зависимы.',
 qs:[['P(A) = 0.3, P(B) = 0.6, A and B independent. P(A ∩ B) =','0.18','0.9','0.3','0.3 · 0.6.'],
  ['P(A ∩ B) = 0.12, P(B) = 0.4. P(A | B) =','0.3','0.048','0.52','0.12/0.4.'],
  ['Two fair coins. P(at least one head) =','3/4','1/2','1/4','1 − 1/4.'],
  ['tf','If A and B are mutually exclusive, P(A ∩ B) = 0.',true,'They cannot happen together.'],
  ['tf','Mutually exclusive events with non-zero probabilities are independent.',false,'P(A ∩ B) = 0 ≠ P(A)P(B).'],
  ['in','A fair die is rolled twice. P(two sixes) as a fraction?',['1/36'],'1/6 · 1/6.']]},
{id:'alm-drv',tag:'S1',title:'Discrete random variables',
 sum:'Распределение (probability distribution): ΣP(X = x) = 1. Математическое ожидание E(X) = Σxp, дисперсия Var(X) = Σx²p − [E(X)]².',
 ex:['X = 1, 2, 3 with p = 0.2, 0.5, 0.3: E(X) = 2.1','E(X²) = 0.2 + 2 + 2.7 = 4.9, Var(X) = 4.9 − 4.41 = 0.49','Fair die: E(X) = 3.5'],
 tip:'Сначала найдите неизвестную вероятность из Σp = 1.',
 qs:[['P(X = 0) = 0.1, P(X = 1) = 0.6, P(X = 2) = k. k =','0.3','0.7','0.4','Probabilities sum to 1.'],
  ['E(X) for a fair six-sided die:','3.5','3','6','21/6.'],
  ['X takes 0 and 2 with probability ½ each. Var(X) =','1','2','0','E(X²) = 2, E(X) = 1, 2 − 1 = 1.'],
  ['tf','Var(X) can be negative.',false,'Variance is never negative.'],
  ['tf','ΣP(X = x) = 1 for every probability distribution.',true,'Total probability.'],
  ['in','X takes 1 and 2 with probability 0.5 each. E(X)?',['1.5'],'0.5 + 1 = 1.5.']]},
{id:'alm-binom',tag:'S1',title:'Binomial and geometric distributions',
 sum:'X ~ B(n, p): n независимых испытаний с вероятностью успеха p. P(X = r) = ⁿCᵣ pʳ(1 − p)ⁿ⁻ʳ, E(X) = np, Var(X) = np(1 − p). Геометрическое X ~ Geo(p): число испытаний до первого успеха включительно, P(X = r) = (1 − p)ʳ⁻¹p, E(X) = 1/p.',
 ex:['B(10, 0.3): E = 3, Var = 2.1','B(4, 0.5): P(X = 2) = 6/16 = 0.375','Geo(0.2): P(X = 3) = 0.8² · 0.2 = 0.128, E = 5'],
 tip:'«At least one»: P(X ≥ 1) = 1 − (1 − p)ⁿ.',
 qs:[['X ~ B(20, 0.25). E(X) =','5','20','0.25','np.'],
  ['X ~ B(3, 0.5). P(X = 3) =','1/8','3/8','1/2','0.5³.'],
  ['X ~ Geo(0.25). E(X) =','4','0.25','3','1/p.'],
  ['tf','In a binomial distribution the trials must be independent.',true,'One of the conditions.'],
  ['tf','For X ~ Geo(p), P(X = 1) = 1 − p.',false,'P(X = 1) = p.'],
  ['in','X ~ B(10, 0.4). Var(X)?',['2.4'],'10 · 0.4 · 0.6.']]},
{id:'alm-normal',tag:'S1',title:'The normal distribution',
 sum:'X ~ N(μ, σ²). Стандартизация: Z = (X − μ)/σ, Z ~ N(0, 1), значения Φ берут из таблицы. Симметрия: P(Z < −a) = 1 − Φ(a). Если дана вероятность, найдите z по обратной таблице и выразите μ или σ. Нормальное приближение биномиального (при np > 5 и nq > 5): N(np, npq) с поправкой на непрерывность (continuity correction).',
 ex:['X ~ N(50, 16): P(X < 54) = Φ(1) = 0.8413','P(X > 46) = Φ(1) = 0.8413 by symmetry','B(100, 0.4) ≈ N(40, 24): P(X ≤ 45) → P(Y < 45.5)'],
 tip:'В записи N(μ, σ²) второе число — дисперсия: N(50, 16) значит σ = 4, а не 16.',
 qs:[['X ~ N(30, 25). z-value for x = 40:','2','0.4','10','(40 − 30)/5.'],
  ['P(Z < 0) =','0.5','0','1','Symmetry.'],
  ['X ~ N(100, 9). σ =','3','9','81','σ² = 9.'],
  ['tf','For a normal distribution mean = median = mode.',true,'The curve is symmetric.'],
  ['tf','With continuity correction, P(X ≤ 45) becomes P(Y < 44.5).',false,'It becomes P(Y < 45.5).'],
  ['in','X ~ N(20, 4). Find z for x = 17.',['−1.5','-1.5'],'(17 − 20)/2 = −1.5.']]}
]}
]});

/* Генераторы задач A-level Mathematics (на английском) */
add('alm-quadratics',[function(n){
  var k=n%3,p=gR(1,6),q=gR(-9,9),b=2*p,c=p*p+q;
  if(k===0)return T('Express x² + '+b+'x + '+c+' in the form (x + a)² + b. Find b.',q,'',gW(q,[c,c-p*p+2*p,-q],true),'x² + '+b+'x + '+c+' = (x + '+p+')² − '+(p*p)+' + '+c+' = (x + '+p+')²'+sgn(q)+'.');
  if(k===1){var m=gR(1,6);return T('Find the positive value of k for which x² + kx + '+(m*m)+' = 0 has equal roots.',2*m,'',gW(2*m,[m,m*m]),'k² − 4 · '+(m*m)+' = 0 ⇒ k = '+(2*m)+'.');}
  var r=gR(1,8);return T('Find the x-coordinate of the minimum point of y = x² − '+(2*r)+'x + '+gR(1,20)+'.',r,'',gW(r,[2*r,-r],true),'dy/dx = 2x − '+(2*r)+' = 0, or complete the square: x = '+r+'.');
}]);
add('alm-functions',[function(n){
  var a=gR(2,5),b=gR(-6,6),x=gR(1,4),k=n%2;
  if(k===0){var g=x*x;return T('f(x) = '+lin(a,b)+', g(x) = x². Find fg('+x+').',a*g+b,'',gW(a*g+b,[(a*x+b)*(a*x+b),a*x+b],true),'g('+x+') = '+g+', f('+g+') = '+(a*g+b)+'.');}
  var y=a*x+b;return T('f(x) = '+lin(a,b)+'. Solve f⁻¹(x) = '+x+'.',y,'',gW(y,[(x-b)/a,x],true),'f⁻¹(x) = '+x+' ⇔ x = f('+x+') = '+y+'.');
}]);
add('alm-coord',[function(n){
  var t=gP([[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15]]),x=gR(-5,5),y=gR(-5,5),k=n%3;
  if(k===0)return T('Find the distance between ('+x+', '+y+') and ('+(x+t[0])+', '+(y+t[1])+').',t[2],'',gW(t[2],[t[0]+t[1],t[2]*t[2]]),'√('+t[0]+'² + '+t[1]+'²) = '+t[2]+'.');
  if(k===1){var g=gR(-5,5)||2,f=gR(-5,5)||3,r=gR(2,9),c=g*g+f*f-r*r;return T('Find the radius of the circle x² + y²'+sgn(-2*g)+'x'+sgn(-2*f)+'y'+sgn(c)+' = 0.',r,'',gW(r,[r*r,Math.abs(c)]),'Centre ('+g+', '+f+'), r² = '+(g*g)+' + '+(f*f)+' − ('+c+') = '+(r*r)+'.');}
  var m=gP([2,3,4,5,-2,-3,-4]),am=Math.abs(m),ans=(m>0?'−':'')+'1/'+am;
  return T('Find the gradient of a line perpendicular to y = '+lin(m,gR(1,5))+'.',ans,'',[(m>0?'':'−')+'1/'+am,(m<0?'−':'')+am],'m₁m₂ = −1 ⇒ m₂ = −1/('+gF(m)+') = '+ans+'.',true);
}]);
add('alm-radians',[function(n){
  var r=gR(2,12),th=gP([0.5,0.8,1.2,1.5,2,2.5]),k=n%3;
  if(k===0)return T('A sector has radius '+r+' cm and angle '+gF(th)+' rad. Find the arc length.',r*th,' cm',gW(r*th,[0.5*r*r*th,r*th*2]),'s = rθ = '+r+' · '+gF(th)+' = '+gF(r*th)+' cm.');
  if(k===1)return T('A sector has radius '+r+' cm and angle '+gF(th)+' rad. Find its area.',0.5*r*r*th,' cm²',gW(0.5*r*r*th,[r*th,r*r*th]),'A = ½r²θ = ½ · '+(r*r)+' · '+gF(th)+' = '+gF(0.5*r*r*th)+' cm².');
  return T('A sector has radius '+r+' and arc length '+gF(r*th)+'. Find the angle in radians.',th,'',gW(th,[r*th*r,th*2]),'θ = s/r = '+gF(r*th)+' / '+r+' = '+gF(th)+'.');
}]);
add('alm-series',[function(n){
  var a=gR(2,9),d=gR(2,6),N=gR(8,20),k=n%3;
  if(k===0)return T('An arithmetic progression has first term '+a+' and common difference '+d+'. Find the '+N+'th term.',a+(N-1)*d,'',gW(a+(N-1)*d,[a+N*d,a*N]),'uₙ = a + (n − 1)d = '+a+' + '+(N-1)+' · '+d+' = '+(a+(N-1)*d)+'.');
  if(k===1)return T('Find the sum of the first '+N+' terms of the AP with a = '+a+', d = '+d+'.',N/2*(2*a+(N-1)*d),'',gW(N/2*(2*a+(N-1)*d),[N*(a+(N-1)*d),N/2*(a+(N-1)*d)]),'Sₙ = n/2 · (2a + (n − 1)d) = '+N+'/2 · ('+(2*a)+' + '+((N-1)*d)+') = '+gF(N/2*(2*a+(N-1)*d))+'.');
  var A=gP([4,6,8,9,10,12,16,18,20,24]),r=gP([0.5,0.25,0.75,0.2,0.4]);if(!gNice(A/(1-r)))return null;return T('A geometric progression has first term '+A+' and common ratio '+gF(r)+'. Find the sum to infinity.',A/(1-r),'',gW(A/(1-r),[A/r,A*(1+r)]),'S∞ = a/(1 − r) = '+A+'/'+gF(1-r)+' = '+gF(A/(1-r))+'.');
}]);
add('alm-diff1',[function(n){
  var a=gR(1,5),p=gR(2,4),x=gR(1,3),k=n%3;
  if(k===0){var g=a*p*Math.pow(x,p-1);return T('Find the gradient of y = '+(a===1?'':a)+'x'+sup(p)+' at x = '+x+'.',g,'',gW(g,[a*Math.pow(x,p),a*p*Math.pow(x,p)]),'dy/dx = '+(a*p)+'x'+sup(p-1)+' = '+g+' at x = '+x+'.');}
  if(k===1){var r=gR(-6,6)||3;return T('Find the x-coordinate of the stationary point of y = x²'+sgn(-2*r)+'x + '+gR(1,9)+'.',r,'',gW(r,[2*r,-r],true),'dy/dx = 2x'+sgn(-2*r)+' = 0 ⇒ x = '+r+'.');}
  var b=gR(2,4),m=gR(3,5),x0=gR(0,1),v=m*b*Math.pow(b*x0+1,m-1);return T('y = ('+b+'x + 1)'+sup(m)+'. Find dy/dx at x = '+x0+'.',v,'',gW(v,[m*Math.pow(b*x0+1,m-1),b*Math.pow(b*x0+1,m)]),'dy/dx = '+m+' · '+b+' · ('+b+'x + 1)'+sup(m-1)+' = '+v+' at x = '+x0+'.');
}]);
add('alm-int1',[function(n){
  var a=gR(1,4),p=gR(1,3),b=gR(1,3),k=n%2,c=(p+1)*a;
  if(k===0){var v=a*Math.pow(b,p+1);return T('Evaluate ∫₀'+sub(b)+' '+(c===1?'':c)+'x'+(p===1?'':sup(p))+' dx.',v,'',gW(v,[c*Math.pow(b,p),c*Math.pow(b,p+1)]),'∫ '+c+'x'+(p===1?'':sup(p))+' dx = '+(a===1?'':a)+'x'+sup(p+1)+'; from 0 to '+b+': '+v+'.');}
  var y0=gR(1,9),x=gR(1,4);return T('dy/dx = '+(2*a)+'x and the curve passes through (0, '+y0+'). Find y when x = '+x+'.',a*x*x+y0,'',gW(a*x*x+y0,[2*a*x+y0,a*x*x]),'y = '+(a===1?'':a)+'x² + '+y0+' ⇒ y = '+(a*x*x+y0)+'.');
}]);
add('alm-algebra3',[function(n){
  var a=gR(-3,3)||2,b=gR(-5,5),c=gR(-9,9),k=n%2;
  if(k===0){var r=a*a*a+b*a+c;return T('Find the remainder when x³'+sgn(b)+'x'+sgn(c)+' is divided by (x'+sgn(-a)+').',r,'',gW(r,[c,r+2*a],true),'Remainder theorem: p('+a+') = '+(a*a*a)+sgn(b*a)+sgn(c)+' = '+r+'.');}
  var root=gR(1,3),q=gR(-6,6),A=-(root*root*root+q)/root;
  if(!gNice(A))return null;
  return T('(x − '+root+') is a factor of x³ + ax'+sgn(q)+'. Find a.',A,'',gW(A,[-A,A+1],true),'p('+root+') = '+(root*root*root)+' + '+root+'a'+sgn(q)+' = 0 ⇒ a = '+gF(A)+'.');
}]);
add('alm-explog',[function(n){
  var b=gP([2,3,4,5,10]),e=gR(2,5),k=n%3;
  if(k===0)return T('Find log'+sub(b)+' '+Math.pow(b,e)+'.',e,'',gW(e,[Math.pow(b,e)/b,e+1]),b+sup(e)+' = '+Math.pow(b,e)+'.');

sections:[
{title:'AS Level',topics:[
{id:'alp-units',tag:'AS',title:'Physical quantities, units and uncertainties',
