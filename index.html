  c.fillStyle='rgba(255,220,80,'+(p.L/120)+')';c.beginPath();c.arc(40,40,24,0,6.2832);c.fill();labTxt(c,'свет',40,78,k.muted,'center');
 }};
LABS['math-probability']={title:'подбрасывание монеты',hint:'Монету подбрасывают снова и снова. Частота выпадения орла скачет в начале, но с ростом числа бросков приближается к вероятности — это закон больших чисел.',restart:true,
 ctl:[['s','Бросков в секунду',5,100,5,20],['p','Вероятность орла',0.1,0.9,0.05,0.5]],
 run:function(p,t){var n=Math.min(3000,Math.floor(t*p.s)),hds=0,pts=[],st=Math.max(1,Math.floor(n/150));for(var i=1;i<=n;i++){if(hsh(i)<p.p)hds++;if(i%st===0)pts.push([i,hds/i]);}return {n:n,h:hds,pts:pts};},
 info:function(p,t){var r=this.run(p,t);return 'Бросков: '+r.n+' · орлов: '+r.h+' · частота '+(r.n?fx(r.h/r.n,3):'—')+' · вероятность '+fx(p.p,2);},
 draw:function(c,w,h,p,t,k){
  var r=this.run(p,t),N=Math.max(50,r.n);

  var yp=30+190-p.p*190;c.setLineDash([4,4]);c.strokeStyle=k.warm;c.beginPath();c.moveTo(40,yp);c.lineTo(w-30,yp);c.stroke();c.setLineDash([]);labTxt(c,'p = '+fx(p.p,2),w-34,yp-4,k.warm,'right');
 }};
LABS['math-pythagoras']={title:'квадраты на сторонах треугольника',hint:'На катетах и гипотенузе построены квадраты. Площадь большого квадрата всегда равна сумме площадей двух маленьких: a² + b² = c².',
 ctl:[['a','Катет a',1,8,0.5,3],['b','Катет b',1,8,0.5,4]],
 info:function(p){var c2=p.a*p.a+p.b*p.b;return 'a² + b² = '+fx(p.a*p.a,2)+' + '+fx(p.b*p.b,2)+' = '+fx(c2,2)+' = c² · c = '+fx(Math.sqrt(c2),2);},
 draw:function(c,w,h,p,t,k){
  var s=Math.min(14,170/(p.a+p.b+Math.sqrt(p.a*p.a+p.b*p.b))),ox=w/2-p.b*s/2+20,oy=150,A=p.a*s,B=p.b*s;
  function poly(pts,col){c.fillStyle=col;c.beginPath();pts.forEach(function(q,i){if(i)c.lineTo(q[0],q[1]);else c.moveTo(q[0],q[1]);});c.closePath();c.fill();c.strokeStyle=k.ink;c.lineWidth=1;c.stroke();}
  var P=[ox,oy],Q=[ox+B,oy],R=[ox,oy-A];
  poly([P,Q,[ox+B,oy+B],[ox,oy+B]],'rgba(61,123,216,0.35)');poly([P,R,[ox-A,oy-A],[ox-A,oy]],'rgba(216,74,74,0.35)');
  var dx=Q[0]-R[0],dy=Q[1]-R[1];poly([R,Q,[Q[0]+dy,Q[1]-dx],[R[0]+dy,R[1]-dx]],'rgba(47,174,107,0.35)');
  poly([P,Q,R],k.bg);
  labTxt(c,'b² = '+fx(p.b*p.b,1),ox+B/2,oy+B/2+4,k.ink,'center');labTxt(c,'a² = '+fx(p.a*p.a,1),ox-A/2,oy-A/2+4,k.ink,'center');labTxt(c,'c² = '+fx(p.a*p.a+p.b*p.b,1),(R[0]+Q[0])/2+dy/2,(R[1]+Q[1])/2-dx/2+4,k.ink,'center');
 }};
LABS['math-vectors']={title:'сложение векторов',hint:'Векторы a и b складывают по правилу параллелограмма: сумма — диагональ. Меняйте длины и углы и следите за координатами.',

function startLab(){
  try{cancelAnimationFrame(labRaf);}catch(e){}
  var cv=document.getElementById('lab');if(!cv||!ui.lab||!LABS[ui.lab.id]||!cv.getContext)return;
  var L=LABS[ui.lab.id],S=ui.lab,ctx=cv.getContext('2d'),last=0;
  function frame(ts){
    if(!cv.isConnected||ui.lab!==S)return;
    var dt=last?Math.min(0.05,(ts-last)/1000):0;last=ts;
    if(S.run)S.t+=dt;
    var w=cv.clientWidth||300,d=window.devicePixelRatio||1;
    if(cv.width!==Math.round(w*d)){cv.width=Math.round(w*d);cv.height=Math.round(260*d);}
    ctx.setTransform(d,0,0,d,0,0);
    var cs=getComputedStyle(document.documentElement);
    function v(n){return cs.getPropertyValue(n).trim()||'#888';}
    ctx.clearRect(0,0,w,260);
    L.draw(ctx,w,260,S.p,S.t,{ink:v('--ink'),line:v('--line'),acc:v('--accent'),muted:v('--muted'),soft:v('--soft'),warm:v('--phys'),good:v('--good'),bg:v('--surface')});
    var info=document.getElementById('lab-info');
    if(info){var tx=L.info(S.p,S.t);if(info.textContent!==tx)info.textContent=tx;}
    labRaf=requestAnimationFrame(frame);
  }
  labRaf=requestAnimationFrame(frame);
}

/* ---------- Мудрости, шутки и мотивация в тестах ---------- */
var _wis=null;
function WIS(){
  if(_wis)return _wis;
  var L=[],seen={};
  function add(w){var k=w.ru.toLowerCase();if(seen[k])return;seen[k]=1;L.push(w);}
  WORLD.forEach(function(w){add({o:w[0],la:w[1],rom:w[2],ru:w[3],kk:w[4],sru:w[5],skk:w[6]});});
  QUOTES2.forEach(function(q){add({ru:q[0],kk:q[1],sru:q[2],skk:q[3]});});
  LATIN.forEach(function(l){add({o:l[0],la:'la',ru:l[1],kk:l[2],sru:l[3]||'латинское выражение',skk:l[3]||'латын сөзі'});});
  KZPROV.forEach(function(p){add({o:p[0],la:'kk',ru:p[1],kk:p[0],sru:p[2]||'казахская пословица',skk:p[2]||'қазақ мақалы'});});
  QUOTES.forEach(function(q){add({ru:q[0],kk:'',sru:q[1],skk:''});});
  _wis=L;return L;
}
function WORLD_W(){return WIS().slice(0,WORLD.length);}
function wisHtml(w,id){
  var kk=KKL(),txt=kk&&w.kk?w.kk:w.ru,src=kk&&w.skk?w.skk:w.sru,same=w.o&&w.o===txt;
  return '<p class="quote wis"'+(id?' id="'+id+'"':'')+'>'+(w.o&&!same?'<span class="orig" lang="'+esc(w.la)+'">'+esc(w.o)+'</span>'+(w.rom?' <span class="orig muted">('+esc(w.rom)+')</span>':'')+' — ':'')+'«'+esc(txt)+'» <span class="muted">— '+esc(src)+'</span></p>';
}
function pickRand(n,tag){
  ui.seen=ui.seen||[];
  var i,k,t;
  for(t=0;t<12;t++){i=Math.floor(Math.random()*n);k=tag+i;if(ui.seen.indexOf(k)<0)break;}
  ui.seen.push(tag+i);if(ui.seen.length>40)ui.seen.shift();
  return i;
}
/* Верно — мудрость, цитата или пословица; неверно — мотивация или шутка. Каждый раз одна */
function quizExtra(q){
  q.ex=q.ex||{};
  if(q.ex[q.i])return q.ex[q.i];
  var it=q.items[q.i],ok=Core.right(it,q.answers[q.i]),kk=KKL(),e;
  if(ok){var pool=WIS().filter(function(w){return !kk||w.kk;});e={k:'w',w:pool[pickRand(pool.length,'w')]};}
  else if(Math.random()<0.5){var nm=Math.min(MOTIV.length,MOTIV_KK.length);e={k:'m',i:pickRand(nm,'m')};}
  else{var nj=Math.min(JOKES.length,JOKES_KK.length);e={k:'j',i:pickRand(nj,'j')};}
  q.ex[q.i]=e;return e;
}
function extraText(e){

/* ---------- Тест «Определить уровень» ---------- */
function parseNumbered(text,max){
  text=String(text||'');var a=text.indexOf('['),b=text.lastIndexOf(']'),arr,by={};
  if(a<0||b<=a)return by;
  try{arr=JSON.parse(text.slice(a,b+1));}catch(e){return by;}
  if(!Array.isArray(arr))return by;
  arr.forEach(function(x){var n=Math.floor(Number(x&&x.n));if(!(n>=1&&n<=max))return;var q=Core.parseList([x]);if(q)(by[n]=by[n]||[]).push(q[0]);});
  return by;
}

function planDays(n){

function planList(q,subj){

function examStart(sid){
  var subj=Core.subject(state,sid);if(!subj)return;
  var e=ui.examCfg||{},n=e.n||20,sec=typeof e.sec==='number'?e.sec:-1,secs=Core.sections(state,subj);
  var pool=(sec>=0&&secs[sec]?secs[sec].topics:Core.topics(state,subj)).filter(function(t){return (t.qs&&t.qs.length)||GEN[t.id];});
  if(!pool.length)return;
  var items=[],seen={},tries=0;
  while(items.length<n&&tries<n*12){
    tries++;var t=pool[Math.floor(Math.random()*pool.length)],qq=null;
    if(GEN[t.id]&&(!t.qs||!t.qs.length||Math.random()<0.6)){var g=genTasks(t.id,1);if(g.length)qq=genQ(g[0],Math.random()<0.25);}
    if(!qq&&t.qs&&t.qs.length)qq=t.qs[Math.floor(Math.random()*t.qs.length)];
    if(!qq)continue;
    var it=Core.buildQuiz([{id:t.id,title:t.title,qs:[qq]}],0)[0];if(!it||seen[it.text])continue;
    seen[it.text]=1;items.push(it);
  }
  if(!items.length)return;
  var min=Math.round(items.length*1.5),title=TT('Экзамен: ','Емтихан: ')+subj.name+(sec>=0&&secs[sec]?' · '+secs[sec].title:'');
  startQuiz2(sid,{exam:{sec:sec,n:n,min:min}},title,'exam:'+sid,items,false);
}

}

function viewQuiz(){

    if(q.opt.exam||q.opt.mistp){}
    else if(q.marked&&q.marked.length) h+='<p class="msg" id="quiz-marked">Отмечено изученными: '+q.marked.map(esc).join(', ')+'. Прогресс по курсу теперь '+(q.opt.prog?progCount(Core.topics(state,subj),q.opt.prog):Core.progress(state,subj)).pct+'%.</p>';
    else if(q.opt.depth) h+=q.passed?'<p class="msg" id="quiz-marked"><span class="stars">'+starStr(q.opt.depth)+'</span> Уровень '+q.opt.depth+' получен: '+(q.opt.depth===2?'«Практика»':'«Мастер»')+'.</p>':'<p class="small muted" id="quiz-marked">Для уровня '+q.opt.depth+' нужно решить 3 из 4. Попробуйте ещё раз — задачи будут новые.</p>';
    else if(q.aiMade&&!q.opt.prog&&!q.opt.fresh) h+='<p class="small muted" id="quiz-marked">Это тренировка с задачами от ИИ: результат не влияет на прогресс.</p>';
    else if(isVocab) h+='<p class="small muted" id="quiz-marked">Результат сохранён в словаре уровня.</p>';
    else if(n>0) h+='<p class="small muted" id="quiz-marked">Результат сохранён. Новых изученных тем нет: тема засчитывается, когда по ней нет ни одной ошибки.</p>';

      h+=quoteHtml(ERRQ[(total+wrong.length)%ERRQ.length]);
      h+='<h3>Разбор ошибок</h3>';
      wrong.forEach(function(w){
        h+='<div class="why"><p><strong>'+esc(w.it.text)+'</strong></p><p class="small">Ваш ответ: '+esc(Core.shown(w.it,w.a))+'<br>Правильный ответ: <strong>'+esc(Core.answer(w.it))+'</strong></p>'+
           (w.it.why?'<p class="small">'+esc(w.it.why)+'</p>':'')+'</div>';
      });

    h+='<div class="row">';
    var f=q.topicId&&subj?Core.find(state,subj,q.topicId):null;
    if(f&&f.next&&n===total) h+='<button class="btn primary" id="next-topic" data-a="topic" data-id="'+esc(q.subjectId)+'|'+esc(f.next.id)+'">Следующая тема: '+esc(f.next.title)+'</button>';
    else if(q.topicId) h+='<button class="btn primary" data-a="topic" data-id="'+esc(q.subjectId)+'|'+esc(q.topicId)+'">Вернуться к объяснению</button>';

    else h+='<button class="btn primary" data-a="subject" data-id="'+esc(q.subjectId)+'">Вернуться к курсу</button>';

    return h+'</div>';

  h+='<section class="card stack" style="gap:16px"><div class="row between"><span class="muted small">'+esc(q.title)+'</span>'+
     '<span class="row" style="gap:6px"><span class="pill lv'+it.lv+'">'+Core.LV[it.lv]+'</span><span class="pill">Задание '+(q.i+1)+' из '+q.items.length+'</span></span></div>'+
     '<div class="bar"><span style="width:'+Math.round(q.i/q.items.length*100)+'%"></span></div>'+
     (q.aiMade?'<p class="small muted">Задачу составил ИИ. В ней возможна ошибка.</p>':'')+
     (q.opt.local?'<p class="small muted" id="quiz-local">'+TT('ИИ сейчас недоступен, поэтому задачи взяты из уроков — они проще олимпиадных.','ЖИ қазір қолжетімсіз, сондықтан есептер сабақтардан алынды — олар олимпиадалық есептерден жеңілірек.')+'</p>':'')+
     (q.opt.repeat?repeatRecap(q):'')+
     (q.opt.same&&q.i===0?'<p class="small muted" id="quiz-same">'+TT('Новые задачи по этой теме составляет Барс, но ИИ сейчас недоступен — поэтому вопросы те же, в другом порядке.','Бұл тақырып бойынша жаңа есептерді Барс құрастырады, бірақ ЖИ қазір қолжетімсіз — сондықтан сұрақтар сол, басқа ретпен.')+'</p>':'')+
     (it.type==='tf'?'<p class="small muted">Верно ли утверждение?</p>':'')+
     '<h2 id="quiz-question">'+esc(it.text)+'</h2>';
  if(it.type==='input'){
    if(!answered) h+='<form class="inline" data-f="answerInput"><label class="f" for="quiz-input">Ваш ответ<input type="text" id="quiz-input" name="a" maxlength="100" autocomplete="off" autocapitalize="off" spellcheck="false" required></label><button class="btn primary" type="submit">Проверить</button></form>';
    else h+='<p class="opt '+(ok?'right':'wrong')+'" id="quiz-typed"><span class="mark">'+(ok?'✓':'✕')+'</span>'+esc(picked)+'</p>';
  }else{
    h+='<div class="opts">';
    it.options.forEach(function(o,i){
      var cls='',mark='';
      if(answered){
        if(i===it.correct){cls=' right';mark='<span class="mark">✓</span>';}
        else if(i===picked){cls=' wrong';mark='<span class="mark">✕</span>';}
      }
      h+='<button class="opt'+cls+'" data-a="answer" data-id="'+i+'"'+(answered?' disabled':'')+'>'+mark+esc(o)+'</button>';
    });
    h+='</div>';
  }
  if(answered){
    h+=coach(ok?'yes':'no','<p id="coach-line">'+phrase(q,ok)+'</p>'+extraHtml(quizExtra(q))+(hasVoice()&&!autoVoice()?'<div><button class="btn small" id="speak-ans" data-a="speakAns">'+TT('Озвучить','Дыбыстау')+'</button></div>':''),44);
    h+='<div class="why '+(ok?'good':'bad')+'" id="quiz-why"><p><strong>'+(ok?'Верно.':'Неверно. Правильный ответ: '+esc(Core.answer(it))+'.')+'</strong></p>'+(it.why?'<p>'+esc(it.why)+'</p>':'')+'</div>';
    var a=q.ai&&q.ai.i===q.i?q.ai:null;
    if(a) h+='<div class="bubble ai'+(a.err?' err':'')+'" id="quiz-ai">'+(a.text?esc(a.text):'Думаю…')+'</div>';
    h+='<div class="row"><button class="btn primary" id="quiz-next" data-a="quizNext">'+(q.i+1<q.items.length?'Следующее задание':'Показать результат')+'</button>'+
       (!ok&&!a&&aiState!=='none'?'<button class="btn" id="quiz-ask" data-a="aiWhy">Спросить Барса, почему так</button>':'')+'</div>';
  }
  return h+repLink('quiz')+'</section></div>';
}

function byTime(a,b){return (a.time||'99').localeCompare(b.time||'99');}
function itemRow(x){
  var subj=Core.subject(state,x.subjectId),done=!!state.weekDone.ids[x.id];

    '<button class="chk" data-a="weekToggle" data-id="'+esc(x.id)+'" aria-pressed="'+done+'" aria-label="'+(done?'Снять отметку: ':'Отметить выполненным: ')+esc(x.text)+'">'+(done?'✓':'')+'</button>'+
    '<span class="t">'+(x.time?'<strong>'+esc(x.time)+'</strong> ':'')+esc(x.text)+(subj?' <span class="muted">· '+esc(subj.name)+'</span>':'')+'</span>'+
    '<button class="x" data-a="weekDel" data-id="'+esc(x.id)+'" aria-label="Удалить занятие: '+esc(x.text)+'">×</button></div>';
}
function viewWeek(){

  var h='<div class="stack"><section class="row between"><h1>Расписание на неделю</h1><span class="pill">Выполнено '+done+' из '+total+'</span></section>';
  h+='<form class="card inline" data-f="addWeek">'+
     '<label class="f" for="w-day">День<select id="w-day" name="day">'+DAYS.map(function(d,i){return '<option value="'+i+'"'+(i===today?' selected':'')+'>'+d+'</option>';}).join('')+'</select></label>'+
     '<label class="f" for="w-time">Время<input type="time" id="w-time" name="time"></label>'+

     '<label class="f" for="w-text" style="flex-basis:240px">Что сделать<input type="text" id="w-text" name="text" maxlength="120" placeholder="Например: пройти Past Simple" required></label>'+
     '<button class="btn primary" type="submit">Добавить занятие</button></form>';

var GRAPHS={
  'math-linear-fn':['2x+1','-x+4'],'math-systems':['5-x','x-1'],'math-inequalities':['2x+1','7'],'math-proportion':['3x'],
  'math-quadratic':['x^2-5x+6'],'math-vieta':['x^2-7x+12'],'math-parabola':['x^2-2x-3'],'math-intervals':['x^2-5x+4'],'math-inverse':['6/x','-6/x'],
  'math-roots':['sqrt(x)','x^2'],'math-powers':['2^x','x^2'],'math-log':['log2(x)','lg(x)'],'math-exp-eq':['2^x','8'],'math-log-eq':['log2(x)','5'],
  'math-trig-circle':['sin(x)','cos(x)'],'math-trig-formulas':['tan(x)'],'math-trig-graphs':['sin(x)','2sin(x)','sin(2x)'],'math-arc':['asin(x)','acos(x)'],'math-trig-eq':['sin(x)','0,5'],
  'math-derivative':['x^3-3x','3x^2-3'],'math-extremum':['-x^2+4x'],'math-tangent':['x^2','2x-1'],'math-integral':['x^2','2x']
};
function graphState(id){
  if(!ui.graph||ui.graph.id!==id){var d=GRAPHS[id]||['x'];ui.graph={id:id,fns:[d[0]||'',d[1]||'',d[2]||''],r:/trig|arc/.test(id)?5:10,x0:''};}
  return ui.graph;
}
var GSUB=['₁','₂','₃'];
function graphCard(t,step){
  var G=graphState(t.id),C=['accent','phys','good'],i;
  var h='<section class="card stack" style="gap:12px" id="graph-card"><h2>'+step+'. График</h2>'+
    '<p class="small muted">Впишите свою функцию или поменяйте числа — график перестроится сразу. Можно писать: 2x+1, x^2-4, 3/x, sqrt(x), 2^x, sin(x), cos(x), lg(x), ln(x), log2(x), abs(x). Углы в sin и cos — в радианах, число π пишется как pi.</p>'+
    '<canvas id="graph" class="lab" height="300" role="img" aria-label="График функций"></canvas><div id="graph-info" class="graph-info"></div><div class="lab-ctl">';
  for(i=0;i<3;i++)h+='<label class="f" for="gf-'+i+'"><span><i class="gdot" style="background:var(--'+C[i]+')"></i>y'+GSUB[i]+' =</span><input type="text" id="gf-'+i+'" data-gf="'+i+'" value="'+esc(G.fns[i])+'" maxlength="120" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+(i?'можно оставить пустым':'например, x^2-4')+'"></label>';
  h+='<label class="f" for="g-range">Видимая область по x<select id="g-range" data-gr="1">'+[3,5,10,20,50].map(function(r){return '<option value="'+r+'"'+(G.r===r?' selected':'')+'>от −'+r+' до '+r+'</option>';}).join('')+'</select></label>'+
     '<label class="f" for="g-x0">Найти значения при x =<input type="text" inputmode="decimal" id="g-x0" data-gx="1" value="'+esc(G.x0)+'" maxlength="12" placeholder="например, 2"></label></div></section>';
  return h;
}
function num(v){if(Math.abs(v)<5e-10)v=0;var r=Math.round(v*1000)/1000;return String(r).replace('.',',').replace('-','−');}
function drawGraph(){
  var cv=document.getElementById('graph'),info=document.getElementById('graph-info'),G=ui.graph;
  if(!cv||!G||!cv.getContext)return;
  var w=cv.clientWidth||320,H=300,dpr=window.devicePixelRatio||1,c=cv.getContext('2d');
  if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(H*dpr);}
  c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,H);
  var cs=getComputedStyle(document.documentElement);function v(n){return cs.getPropertyValue(n).trim()||'#888';}
  var COL=[v('--accent'),v('--phys'),v('--good')],xr=G.r,u=w/(2*xr),yr=H/2/u,cx=w/2,cy=H/2,k,i;
  var step=xr<=5?1:xr<=10?1:xr<=20?2:5,lab=xr<=5?1:xr<=10?2:xr<=20?5:10;
  for(k=Math.ceil(-xr/step)*step;k<=xr;k+=step)line(c,cx+k*u,0,cx+k*u,H,v('--soft'),1);
  for(k=Math.ceil(-yr/step)*step;k<=yr;k+=step)line(c,0,cy-k*u,w,cy-k*u,v('--soft'),1);
  line(c,0,cy,w,cy,v('--ink'),1.5);line(c,cx,0,cx,H,v('--ink'),1.5);
  c.fillStyle=v('--muted');c.font='11px sans-serif';
  for(k=Math.ceil(-xr/lab)*lab;k<=xr;k+=lab)if(k!==0)c.fillText(num(k),cx+k*u+3,cy+13);
  for(k=Math.ceil(-yr/lab)*lab;k<=yr;k+=lab)if(k!==0)c.fillText(num(k),cx+4,cy-k*u-3);
  var fs=[],errs=[],pts=[],lines=[];
  for(i=0;i<3;i++){try{fs[i]=Core.compile(G.fns[i]);}catch(e){fs[i]=null;errs[i]=String(e);}}
  for(i=0;i<3;i++){
    var f=fs[i];if(!f)continue;
    c.strokeStyle=COL[i];c.lineWidth=2.5;c.beginPath();
    var pen=false,prev=null,px;
    for(px=0;px<=w;px++){
      var x=-xr+px/u,y=f(x),py=cy-y*u;
      if(!isFinite(y)||Math.abs(py)>H*4||(prev!==null&&Math.abs(py-prev)>H)){pen=false;prev=isFinite(y)?py:null;continue;}
      if(pen)c.lineTo(px,py);else{c.moveTo(px,py);pen=true;}
      prev=py;
    }
    c.stroke();
  }
  for(i=0;i<3;i++){
    var nm='y'+GSUB[i];
    if(errs[i]){lines.push('<p class="msg err small" id="graph-err">'+nm+': '+esc(errs[i])+'</p>');continue;}
    var g=fs[i];if(!g)continue;
    var rs=Core.roots(g,-xr,xr),ex=Core.extrema(g,-xr,xr),y0=g(0),ci=COL[i];
    rs.forEach(function(r){pts.push([r,0,ci]);});ex.forEach(function(e){pts.push([e.x,e.y,ci]);});
    lines.push('<p class="small"><i class="gdot" style="background:'+ci+'"></i><strong>'+nm+' = '+esc(G.fns[i])+'</strong>: '+
      (rs.length?'нули x = '+rs.map(num).join('; '):'нулей на экране нет')+
      (isFinite(y0)?' · пересекает ось y в точке '+num(y0):'')+
      (ex.length?' · '+ex.map(function(e){return (e.max?'максимум':'минимум')+' ('+num(e.x)+'; '+num(e.y)+')';}).join(', '):'')+'</p>');
  }
  [[0,1],[0,2],[1,2]].forEach(function(pr){
    var a=fs[pr[0]],b=fs[pr[1]];if(!a||!b)return;
    var rs=Core.roots(function(x){return a(x)-b(x);},-xr,xr);if(!rs.length)return;
    rs.forEach(function(r){pts.push([r,a(r),v('--ink')]);});
    lines.push('<p class="small graph-cross">y'+GSUB[pr[0]]+' и y'+GSUB[pr[1]]+' пересекаются в '+(rs.length>1?'точках ':'точке ')+rs.map(function(r){return '('+num(r)+'; '+num(a(r))+')';}).join(', ')+'</p>');
  });
  var x0=parseFloat(String(G.x0).replace(',','.').replace('−','-'));
  if(isFinite(x0)){
    var vals=[];for(i=0;i<3;i++)if(fs[i]){var yy=fs[i](x0);vals.push('y'+GSUB[i]+' = '+(isFinite(yy)?num(yy):'не определено'));}
    if(vals.length)lines.push('<p class="small" id="graph-x0">При x = '+num(x0)+': '+vals.join(', ')+'</p>');
    if(Math.abs(x0)<=xr)line(c,cx+x0*u,0,cx+x0*u,H,v('--muted'),1,[4,4]);
  }
  pts.forEach(function(q){var X=cx+q[0]*u,Y=cy-q[1]*u;if(Y<-5||Y>H+5)return;c.fillStyle=q[2];c.beginPath();c.arc(X,Y,4.5,0,6.2832);c.fill();});
  if(info)info.innerHTML=lines.join('')||'<p class="small muted">Впишите функцию, например x^2-4.</p>';
}

function KKT(t){
  if(Object.prototype.hasOwnProperty.call(KK,t))return KK[t];
  var m,r;
  if((m=t.match(/^(\d+)\. (.+)$/))){r=KKT(m[2]);return r===null?null:m[1]+'. '+r;}
  if((m=t.match(/^(\d+) класс$/)))return m[1]+'-сынып';
  if((m=t.match(/^Задание (\d+) из (\d+)$/)))return 'Тапсырма '+m[1]+' / '+m[2];
  if((m=t.match(/^(\d+) из (\d+) · (\d+)%$/)))return m[1]+' / '+m[2]+' · '+m[3]+'%';
  if((m=t.match(/^(\d+) из (\d+) (темы|тем|тема)$/)))return m[1]+' / '+m[2]+' тақырып';
  if((m=t.match(/^(\d+) из (\d+)$/)))return m[1]+' / '+m[2];
  if((m=t.match(/^Уровень (\d+)$/)))return m[1]+'-деңгей';
  if((m=t.match(/^← (.+)$/))){r=KKT(m[1]);return r===null?null:'← '+r;}
  if((m=t.match(/^Объяснение: программа «(.+)»$/)))return '«'+(KKT(m[1])||m[1])+'» бағдарламасы: түсіндірме';
  if((m=t.match(/^Программа: (.+)$/)))return 'Бағдарлама: '+(KKT(m[1])||m[1]);
  if((m=t.match(/^Опыт на модели: (.+)$/)))return 'Модельдегі тәжірибе: '+m[1];
  if((m=t.match(/^Сегодня, (.+)$/)))return 'Бүгін, '+(KKT(m[1])||m[1]);
  if((m=t.match(/^Изучено (\d+) из (\d+) (темы|тем)$/)))return m[2]+' тақырыптың '+m[1]+' оқылды';
  if((m=t.match(/^Звёзд за глубину: (\d+) из (\d+)$/)))return 'Тереңдік жұлдыздары: '+m[1]+' / '+m[2];
  if((m=t.match(/^Лучший результат: (\d+) из (\d+)$/)))return 'Ең жақсы нәтиже: '+m[1]+' / '+m[2];
  if((m=t.match(/^Неверно\. Правильный ответ: (.+)\.$/)))return 'Дұрыс емес. Дұрыс жауап: '+m[1]+'.';
  if((m=t.match(/^Ваш ответ: (.*)$/)))return 'Сіздің жауабыңыз: '+m[1];
  return null;
}

function kkNeed(t){
  if(!(t.length>1&&/[А-Яа-яЁё]/.test(t)&&!/[ӘәҒғҚқҢңӨөҰұҮүҺһІі]/.test(t)))return false;

}
function kkT(t){t=String(t||'');var k=t.trim();return KKL()&&KKA[k]?KKA[k]:t;}
function kkWant(t){t=String(t||'').trim();if(t&&kkNeed(t)&&!KKA[t]&&(kkq.tries[t]||0)<2)kkq.want[t]=1;}
function kkPrefetch(items){

function kkPump(){
  if(KKL()&&aiState==='ready')while(kkq.busy<3){
    var batch=[],len=0,k;
    for(k in kkq.want){
      if(KKA[k]||(kkq.tries[k]||0)>=2){delete kkq.want[k];continue;}
      if(batch.length&&(len+k.length>2400||batch.length>=30))break;
      batch.push(k);len+=k.length;
    }
    if(!batch.length)break;

function kkSend(batch){
  kkq.busy++;
  var prompt='Переведи на казахский язык (қазақ тілі) строки из учебного приложения SkillMap для школьников. Пиши естественно, как в казахских школьных учебниках; научные термины переводи общепринятыми казахскими терминами; к ученику обращайся на «сіз». Формулы, числа, единицы измерения, химические формулы, английские слова и примеры на английском оставь без изменений. Если строка — обрывок фразы, переведи только его, сохрани знаки препинания по краям. Ответь только JSON-массивом из '+batch.length+' строк — переводов в том же порядке, без пояснений.\n'+JSON.stringify(batch);
  ai(prompt,{cache:false}).then(function(r){
    var arr=null,tx=String(r&&r.text||''),a=tx.indexOf('['),b=tx.lastIndexOf(']');
    try{if(a>=0&&b>a)arr=JSON.parse(tx.slice(a,b+1));}catch(e){}
    if(Array.isArray(arr)&&arr.length===batch.length){
      batch.forEach(function(x,i){var v=arr[i];if(typeof v==='string'&&v.trim()&&v.length<x.length*3+80){KKA[x]=v.trim();if(KKV)KKV[KKA[x]]=1;}});
      saveMap(KKAKEY,KKA);
    }else if(batch.length>1)batch.forEach(function(x){kkq.want[x]=1;});
  },function(e){if(e&&e.code==='not_granted')aiState='none';}).then(function(){
    kkq.busy--;
    if(KKL())translateDom();
    kkInd();
  });
}

function translateDom(){
  if(state.prefs.lang!=='kk')return;
  var root=document.body,w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),n,list=[];
  while((n=w.nextNode()))list.push(n);
  list.forEach(function(node){
    var raw=node.nodeValue,t=raw.trim();if(!t||(kkDone&&kkDone.has(node)))return;
    var par=node.parentElement;
    if(!par||par.closest('textarea,script,style,.orig,.bubble,[lang="en"],[lang="la"],#export-box,#kk-busy'))return;
    var r=par.closest('.note,.ex,.quote,.latin,#joke,.stop-title')?null:KKT(t);
    if(r!==null){node.nodeValue=raw.replace(t,r);if(kkDone)kkDone.add(node);return;}
    if(!kkNeed(t))return;
    if(KKA[t]){node.nodeValue=raw.replace(t,KKA[t]);if(kkDone)kkDone.add(node);return;}
    kkWant(t);
  });
  kkPump();
  root.querySelectorAll('[placeholder],[aria-label]').forEach(function(el){
    ['placeholder','aria-label'].forEach(function(a){var v=el.getAttribute(a);if(v){var r=KKT(v);if(r!==null)el.setAttribute(a,r);}});
  });
}

function startQuiz(subjectId,opt){
  var subj=Core.subject(state,subjectId);if(!subj)return;
  opt=opt||{};
  var topics=Core.topics(state,subj),title,key,limit=0,items;
  if(opt.aiQs){
    items=Core.buildQuiz([{id:opt.topicId,title:opt.title,qs:opt.aiQs}],0);title=(opt.depth?'Уровень '+opt.depth+': ':(opt.label||'Тренировка от ИИ')+': ')+opt.title;key=null;
    if(opt.fresh){title='Мини-тест: '+opt.title+TT(' (новые задачи)',' (жаңа есептер)');key='topic:'+opt.topicId;}
    if(opt.prog){title=(opt.repeat?TT('Повтор прошлого урока: ','Өткен сабақты қайталау: '):'Мини-тест «'+Core.TRK[opt.prog][0]+'»: ')+opt.title;key='ptopic:'+opt.prog+':'+opt.topicId;}
  }else if(opt.topicId){
    topics=topics.filter(function(t){return t.id===opt.topicId;});if(!topics.length)return;
    title=(opt.review?TT('Интервальное повторение: ','Аралықпен қайталау: '):opt.repeat?TT('Повтор прошлого урока: ','Өткен сабақты қайталау: '):'Мини-тест: ')+topics[0].title;key='topic:'+opt.topicId;items=topicItems(topics[0]);
    if(!GEN[opt.topicId]&&state.results[key])opt.same=true;
  }else if(opt.section!==undefined){
    var sec=Core.sections(state,subj)[opt.section];if(!sec)return;
    title='Тест по разделу: '+sec.title;key='section:'+subjectId+':'+opt.section;items=Core.buildQuiz(sec.topics,8);
  }else if(opt.vocab!==undefined){
    var V=VOCAB[opt.vocab];if(!V)return;
    items=Core.buildQuiz([{id:'vocab-'+opt.vocab,title:'Словарь '+V.level,qs:Core.vocabQuiz(opt.vocab)}],0);title='Словарь '+V.level+': тренировка слов';key='vocab:'+opt.vocab;
  }else{title='Тест по курсу: '+subj.name;key='subject:'+subjectId;items=Core.buildQuiz(topics,10);}
  if(!items.length)return;
  ui.quiz={subjectId:subjectId,topicId:opt.topicId||null,opt:opt,title:title,key:key,items:items,i:0,answers:[],aiMade:!!opt.aiQs,ai:null,passed:false};
  kkPrefetch(items);go('quiz');
}

    markActive();save();render();
  },
  askAI:function(fd){var t=Core.str(fd.get('q'),600);if(t)askAI(t);},
  report:function(fd){
    var at=ui.rep&&ui.rep.at;if(!at)return;var kind=String(fd.get('kind')||'other');if(!REPK.some(function(k){return k[0]===kind;}))kind='other';
    state.reports.push({id:uid('r'),d:todayS(),where:Core.str(repWhere(at),900)||'—',kind:kind,text:Core.str(fd.get('text'),500)});
    if(state.reports.length>200)state.reports=state.reports.slice(-200);
    ui.rep={at:at,sent:true};save();render();
  },
  aiTopic:function(fd){var t=Core.str(fd.get('title'),100);if(t)aiTopic(t);},
  addLink:function(fd,f){
    var url=Core.url(fd.get('url'));
    if(!url){ui.msg={at:'link',text:'Это не похоже на ссылку. Вставьте адрес целиком, например https://youtube.com/watch?v=…'};render();return;}
    var id=f.dataset.id;
    (state.links[id]=state.links[id]||[]).push({id:uid('l'),title:Core.str(fd.get('title'),100)||url,url:url});
    ui.msg=null;save();render();
  },
  addWeek:function(fd){
    var text=Core.str(fd.get('text'),120);if(!text)return;
    var time=String(fd.get('time')||'');
    state.week.push({id:uid('w'),day:Number(fd.get('day'))||0,time:/^\d\d:\d\d$/.test(time)?time:'',subjectId:String(fd.get('subjectId')||''),text:text});
    save();render();
  },
  import:function(fd){
    var s=null;
    try{s=Core.clean(JSON.parse(String(fd.get('code'))));}catch(e){}
    if(!s){ui.msg={text:'Код не подошёл. Скопируйте его целиком из раздела «Сохранить копию» и вставьте ещё раз.',err:true};render();return;}
    state=s;var k=Core.weekKey(new Date());if(state.weekDone.key!==k)state.weekDone={key:k,ids:{}};
    save();applyTheme();applyLang();ui.msg={text:'Данные загружены.'};render();
  }
};
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  var fn=actions[b.dataset.a];if(fn)fn(b.dataset.id,b);
});
function addPhoto(id,file,gallery){
  function fail(t){ui.msg={at:'photo',text:t};render();}
  if(!file||!/^image\//.test(file.type)){fail('Это не картинка. Выберите файл JPG или PNG.');return;}
  var rd=new FileReader();
  rd.onerror=function(){fail('Не получилось прочитать файл.');};
  rd.onload=function(){
    if(gallery&&file.type==='image/gif'){
      if(file.size>700000){fail('Анимация больше 700 КБ. Выберите файл поменьше или закрепите её ссылкой в материалах.');return;}
      var gk='g:'+id,gp=photos[gk];photos[gk]=(gp||[]).concat([String(rd.result)]).slice(0,8);
      if(!savePhotos()){if(gp===undefined)delete photos[gk];else photos[gk]=gp;fail('В браузере не хватило места для анимации. Уберите другие картинки и попробуйте снова.');return;}
      ui.msg=null;render();return;
    }
    var img=new Image();
    img.onerror=function(){fail('Не получилось открыть картинку. Попробуйте другой файл.');};
    img.onload=function(){
      try{
        var k=Math.min(1,480/Math.max(img.width,img.height)),c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        var url=c.toDataURL('image/jpeg',0.82),key=gallery?'g:'+id:id,prev=photos[key];
        if(gallery){photos[key]=(prev||[]).concat([url]).slice(0,8);}else photos[key]=url;
        if(!savePhotos()){if(prev===undefined)delete photos[key];else photos[key]=prev;fail('В браузере не хватило места для картинки. Уберите другие картинки и попробуйте снова.');return;}
        ui.msg=null;render();
      }catch(e){fail('Не получилось обработать картинку.');}
    };
    img.src=String(rd.result);
  };
  rd.readAsDataURL(file);
}
document.addEventListener('change',function(e){
  var el=e.target;
  if(el&&el.dataset&&el.dataset.gr&&ui.graph){ui.graph.r=Number(el.value)||10;drawGraph();return;}
  if(el&&el.dataset&&el.dataset.c==='labPick'){
    var ct=state.topics.filter(function(x){return x.id===el.dataset.id;})[0];
    if(ct){if(LABS[el.value])ct.lab=el.value;else delete ct.lab;ui.lab=null;save();render();}
    return;
  }
  if(el&&el.dataset&&el.dataset.c==='engine'){state.prefs.engine=el.value==='device'?'device':'claude';save();render();say(TT('Так звучит этот голос.','Бұл дауыс осылай естіледі.'),true);return;}
  if(el&&el.dataset&&el.dataset.c==='devName'){state.prefs.devName=Core.str(el.value,120);save();say(TT('Привет! Я Барс. Так звучит этот голос.','Сәлем! Мен Барспын. Бұл дауыс осылай естіледі.'),true);return;}
  if(el&&el.dataset&&el.dataset.c==='rate'){var rv=Number(el.value);state.prefs.rate=rv===0.8||rv===1.1?rv:0.95;save();say(TT('Такая скорость подойдёт?','Бұл жылдамдық жарай ма?'),true);return;}
  if(el&&el.dataset&&el.dataset.c==='track'&&el.value){actions.track(el.dataset.id+'|'+el.value);return;}
  if(el&&el.dataset&&el.dataset.c==='examSec'){ui.examCfg=ui.examCfg||{};ui.examCfg.sec=Number(el.value);render();return;}
  if(el&&el.dataset&&el.dataset.c==='examN'){ui.examCfg=ui.examCfg||{};ui.examCfg.n=Number(el.value)||20;render();return;}
  if(el&&el.dataset&&el.dataset.c==='planN'&&ui.quiz){ui.quiz.planN=Number(el.value)||5;render();return;}
  if(el&&el.dataset&&el.dataset.c==='planT'&&ui.quiz){if(/^\d\d:\d\d$/.test(el.value))ui.quiz.planT=el.value;render();return;}
  if(el&&el.dataset&&el.dataset.c==='photo'){addPhoto(el.dataset.id,el.files&&el.files[0]);return;}
  if(el&&el.dataset&&el.dataset.c==='gallery'){addPhoto(el.dataset.id,el.files&&el.files[0],true);return;}
  if(el&&el.dataset&&el.dataset.c==='voiceName'&&Core.VOICES.some(function(v){return v[0]===el.value;})){
    state.prefs.voiceName=el.value;save();say(TT('Привет! Я Барс. Так звучит этот тембр.','Сәлем! Мен Барспын. Бұл тембр осылай естіледі.'),true);
  }
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el&&el.dataset&&el.dataset.gf!==undefined&&ui.graph){ui.graph.fns[Number(el.dataset.gf)]=el.value;drawGraph();return;}
  if(el&&el.dataset&&el.dataset.gx&&ui.graph){ui.graph.x0=el.value;drawGraph();return;}
  if(el&&el.dataset&&el.dataset.lab&&ui.lab){
    var val=Number(el.value);if(!isFinite(val))return;
    ui.lab.p[el.dataset.lab]=val;
    if(LABS[ui.lab.id].restart)ui.lab.t=0;
    var o=document.getElementById('lab-v-'+el.dataset.lab);if(o)o.textContent=fx(val,Number(el.dataset.d)||0);
    var info=document.getElementById('lab-info');if(info)info.textContent=LABS[ui.lab.id].info(ui.lab.p,ui.lab.t);
  }
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  var fn=forms[e.target.dataset.f];if(fn)fn(new FormData(e.target),e.target);
});
window.addEventListener('hashchange',function(){
  var h=location.hash.slice(1);
  if((h==='home'||h==='week'||h==='data'||h==='labs'||h==='mist')&&h!==ui.view){ui.view=h;ui.confirm=null;ui.msg=null;render();}
});
(function(){var h=location.hash.slice(1);if(h==='week'||h==='data'||h==='labs'||h==='mist')ui.view=h;})();
render();
})();
