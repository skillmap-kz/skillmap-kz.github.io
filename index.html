  ['in','Momentum changes by 12 N s in 0.4 s. Average force (N)?',['30'],'F = Δp/Δt = 12/0.4.']]},
{id:'alp-forces',tag:'AS',title:'Forces, density and pressure',
 sum:'Момент силы (moment) = F · d, где d — перпендикулярное расстояние до оси. Пара сил (couple): две равные противоположные силы, её момент (torque) = F · расстояние между ними. Равновесие: равнодействующая = 0 и сумма моментов = 0 (principle of moments). Центр тяжести (centre of gravity) — точка, где можно считать приложенным вес. Плотность ρ = m/V; давление p = F/A; в жидкости Δp = ρgΔh. Выталкивающая сила (upthrust) равна весу вытесненной жидкости.',
 ex:['Moment of 20 N at 0.3 m: 6 N m','Pressure 10 m below water surface (ρ = 1000): ρgh = 98 100 Pa extra','A 0.002 m³ object fully in water: upthrust = 1000 · 9.81 · 0.002 ≈ 19.6 N'],
 tip:'Расстояние в моменте — перпендикуляр от оси до линии действия силы, а не длина стержня.',
 qs:[['Moment of a 50 N force acting 0.4 m from the pivot (perpendicular):','20 N m','125 N m','12.5 N m','50 · 0.4.'],
  ['Unit of pressure:','Pa (N m⁻²)','N m','J m⁻¹','p = F/A.'],
  ['Upthrust on a submerged object equals…','the weight of fluid displaced','the weight of the object','the pressure at the bottom','Archimedes’ principle.'],
  ['tf','A couple produces turning but no resultant force.',true,'The two forces are equal and opposite.'],
  ['tf','Pressure in a liquid depends on the shape of the container.',false,'Only on depth, density and g.'],
  ['in','Mass 600 kg, volume 0.25 m³. Density (kg m⁻³)?',['2400'],'ρ = m/V.']]},
{id:'alp-energy',tag:'AS',title:'Work, energy and power',
 sum:'Работа W = Fs cos θ. Кинетическая энергия Eₖ = ½mv², изменение потенциальной ΔEₚ = mgΔh. Работа газа при постоянном давлении W = pΔV. Мощность P = W/t = Fv. КПД (efficiency) = полезная выходная энергия / вся входная энергия · 100%. Закон сохранения энергии.',
 ex:['Motor lifts 50 kg by 4 m in 8 s: P = 50 · 9.81 · 4/8 ≈ 245 W','Car at 25 m/s, driving force 800 N: P = 20 kW','Efficiency: 300 J useful from 1200 J input = 25%'],
 tip:'P = Fv — короткий путь к ответу, когда даны сила тяги и скорость.',
 qs:[['A 2 kg mass moves at 3 m/s. Kinetic energy:','9 J','6 J','18 J','½ · 2 · 9.'],
  ['Unit equivalent to the watt:','J s⁻¹','J s','N s','P = W/t.'],
  ['A force of 500 N moves a car at 20 m/s. Power:','10 kW','25 W','520 W','P = Fv.'],
  ['tf','Efficiency can be greater than 100%.',false,'Output can never exceed input.'],
  ['tf','Work done by a gas at constant pressure is pΔV.',true,'W = pΔV.'],
  ['in','A machine uses 800 J and gives 200 J of useful work. Efficiency (%)?',['25'],'200/800.']]},
{id:'alp-solids',tag:'AS',title:'Deformation of solids',
 sum:'Закон Гука (Hooke’s law): F = kx до предела пропорциональности (limit of proportionality). Напряжение (stress) σ = F/A, деформация (strain) ε = x/L, модуль Юнга (Young modulus) E = σ/ε. Энергия упругой деформации (elastic potential energy) = площадь под графиком F–x = ½Fx = ½kx². Упругая деформация (elastic) исчезает после снятия нагрузки, пластическая (plastic) — остаётся.',
 ex:['Spring k = 200 N/m stretched 0.05 m: F = 10 N, energy 0.25 J','Wire: F = 50 N, A = 1.0 × 10⁻⁶ m²: stress 5.0 × 10⁷ Pa','Stress 2 × 10⁸ Pa, strain 1 × 10⁻³: E = 2 × 10¹¹ Pa'],
 tip:'Strain не имеет единиц, а у Young modulus те же единицы, что у stress — Pa.',
 qs:[['Young modulus =','stress / strain','strain / stress','force / extension','Definition.'],
  ['Unit of strain:','no unit','Pa','m','Ratio of two lengths.'],
  ['Elastic potential energy stored for force F and extension x (Hooke’s law obeyed):','½Fx','Fx','2Fx','Area of the triangle under the F–x graph.'],
  ['tf','Plastic deformation is permanent.',true,'The material does not return to its original length.'],
  ['tf','Hooke’s law holds beyond the limit of proportionality.',false,'Only up to it.'],
  ['in','A spring with k = 400 N/m is stretched by 0.1 m. Energy stored (J)?',['2'],'½ · 400 · 0.01.']]},
{id:'alp-waves',tag:'AS',title:'Waves',
 sum:'v = fλ, период T = 1/f. Поперечные волны (transverse): колебания перпендикулярно распространению, продольные (longitudinal) — вдоль. Интенсивность I = P/A и I ∝ A² (квадрат амплитуды). Эффект Доплера для движущегося источника: f_o = f_s · v/(v ± v_s) — минус при приближении. Электромагнитный спектр: radio, microwave, infrared, visible (400–700 nm), ultraviolet, X-ray, γ; в вакууме все идут со скоростью c = 3.00 × 10⁸ m/s. Поляризация — только у поперечных волн; закон Малюса I = I₀ cos²θ.',
 ex:['f = 50 Hz, λ = 4 m: v = 200 m/s','Amplitude doubled ⇒ intensity × 4','Source 500 Hz approaches at 30 m/s (v = 330): f = 500 · 330/300 = 550 Hz'],
 tip:'Поляризовать можно только поперечную волну — звук в воздухе не поляризуется.',
 qs:[['A wave has f = 200 Hz and λ = 1.5 m. Speed:','300 m/s','133 m/s','201.5 m/s','v = fλ.'],
  ['Amplitude is halved. Intensity becomes…','¼ of the original','½ of the original','unchanged','I ∝ A².'],
  ['Which waves can be polarised?','transverse only','longitudinal only','both','Polarisation restricts oscillations to one plane.'],
  ['tf','All electromagnetic waves travel at the same speed in a vacuum.',true,'c = 3.00 × 10⁸ m/s.'],
  ['tf','When a source moves towards you, the observed frequency decreases.',false,'It increases.'],
  ['in','Polarised light of intensity 80 passes a polariser at 60°. Transmitted intensity?',['20'],'80 cos²60° = 80 · 0.25.']]},
{id:'alp-superposition',tag:'AS',title:'Superposition: interference, diffraction, stationary waves',
 sum:'Принцип суперпозиции: смещения волн в точке складываются. Стоячая волна (stationary wave) — наложение двух одинаковых встречных волн; расстояние между соседними узлами (nodes) λ/2. Дифракция заметна, когда щель сравнима с длиной волны. Интерференция двух когерентных (coherent — постоянная разность фаз) источников, опыт Юнга: λ = ax/D. Дифракционная решётка (diffraction grating): d sin θ = nλ, d = 1/(число штрихов на метр).',
 ex:['Nodes 0.25 m apart ⇒ λ = 0.50 m','Young: a = 0.5 mm, D = 2.0 m, x = 2.4 mm ⇒ λ = 600 nm','Grating 500 lines/mm: d = 2.0 × 10⁻⁶ m; λ = 600 nm: sin θ₁ = 0.3'],
 tip:'В решётке «lines per mm» сначала переведите в d в метрах: d = 1/(N · 1000).',
 qs:[['Distance between adjacent nodes in a stationary wave:','λ/2','λ','λ/4','Node to node is half a wavelength.'],
  ['Two-source interference needs the sources to be…','coherent','of different frequency','very bright','Constant phase difference.'],
  ['Grating equation:','d sin θ = nλ','λ = ax/D','v = fλ','Grating formula.'],
  ['tf','Stationary waves transfer energy along the medium.',false,'Progressive waves transfer energy; stationary waves store it.'],
  ['tf','Diffraction is greatest when the gap is about the same size as the wavelength.',true,'Typical condition.'],
  ['in','A grating has 300 lines per mm. Spacing d in μm (2 d.p.)?',['3.33'],'1/300 mm = 3.33 μm.']]},
{id:'alp-electricity',tag:'AS',title:'Electricity',
 sum:'Ток I = ΔQ/Δt, I = nAvq (n — концентрация носителей). Разность потенциалов V = W/Q. Сопротивление R = V/I, мощность P = VI = I²R = V²/R. Удельное сопротивление (resistivity): R = ρL/A. Вольт-амперные характеристики (I–V characteristics): у металла при постоянной температуре — прямая (закон Ома), у лампы накаливания (filament lamp) R растёт с нагревом, у диода ток идёт в одну сторону, у термистора (NTC thermistor) R падает с ростом температуры, у фоторезистора (LDR) — с ростом освещённости.',
 ex:['2 A for 30 s: Q = 60 C','Wire ρ = 1.7 × 10⁻⁸ Ω m, L = 10 m, A = 1.0 × 10⁻⁶ m²: R = 0.17 Ω','12 V, 2 A: P = 24 W'],
 tip:'Если просят «resistivity», ответ в Ω m, а не в Ω.',
 qs:[['Charge passing when 3 A flows for 20 s:','60 C','6.7 C','23 C','Q = It.'],
  ['Resistance of a wire is proportional to…','length / area','area / length','length × area','R = ρL/A.'],
  ['As the temperature of an NTC thermistor rises, its resistance…','decreases','increases','stays the same','More charge carriers.'],
  ['tf','The resistance of a filament lamp increases as it gets hotter.',true,'Ions vibrate more.'],
  ['tf','Doubling the diameter of a wire halves its resistance.',false,'Area × 4, so R ÷ 4.'],
  ['in','A 6 Ω resistor carries 2 A. Power (W)?',['24'],'I²R = 4 · 6.']]},
{id:'alp-dc',tag:'AS',title:'D.C. circuits',
 sum:'Законы Кирхгофа: первый (сумма токов в узле = 0) — сохранение заряда; второй (в замкнутом контуре сумма ЭДС = сумма падений напряжения) — сохранение энергии. Последовательно R = R₁ + R₂, параллельно 1/R = 1/R₁ + 1/R₂. ЭДС и внутреннее сопротивление (e.m.f., internal resistance): E = I(R + r), напряжение на клеммах V = E − Ir. Делитель напряжения (potential divider): V_out = V_in · R₂/(R₁ + R₂). Потенциометр сравнивает напряжения по нулевому показанию гальванометра.',
 ex:['6 Ω and 3 Ω in parallel: 2 Ω','E = 12 V, r = 1 Ω, R = 5 Ω: I = 2 A, terminal p.d. 10 V','Potential divider 2 kΩ and 3 kΩ across 10 V: 6 V across 3 kΩ'],
 tip:'Если с ростом тока напряжение на клеммах падает — это внутреннее сопротивление: V = E − Ir.',
 qs:[['Two 4 Ω resistors in parallel:','2 Ω','8 Ω','4 Ω','1/R = ¼ + ¼.'],
  ['E = 9 V, r = 2 Ω, external R = 7 Ω. Current:','1 A','1.29 A','4.5 A','I = 9/(7 + 2).'],
  ['Kirchhoff’s first law is a consequence of conservation of…','charge','energy','momentum','Charge cannot pile up at a junction.'],
  ['tf','Terminal p.d. equals the e.m.f. when no current flows.',true,'V = E − Ir with I = 0.'],
  ['tf','Kirchhoff’s second law is based on conservation of charge.',false,'Conservation of energy.'],
  ['in','10 V across 1 kΩ and 4 kΩ in series. Voltage across 4 kΩ (V)?',['8'],'10 · 4/5.']]},
{id:'alp-particles',tag:'AS',title:'Particle physics',
 sum:'Опыт Резерфорда (α-particle scattering): большинство частиц проходит насквозь — атом в основном пуст; редкие отражения назад — маленькое массивное положительное ядро. Нуклид ᴬ_Z X: A — нуклонное число, Z — протонное; изотопы — одинаковое Z, разное A. Распады: α (₂⁴He, A − 4, Z − 2), β⁻ (нейтрон → протон + электрон + антинейтрино), β⁺ (протон → нейтрон + позитрон + нейтрино), γ (не меняет A и Z). Кварки: u (+⅔e), d (−⅓e), s (−⅓e); протон uud, нейтрон udd. Адроны (hadrons) — из кварков: барионы (3 кварка) и мезоны (кварк + антикварк); лептоны (электрон, нейтрино) — фундаментальные.',
 ex:['²³⁸U → ²³⁴Th + α','β⁻: d → u + e⁻ + ν̄','Proton charge: ⅔ + ⅔ − ⅓ = +1'],
 tip:'β-спектр непрерывный — поэтому нужна третья частица, (анти)нейтрино.',
 qs:[['Quark composition of a proton:','uud','udd','uuu','Charge +1.'],
  ['In α decay the nucleon number…','decreases by 4','decreases by 2','stays the same','α = ⁴He.'],
  ['Particle emitted with a β⁺ particle:','electron neutrino','electron antineutrino','photon only','p → n + e⁺ + ν.'],
  ['tf','Most α-particles passed straight through the gold foil.',true,'The atom is mostly empty space.'],
  ['tf','An electron is a hadron.',false,'It is a lepton.'],
  ['in','Charge of the d quark in units of e (as a fraction)?',['−1/3','-1/3'],'d = −⅓e.']]}
]},
{title:'A Level',topics:[
{id:'alp-circular',tag:'A2',title:'Motion in a circle',
 sum:'Угловая скорость ω = Δθ/Δt = 2π/T, линейная v = ωr. Центростремительное ускорение a = v²/r = ω²r направлено к центру. Нужная для этого сила F = mv²/r = mω²r — это не новая сила, её создают натяжение, трение, гравитация и т. п. Радианы: 2π рад = 360°.',
 ex:['T = 2 s: ω = π rad/s','m = 0.5 kg, v = 4 m/s, r = 2 m: F = 4 N','Car on a bend: friction provides the centripetal force'],
 tip:'Центростремительная сила — это результирующая сил, а не отдельная сила на рисунке.',
 qs:[['ω for T = 4 s:','π/2 rad/s','4π rad/s','π/4 rad/s','2π/4.'],
  ['Centripetal acceleration is directed…','towards the centre','along the tangent','away from the centre','a = v²/r towards the centre.'],
  ['Mass 2 kg, v = 3 m/s, r = 1.5 m. Centripetal force:','12 N','4 N','9 N','2 · 9/1.5.'],
  ['tf','An object moving in a circle at constant speed is accelerating.',true,'The direction of velocity changes.'],
  ['tf','Centripetal force does work on the object.',false,'It is perpendicular to the motion.'],
  ['in','v = 6 m/s, r = 3 m. Centripetal acceleration (m s⁻²)?',['12'],'36/3.']]},
{id:'alp-gravfields',tag:'A2',title:'Gravitational fields',
 sum:'Закон тяготения: F = GMm/r². Напряжённость поля g = F/m = GM/r². Гравитационный потенциал φ = −GM/r (работа по переносу 1 кг из бесконечности; всегда отрицателен); потенциальная энергия Eₚ = −GMm/r. Орбита: GMm/r² = mv²/r ⇒ v² = GM/r, T² ∝ r³. Геостационарная орбита (geostationary): период 24 ч, над экватором, вращение с запада на восток.',
 ex:['Double the distance ⇒ force ÷ 4','g at the Earth’s surface ≈ 9.81 N/kg','Satellite: higher orbit ⇒ slower speed, longer period'],
 tip:'Потенциал φ отрицателен и растёт (к нулю) при удалении от планеты.',
 qs:[['The distance between two masses is tripled. The force becomes…','1/9 of the original','1/3 of the original','3 times larger','Inverse square law.'],
  ['Gravitational potential at the surface of a planet is…','negative','positive','zero','φ = −GM/r.'],
  ['Period of a geostationary satellite:','24 hours','12 hours','1 hour','It stays above one point on the equator.'],
  ['tf','A satellite in a higher orbit moves more slowly.',true,'v = √(GM/r).'],
  ['tf','Gravitational field strength has the unit J/kg.',false,'N/kg (or m s⁻²); J/kg is the unit of potential.'],
  ['in','g at the surface is 9.8 N/kg. g at twice the radius from the centre (N/kg)?',['2.45'],'9.8/4.']]},
{id:'alp-thermal',tag:'A2',title:'Temperature, ideal gases and thermodynamics',
 sum:'Термодинамическая шкала: T (K) = θ (°C) + 273.15; абсолютный ноль 0 K. Уравнение идеального газа: pV = nRT = NkT (R = 8.31 J mol⁻¹ K⁻¹, k = 1.38 × 10⁻²³ J/K). Средняя кинетическая энергия молекулы ⟨Eₖ⟩ = 3/2 kT. Первое начало: ΔU = q + W (q — тепло, переданное газу, W — работа, совершённая над газом). Удельная теплоёмкость Q = mcΔθ, удельная теплота фазового перехода Q = mL.',
 ex:['27 °C = 300 K','1 mol at 300 K in 0.025 m³: p = 8.31 · 300/0.025 ≈ 1.0 × 10⁵ Pa','Heat 2 kg of water by 10 K (c = 4200): Q = 84 kJ'],
 tip:'Температуру в формулах газа — только в кельвинах.',
 qs:[['100 °C in kelvin:','373 K','100 K','173 K','100 + 273.'],
  ['At constant volume the pressure of an ideal gas is proportional to…','thermodynamic temperature','Celsius temperature','volume','p ∝ T at constant V and n.'],
  ['Mean kinetic energy of a gas molecule is proportional to…','T','√T','T²','⟨Eₖ⟩ = 3/2 kT.'],
  ['tf','In ΔU = q + W, W is the work done on the gas.',true,'Cambridge sign convention.'],
  ['tf','Doubling the Celsius temperature doubles the mean kinetic energy.',false,'Only thermodynamic (kelvin) temperature works.'],
  ['in','Energy to heat 0.5 kg of water by 20 K (c = 4200 J kg⁻¹ K⁻¹), in kJ?',['42'],'0.5 · 4200 · 20 = 42 000 J.']]},
{id:'alp-shm',tag:'A2',title:'Oscillations: simple harmonic motion',
 sum:'Гармоническое колебание (SHM): a = −ω²x — ускорение пропорционально смещению и направлено к положению равновесия. x = x₀ sin ωt, v = ±ω√(x₀² − x²), v_max = ωx₀, a_max = ω²x₀; ω = 2πf = 2π/T. Полная энергия ½mω²x₀² постоянна. Затухание (damping): лёгкое, критическое, сильное. Резонанс (resonance) — максимум амплитуды при частоте вынуждающей силы, равной собственной частоте.',
 ex:['f = 2 Hz, x₀ = 0.05 m: ω = 4π, v_max ≈ 0.63 m/s','At x = 0 the speed is maximum; at x = ±x₀ the acceleration is maximum','Car suspension uses critical damping'],
 tip:'Скорость максимальна в равновесии, ускорение — в крайних точках.',
 qs:[['The defining equation of SHM:','a = −ω²x','a = ω²x','v = ωx','Acceleration ∝ displacement, towards equilibrium.'],
  ['Maximum speed in SHM:','ωx₀','ω²x₀','x₀/ω','v = ω√(x₀² − x²) at x = 0.'],
  ['Resonance happens when…','driving frequency = natural frequency','damping is critical','amplitude is zero','Maximum energy transfer.'],
  ['tf','In SHM the period does not depend on amplitude.',true,'Isochronous.'],
  ['tf','Acceleration is greatest at the equilibrium position.',false,'It is zero there.'],
  ['in','ω = 10 rad/s, amplitude 0.03 m. Maximum speed (m/s)?',['0.3'],'ωx₀.']]},
{id:'alp-efields',tag:'A2',title:'Electric fields and capacitance',
 sum:'Однородное поле между пластинами: E = V/d, сила на заряд F = qE. Закон Кулона: F = Qq/(4πε₀r²); поле точечного заряда E = Q/(4πε₀r²), потенциал V = Q/(4πε₀r). Ёмкость C = Q/V (фарад). Энергия конденсатора W = ½QV = ½CV². Параллельно C = C₁ + C₂, последовательно 1/C = 1/C₁ + 1/C₂. Разряд через резистор: Q = Q₀e^(−t/RC), постоянная времени (time constant) τ = RC.',
 ex:['200 V across plates 4 mm apart: E = 5 × 10⁴ V/m','C = 100 μF at 12 V: Q = 1.2 mC, W = 7.2 mJ','R = 10 kΩ, C = 100 μF: τ = 1 s'],
 tip:'За время τ = RC заряд падает до 37% (1/e) от начального.',
 qs:[['Field between plates 0.02 m apart with 100 V:','5000 V/m','2 V/m','200 V/m','E = V/d.'],
  ['Energy stored in a capacitor:','½CV²','CV²','CV','Area under the Q–V graph.'],
  ['Two 10 μF capacitors in parallel:','20 μF','5 μF','10 μF','Add in parallel.'],
  ['tf','Capacitors in series have a smaller total capacitance than each one.',true,'1/C = 1/C₁ + 1/C₂.'],
  ['tf','The force between point charges is proportional to 1/r.',false,'It is proportional to 1/r².'],
  ['in','R = 20 kΩ, C = 50 μF. Time constant (s)?',['1'],'RC = 20 000 · 0.00005.']]},
{id:'alp-magnetic',tag:'A2',title:'Magnetic fields',
 sum:'Сила на проводник с током: F = BIL sin θ (правило левой руки — Fleming’s left-hand rule). Сила на движущийся заряд: F = Bqv sin θ; в однородном поле частица движется по окружности радиуса r = mv/(Bq). Селектор скоростей (скрещенные поля): частица проходит без отклонения при v = E/B. Эффект Холла: V_H = BI/(ntq). Магнитная индукция B измеряется в тесла (T).',
 ex:['L = 0.2 m, I = 3 A, B = 0.5 T: F = 0.3 N','Electron: faster ⇒ larger circle','E = 2 × 10⁴ V/m, B = 0.1 T: v = 2 × 10⁵ m/s'],
 tip:'Сила Bqv перпендикулярна скорости, поэтому не меняет модуль скорости и не совершает работы.',
 qs:[['Force on a 0.5 m wire carrying 4 A at 90° to a 0.2 T field:','0.4 N','10 N','1.6 N','BIL.'],
  ['A charged particle moves at 90° to a uniform magnetic field. Its path is…','a circle','a parabola','a straight line','The force is always perpendicular to v.'],
  ['Velocity selector: undeflected particles have speed…','E/B','B/E','EB','qE = Bqv.'],
  ['tf','The magnetic force on a moving charge does no work.',true,'It is perpendicular to the velocity.'],
  ['tf','The radius r = mv/(Bq) increases when B increases.',false,'It decreases.'],
  ['in','B = 0.25 T, I = 2 A, L = 0.4 m, at 90°. Force (N)?',['0.2'],'0.25 · 2 · 0.4.']]},
{id:'alp-induction',tag:'A2',title:'Electromagnetic induction and alternating current',
 sum:'Магнитный поток Φ = BA cos θ (Wb), потокосцепление NΦ. Закон Фарадея: ЭДС индукции равна скорости изменения потокосцепления, ε = −N ΔΦ/Δt. Правило Ленца: индукционный ток противодействует причине, вызвавшей его (сохранение энергии). Переменный ток: I_rms = I₀/√2, V_rms = V₀/√2, средняя мощность на резисторе ½I₀²R. Выпрямление (rectification) диодами: однополупериодное и двухполупериодное (мост), сглаживание конденсатором.',
 ex:['Coil 100 turns, flux changes by 0.02 Wb in 0.1 s: ε = 20 V','Peak 325 V ⇒ r.m.s. ≈ 230 V','I₀ = 2 A through 10 Ω: mean power 20 W'],

{id:'alp-quantum',tag:'A2',title:'Quantum physics',
 sum:'Фотон: E = hf = hc/λ, импульс p = E/c (h = 6.63 × 10⁻³⁴ J s). 1 eV = 1.60 × 10⁻¹⁹ J. Фотоэффект: hf = Φ + ½mv²_max, Φ — работа выхода (work function), пороговая частота f₀ = Φ/h; интенсивность света влияет на число электронов, а частота — на их энергию. Волны де Бройля: λ = h/p = h/(mv); доказательство — дифракция электронов. Уровни энергии атома: hf = E₁ − E₂, линейчатые спектры испускания и поглощения.',

{id:'alp-nuclear',tag:'A2',title:'Nuclear physics',

{id:'alp-astro',tag:'A2',title:'Astronomy and cosmology',

add('alp-units',[function(n){

  var x=gP([10,20,25,40,50]),dx=gP([0.1,0.2,0.5,1]);return T('A length is '+x+' ± '+gF(dx)+' cm. Find the percentage uncertainty.',dx/x*100,'%',gW(dx/x*100,[dx*100,x*dx]),gF(dx)+'/'+x+' · 100 = '+gF(dx/x*100)+'%.');

  var T1=gP([200,250,300,400]),p1=gP([100,120,150,200]),f=gP([1.5,2,3]);return T('A fixed mass of ideal gas at constant volume has pressure '+p1+' kPa at '+T1+' K. Find the pressure at '+(T1*f)+' K.',p1*f,' kPa',gW(p1*f,[p1/f,p1+f]),'p/T = const: '+p1+' · '+gF(f)+' = '+gF(p1*f)+' kPa.');
}]);
add('alp-shm',[function(n){

  if(k===0)return T('A body moves with SHM: ω = '+w+' rad/s, amplitude '+gF(x0)+' m. Find the maximum speed.',w*x0,' m/s',gW(w*x0,[w*w*x0,x0/w]),'v_max = ωx₀ = '+gF(w*x0)+' m/s.');
  return T('A body moves with SHM: ω = '+w+' rad/s, amplitude '+gF(x0)+' m. Find the maximum acceleration.',w*w*x0,' m s⁻²',gW(w*w*x0,[w*x0,w*w]),'a_max = ω²x₀ = '+gF(w*w*x0)+' m s⁻².');

add('alp-efields',[function(n){
  var k=n%3;
  if(k===0){var V=gR(1,10)*100,d=gP([0.01,0.02,0.04,0.05]);return T('A p.d. of '+V+' V is applied across plates '+gF(d)+' m apart. Find the field strength.',V/d,' V/m',gW(V/d,[V*d,V]),'E = V/d = '+gF(V/d)+' V/m.');}
  if(k===1){var C=gP([10,20,50,100,200]),V2=gR(2,12);return T('A '+C+' μF capacitor is charged to '+V2+' V. Find the energy stored in mJ.',0.5*C*V2*V2/1000,' mJ',gW(0.5*C*V2*V2/1000,[C*V2*V2/1000,C*V2/1000]),'W = ½CV² = ½ · '+C+' × 10⁻⁶ · '+(V2*V2)+' = '+gF(0.5*C*V2*V2/1000)+' mJ.');}
  var R=gP([1,2,5,10,20,50]),Cc=gP([10,20,50,100,200]);return T('Find the time constant for R = '+R+' kΩ and C = '+Cc+' μF.',R*Cc/1000,' s',gW(R*Cc/1000,[R*Cc,R/Cc]),'τ = RC = '+R+' × 10³ · '+Cc+' × 10⁻⁶ = '+gF(R*Cc/1000)+' s.');
}]);
add('alp-magnetic',[function(n){

add('alp-induction',[function(n){
  var k=n%2;
  if(k===0){var N=gP([50,100,200,500]),dP=gP([0.001,0.002,0.005,0.01]),t=gP([0.1,0.2,0.5]);return T('A coil of '+N+' turns has its flux changed by '+gF(dP)+' Wb in '+gF(t)+' s. Find the magnitude of the induced e.m.f.',N*dP/t,' V',gW(N*dP/t,[dP/t,N*dP]),'ε = NΔΦ/Δt = '+N+' · '+gF(dP)+'/'+gF(t)+' = '+gF(N*dP/t)+' V.');}
  var I0=gR(1,6),R=gR(2,20);return T('An alternating current of peak value '+I0+' A flows through a '+R+' Ω resistor. Find the mean power.',0.5*I0*I0*R,' W',gW(0.5*I0*I0*R,[I0*I0*R,I0*R]),'P = ½I₀²R = '+gF(0.5*I0*I0*R)+' W.');
}]);
add('alp-quantum',[function(n){
  var k=n%2;
  if(k===0){var E=gR(3,9),W=gR(2,E-1);return T('Photons of energy '+E+' eV fall on a metal with work function '+W+' eV. Find the maximum kinetic energy of the photoelectrons.',E-W,' eV',gW(E-W,[E+W,E]),'hf = Φ + KE_max ⇒ KE_max = '+E+' − '+W+' = '+(E-W)+' eV.');}
  var L=gP([[-3.4,-13.6,10.2],[-1.51,-3.4,1.89],[-0.85,-3.4,2.55],[-1.51,-13.6,12.09]]);return T('An electron moves from the level '+gF(L[0])+' eV to '+gF(L[1])+' eV. Find the energy of the emitted photon.',L[2],' eV',gW(L[2],[-L[0]-L[1]>0?-L[0]-L[1]:20,-L[0]]),'ΔE = '+gF(L[0])+' − ('+gF(L[1])+') = '+gF(L[2])+' eV.');

add('alp-nuclear',[function(n){

add('alp-astro',[function(n){

  return T('Two stars have the same radius. Star A is '+a+' times hotter than star B. Find L_A/L_B.',Math.pow(a,4),'',gW(Math.pow(a,4),[a*a,a]),'L ∝ T⁴: '+a+'⁴ = '+Math.pow(a,4)+'.');

add('alp-medical',[function(n){

}]);

progAdd('olymp:math',{
desc:'Олимпиадная математика: свои разделы — алгебра, теория чисел, комбинаторика и геометрия. В каждой теме главная идея, приёмы и трудные задачи с разбором.',
note:'Уровень — школьный и районный этап олимпиады, 7–11 класс. Дальше решайте задачи прошлых лет: в них те же идеи.',
sections:[
{title:'Алгебра',topics:[
{id:'olm-amgm',tag:'идея',title:'Неравенство о средних',
 sum:'Для неотрицательных a и b: (a + b)/2 ≥ √(ab), равенство только при a = b. Для n чисел среднее арифметическое не меньше среднего геометрического. Отсюда два главных применения: при постоянном произведении сумма наименьшая, когда числа равны; при постоянной сумме произведение наибольшее, когда числа равны. Полезные частные случаи: x + 1/x ≥ 2 при x > 0, a² + b² ≥ 2ab, (a + b)² ≥ 4ab. Сложив три неравенства a² + b² ≥ 2ab, получим a² + b² + c² ≥ ab + bc + ca.',
 ex:['При x > 0: x + 9/x ≥ 2√9 = 6, минимум 6 при x = 3','a + b = 10 ⇒ ab ≤ 25','(a + b)(1/a + 1/b) = 2 + a/b + b/a ≥ 4'],
 tip:'Всегда проверьте, достигается ли равенство. Если нет — найденное число лишь оценка, а не минимум.',
 qs:[['Наименьшее значение x + 16/x при x > 0:','8','16','4','x + 16/x ≥ 2√16 = 8, равенство при x = 4.'],
  ['a, b > 0 и a + b = 12. Наибольшее значение ab:','36','72','144','ab ≤ ((a + b)/2)² = 36.'],
  ['Наименьшее значение (a + b)(1/a + 1/b) при a, b > 0:','4','2','1','= 2 + a/b + b/a ≥ 2 + 2.'],
  ['tf','Для любых действительных a и b верно a² + b² ≥ 2ab.',true,'Это (a − b)² ≥ 0.'],
  ['tf','При x > 0 наименьшее значение x + 1/x равно 1.',false,'Оно равно 2, при x = 1.'],
  ['in','Периметр прямоугольника 40. Наибольшая площадь?',['100'],'a + b = 20, ab ≤ 100 — квадрат 10 × 10.']]},
{id:'olm-vieta',tag:'идея',title:'Теорема Виета в нестандартных задачах',
 sum:'Для ax² + bx + c = 0: x₁ + x₂ = −b/a, x₁x₂ = c/a. Любое симметричное выражение корней выражается через s = x₁ + x₂ и p = x₁x₂: x₁² + x₂² = s² − 2p, 1/x₁ + 1/x₂ = s/p, x₁³ + x₂³ = s³ − 3ps, (x₁ − x₂)² = s² − 4p. Для кубического ax³ + bx² + cx + d: сумма корней −b/a, сумма попарных произведений c/a, произведение −d/a. Целые корни многочлена с целыми коэффициентами — среди делителей свободного члена.',
 ex:['x² − 5x + 3 = 0: x₁² + x₂² = 25 − 6 = 19','Уравнение с корнями x₁² и x₂²: t² − 19t + 9 = 0','x³ − 6x² + 11x − 6 = 0: корни 1, 2, 3 (сумма 6, произведение 6)'],
 tip:'Сами корни искать не нужно — работайте с s и p.',
 qs:[['x₁, x₂ — корни x² − 7x + 2 = 0. x₁² + x₂² =','45','49','53','s² − 2p = 49 − 4.'],
  ['x₁, x₂ — корни x² + 3x − 5 = 0. 1/x₁ + 1/x₂ =','3/5','−3/5','5/3','s/p = (−3)/(−5).'],
  ['Сумма корней x³ − 4x² + x + 6 = 0:','4','−4','6','−b/a = 4.'],
  ['tf','Если c/a < 0, корни квадратного уравнения действительные и разных знаков.',true,'Произведение отрицательно, значит D > 0.'],
  ['tf','Раз у x² + x + 1 = 0 «сумма корней −1», у него есть действительные корни.',false,'D = −3 < 0: формулы Виета верны для комплексных корней, действительных нет.'],
  ['in','x₁, x₂ — корни x² − 4x + 1 = 0. Найдите x₁³ + x₂³.',['52'],'s³ − 3ps = 64 − 12 = 52.']]},
{id:'olm-telescoping',tag:'идея',title:'Суммы и телескопирование',
 sum:'Если каждое слагаемое — разность aₖ = f(k) − f(k + 1), почти всё сокращается: a₁ + … + aₙ = f(1) − f(n + 1). Классика: 1/(k(k + 1)) = 1/k − 1/(k + 1), 1/(k(k + 2)) = ½(1/k − 1/(k + 2)), 1/(√k + √(k + 1)) = √(k + 1) − √k. Готовые суммы: 1 + 2 + … + n = n(n + 1)/2; 1² + … + n² = n(n + 1)(2n + 1)/6; 1³ + … + n³ = (n(n + 1)/2)².',
 ex:['1/(1·2) + … + 1/(99·100) = 1 − 1/100 = 99/100','1/(1·3) + 1/(3·5) + … + 1/((2n − 1)(2n + 1)) = n/(2n + 1)','1³ + … + 10³ = 55² = 3025'],
 tip:'Увидели дробь с произведением в знаменателе — попробуйте разбить её на разность двух дробей.',
 qs:[['1/(1·2) + 1/(2·3) + … + 1/(9·10) =','9/10','1/10','10/9','1 − 1/10.'],
  ['1 + 2 + … + 100 =','5050','5000','10100','100 · 101/2.'],
  ['1³ + 2³ + … + 10³ =','3025','55','385','(10 · 11/2)² = 55².'],
  ['tf','1/(k(k + 2)) = ½(1/k − 1/(k + 2)).',true,'Приведите к общему знаменателю: 2/(2k(k + 2)).'],
  ['tf','1/(1·3) + 1/(3·5) + … + 1/(99·101) = 100/101.',false,'½(1 − 1/101) = 50/101.'],
  ['in','Найдите сумму 1/(√1 + √2) + 1/(√2 + √3) + … + 1/(√24 + √25).',['4'],'Каждое слагаемое = √(k + 1) − √k, сумма √25 − √1 = 4.']]},
{id:'olm-functional',tag:'идея',title:'Функциональные уравнения',
 sum:'Нужно найти все функции, для которых выполнено равенство. Приёмы: подставить x = 0, y = 0, y = x, y = −x и т. п.; подставить вместо аргумента другое выражение (x → 1 − x, x → 1/x) и решить получившуюся систему; доказать, что f(n) = cn на целых числах, через f(n + 1) = f(n) + c. В конце обязательно проверьте ответ подстановкой.',
 ex:['f(x) + 2f(1 − x) = x. Подставим 1 − x: f(1 − x) + 2f(x) = 1 − x. Из системы f(x) = (2 − 3x)/3','f(xy) = f(x) + f(y): x = y = 1 даёт f(1) = 0','f(n + 1) = f(n) + 2, f(0) = 3 ⇒ f(n) = 2n + 3'],
 tip:'Найденная формула — только кандидат. Без проверки подстановкой решение не засчитают.',
 qs:[['f(x + y) = f(x) + f(y) для всех x, y. f(0) =','0','1','любое число','x = y = 0: f(0) = 2f(0).'],
  ['f(x) + 2f(1 − x) = x для всех x. f(0) =','2/3','0','1/3','f(x) = (2 − 3x)/3.'],
  ['f(n + 1) = f(n) + 3, f(1) = 2. f(10) =','29','30','32','f(n) = 3n − 1.'],
  ['tf','Если f(xy) = f(x) + f(y) для всех x, y > 0, то f(1) = 0.',true,'x = y = 1.'],
  ['tf','f(x) = x + 1 удовлетворяет f(x + y) = f(x) + f(y).',false,'Слева x + y + 1, справа x + y + 2.'],
  ['in','f(x) − 2f(1/x) = x при x ≠ 0. Найдите f(1).',['−1','-1'],'x = 1: f(1) − 2f(1) = 1 ⇒ f(1) = −1.']]},
{id:'olm-floor',tag:'идея',title:'Целая и дробная часть числа',
 sum:'[x] — наибольшее целое число, не превосходящее x; {x} = x − [x], 0 ≤ {x} < 1. Поэтому [x] ≤ x < [x] + 1. Целое число выносится: [x + n] = [x] + n. Формула Лежандра: степень простого p в n! равна [n/p] + [n/p²] + [n/p³] + … Отсюда число нулей в конце n! — [n/5] + [n/25] + [n/125] + …',
 ex:['[−2,3] = −3, {−2,3} = 0,7','Нулей в конце 100!: 20 + 4 = 24','[x] = 3 ⇔ 3 ≤ x < 4'],
 tip:'Для отрицательных чисел [−x] ≠ −[x]: [−2,3] = −3, а не −2.',
 qs:[['[−3,7] =','−4','−3','3','Наибольшее целое, не превосходящее −3,7.'],
  ['Сколько нулей в конце числа 50!?','12','10','5','[50/5] + [50/25] = 10 + 2.'],
  ['{7,25} =','0,25','7','0,75','Дробная часть.'],
  ['tf','[x + 1] = [x] + 1 для любого x.',true,'Целый сдвиг выносится.'],
  ['tf','[2x] = 2[x] для любого x.',false,'x = 0,5: [1] = 1, но 2[0,5] = 0.'],
  ['in','Сколько нулей в конце 125!?',['31'],'25 + 5 + 1 = 31.']]}
]},
{title:'Теория чисел',topics:[
{id:'olm-mod',tag:'идея',title:'Остатки и сравнения по модулю',
 sum:'a ≡ b (mod m), если a − b делится на m. Сравнения можно складывать, вычитать, умножать и возводить в степень, поэтому остатки больших степеней ищут через маленькие. Удобно брать отрицательные остатки: 2 ≡ −1 (mod 3), 10 ≡ −1 (mod 11). Квадраты: по mod 3 — только 0 и 1, по mod 4 — 0 и 1, по mod 8 — 0, 1 и 4. Малая теорема Ферма: если p простое и a не делится на p, то aᵖ⁻¹ ≡ 1 (mod p).',
 ex:['2¹⁰⁰ mod 3: 2 ≡ −1 ⇒ (−1)¹⁰⁰ = 1','n² + 1 никогда не делится на 3: n² ≡ 0 или 1','7¹⁰⁰ mod 5: 7 ≡ 2, 2⁴ ≡ 1 ⇒ 2¹⁰⁰ ≡ 1'],
 tip:'Если хотите доказать, что уравнение не имеет решений в целых числах, посмотрите на обе части по подходящему модулю.',
 qs:[['Остаток 2¹⁰⁰ при делении на 3:','1','2','0','2 ≡ −1, (−1)¹⁰⁰ = 1.'],
  ['Остаток 3²⁰²⁶ при делении на 8:','1','3','5','3² = 9 ≡ 1 (mod 8).'],
  ['Какие остатки даёт квадрат целого числа при делении на 4?','0 или 1','0, 1, 2 или 3','только 0','(2k)² ≡ 0, (2k + 1)² ≡ 1.'],
  ['tf','Если n не делится на 3, то n² + 2 делится на 3.',true,'n² ≡ 1, 1 + 2 ≡ 0.'],
  ['tf','Сумма двух квадратов может давать остаток 3 при делении на 4.',false,'Возможны только 0, 1, 2.'],
  ['in','Остаток 7¹⁰⁰ при делении на 5?',['1'],'7 ≡ 2, 2⁴ ≡ 1, 2¹⁰⁰ = (2⁴)²⁵ ≡ 1.']]},
{id:'olm-lastdigit',tag:'идея',title:'Последние цифры',
 sum:'Последняя цифра числа — это остаток при делении на 10, две последние — на 100. Последние цифры степеней повторяются: 2 → 2, 4, 8, 6; 3 → 3, 9, 7, 1; 7 → 7, 9, 3, 1; 8 → 8, 4, 2, 6; 4 → 4, 6; 9 → 9, 1; у 0, 1, 5, 6 цифра не меняется. Поэтому показатель достаточно взять по модулю 4 (остаток 0 означает четвёртый элемент цикла). Факториалы начиная с 5! оканчиваются нулём.',
 ex:['7²⁰²⁶: 2026 ≡ 2 (mod 4) ⇒ 9','2¹⁰⁰: 100 ≡ 0 (mod 4) ⇒ 6','7⁴ = 2401 ⇒ 7⁴ᵏ оканчивается на 01'],
 tip:'Если показатель делится на 4, берите четвёртую цифру цикла, а не «нулевую».',
 qs:[['Последняя цифра 3²⁰²⁵:','3','9','7','2025 ≡ 1 (mod 4).'],
  ['Последняя цифра 2²⁰²⁶:','4','6','2','2026 ≡ 2 (mod 4).'],
  ['Последняя цифра суммы 1! + 2! + … + 100!:','3','0','1','1 + 2 + 6 + 24 = 33, остальные оканчиваются на 0.'],
  ['tf','Любая натуральная степень числа, оканчивающегося на 6, оканчивается на 6.',true,'6 · 6 = 36.'],
  ['tf','Последняя цифра 9¹⁰¹ равна 1.',false,'Нечётная степень 9 оканчивается на 9.'],
  ['in','Две последние цифры числа 7¹⁰⁰ (запишите двумя цифрами)?',['01'],'7⁴ = 2401, значит (7⁴)²⁵ оканчивается на 01.']]},
{id:'olm-primes',tag:'идея',title:'Простые числа и делители',
 sum:'Каждое натуральное число единственным образом раскладывается на простые множители. Если n = p₁^a₁ · p₂^a₂ · … · pₖ^aₖ, то число делителей n равно (a₁ + 1)(a₂ + 1)…(aₖ + 1). НОД(a, b) · НОК(a, b) = ab. Все простые числа больше 3 имеют вид 6k ± 1. У точного квадрата нечётное число делителей (делители разбиваются на пары d и n/d, кроме √n). aⁿ + bⁿ при нечётном n делится на a + b.',
 ex:['360 = 2³ · 3² · 5: делителей 4 · 3 · 2 = 24','p² − 1 делится на 24 для простого p > 3','НОД(84, 126) = 42, НОК = 252'],
 tip:'Чтобы доказать, что число составное, ищите разложение на множители: формулы a² − b², aⁿ + bⁿ.',
 qs:[['Число делителей 72:','12','8','6','72 = 2³ · 3²: 4 · 3 = 12.'],

{id:'olm-counting',tag:'идея',title:'Подсчёт: включения-исключения и биекции',

/* Генераторы олимпиадной математики */
function mpow(a,e,m){var r=1;a%=m;while(e>0){if(e&1)r=r*a%m;a=a*a%m;e>>=1;}return r;}
add('olm-amgm',[function(n){
  var k=n%2;
  if(k===0){var c=gR(2,12);return T('Найдите наименьшее значение x + '+(c*c)+'/x при x > 0.',2*c,'',gW(2*c,[c*c,c]),'По неравенству о средних x + '+(c*c)+'/x ≥ 2√'+(c*c)+' = '+(2*c)+', равенство при x = '+c+'.');}
  var s=2*gR(3,15);return T('a, b > 0 и a + b = '+s+'. Найдите наибольшее значение ab.',s*s/4,'',gW(s*s/4,[s*s/2,s]),'ab ≤ ((a + b)/2)² = '+(s/2)+'² = '+(s*s/4)+', равенство при a = b = '+(s/2)+'.');
}]);
add('olm-vieta',[function(n){
  var s=gR(-9,9)||5,p=gR(-9,9)||2,k=n%2;
  if(k===0)return T('x₁, x₂ — корни уравнения x²'+sgn(-s)+'x'+sgn(p)+' = 0. Найдите x₁² + x₂².',s*s-2*p,'',gW(s*s-2*p,[s*s+2*p,s*s-p],true),'x₁ + x₂ = '+s+', x₁x₂ = '+p+'; x₁² + x₂² = '+(s*s)+' − 2·('+p+') = '+(s*s-2*p)+'.');
  return T('x₁, x₂ — корни уравнения x²'+sgn(-s)+'x'+sgn(p)+' = 0. Найдите x₁³ + x₂³.',s*s*s-3*p*s,'',gW(s*s*s-3*p*s,[s*s*s+3*p*s,s*s*s-p*s],true),'x₁³ + x₂³ = s³ − 3ps = '+(s*s*s)+' − 3·('+p+')·('+s+') = '+(s*s*s-3*p*s)+'.');
}]);
add('olm-telescoping',[function(n){
  var k=n%3,N=gR(5,99);
  if(k===0)return T('Найдите 1/(1·2) + 1/(2·3) + … + 1/('+N+'·'+(N+1)+').',N+'/'+(N+1),'',[1+'/'+(N+1),(N+1)+'/'+N],'1/(k(k + 1)) = 1/k − 1/(k + 1), сумма = 1 − 1/'+(N+1)+' = '+N+'/'+(N+1)+'.',true);
  if(k===1){var M=gR(10,60);return T('Найдите 1 + 2 + … + '+M+'.',M*(M+1)/2,'',gW(M*(M+1)/2,[M*M,M*(M-1)/2]),'n(n + 1)/2 = '+M+' · '+(M+1)+'/2 = '+(M*(M+1)/2)+'.');}
  var q=gR(3,12),S=Math.pow(q*(q+1)/2,2);return T('Найдите 1³ + 2³ + … + '+q+'³.',S,'',gW(S,[q*(q+1)/2,q*(q+1)*(2*q+1)/6]),'(n(n + 1)/2)² = '+(q*(q+1)/2)+'² = '+S+'.');
}]);
add('olm-functional',[function(n){
  var d=gR(2,9),a=gR(-5,9),N=gR(5,30);
  return T('f(n + 1) = f(n) + '+d+' для всех n, f(1) = '+a+'. Найдите f('+N+').',a+(N-1)*d,'',gW(a+(N-1)*d,[a+N*d,N*d],true),'f(n) = '+a+' + (n − 1)·'+d+', f('+N+') = '+(a+(N-1)*d)+'.');
}]);
add('olm-floor',[function(n){
  var N=gR(20,400),z=0,p=5;while(p<=N){z+=Math.floor(N/p);p*=5;}
  return T('Сколько нулей в конце числа '+N+'!?',z,'',gW(z,[Math.floor(N/5),Math.floor(N/10)]),'['+N+'/5] + ['+N+'/25] + ['+N+'/125] + … = '+z+'.');
}]);
add('olm-mod',[function(n){
  var m=gP([3,4,5,7,8,9,11]),a=gR(2,12),e=gR(20,2026);if(a%m===0)a++;
  var r=mpow(a,e,m);
  var w1=(r+1)%m,w2=(a%m)!==r&&(a%m)!==w1?a%m:(r+2)%m;
  return T('Найдите остаток от деления '+a+sup(e)+' на '+m+'.',r,'',[w1,w2],'Остатки степеней '+a+' по модулю '+m+' повторяются циклом; '+a+sup(e)+' ≡ '+r+' (mod '+m+').');
}]);
add('olm-lastdigit',[function(n){
  var a=gR(2,99),e=gR(10,2026),r=mpow(a,e,10);
  return T('Найдите последнюю цифру числа '+a+sup(e)+'.',r,'',[(r+2)%10,(r+5)%10],'Последняя цифра '+a+' — '+(a%10)+', её степени повторяются с периодом не больше 4; показатель '+e+' ≡ '+(e%4)+' (mod 4) ⇒ '+r+'.');
}]);
add('olm-primes',[function(n){
  var a=gR(1,5),b=gR(0,3),c=gR(0,2),N=Math.pow(2,a)*Math.pow(3,b)*Math.pow(5,c),d=(a+1)*(b+1)*(c+1);
  return T('Сколько натуральных делителей у числа '+N+'?',d,'',gW(d,[a+b+c,a*Math.max(b,1)*Math.max(c,1)+1]),N+' = 2'+sup(a)+(b?' · 3'+(b>1?sup(b):''):'')+(c?' · 5'+(c>1?sup(c):''):'')+'; делителей ('+(a+1)+')('+(b+1)+')('+(c+1)+') = '+d+'.');
}]);
add('olm-diophantine',[function(n){
  var N=gP([15,21,33,35,45,63,77,91,105]),cnt=0,list=[];
  for(var d=1;d*d<N;d++)if(N%d===0&&(d+N/d)%2===0){cnt++;list.push('('+((d+N/d)/2)+', '+((N/d-d)/2)+')');}
  return T('Сколько пар натуральных чисел (x, y) удовлетворяют x² − y² = '+N+'?',cnt,'',gW(cnt,[cnt+1,cnt*2]),'(x − y)(x + y) = '+N+', множители одной чётности: '+list.join(', ')+'.');
}]);
add('olm-pigeonhole',[function(n){
  var k=n%2;
  if(k===0){var c=gR(3,9);return T('В ящике носки '+c+' цветов. Сколько носков нужно вынуть вслепую, чтобы наверняка нашлась пара одного цвета?',c+1,'',gW(c+1,[c,2*c]),c+' цветов — '+c+' клеток; '+(c+1)+' носков — двое в одной.');}
  var N=gR(30,200),m=gP([7,12]),g=Math.ceil(N/m);return T('Среди '+N+' человек какое наибольшее число родившихся в '+(m===7?'один день недели':'один месяц')+' гарантировано?',g,'',gW(g,[Math.floor(N/m),g+1]),'Обобщённый принцип Дирихле: ⌈'+N+'/'+m+'⌉ = '+g+'.');
}]);
add('olm-invariants',[function(n){
  var N=gR(10,300),S=N*(N+1)/2;
  return T('На доске числа 1, 2, …, '+N+'. Можно стереть любые два и записать их сумму. Какое число останется в конце?',S,'',gW(S,[N*N,S-N]),'Сумма не меняется: '+N+' · '+(N+1)+'/2 = '+S+'.');
}]);
add('olm-counting',[function(n){
  var k=n%2;
  if(k===0){var a=gR(2,6),b=gR(2,6);return T('Сколько кратчайших путей по клеткам ведут из (0, 0) в ('+a+', '+b+') шагами вправо и вверх?',cC(a+b,a),'',gW(cC(a+b,a),[a*b,(a+b)*2]),'Из '+(a+b)+' шагов выбираем '+a+' шагов вправо: C('+(a+b)+', '+a+') = '+cC(a+b,a)+'.');}
  var N=gR(3,12),v=gR(2,4);return T('Сколько решений в неотрицательных целых числах у уравнения '+['x + y','x + y + z','x + y + z + t'][v-2]+' = '+N+'?',cC(N+v-1,v-1),'',gW(cC(N+v-1,v-1),[cC(N,v-1),N+1]),'Шары и перегородки: C('+(N+v-1)+', '+(v-1)+') = '+cC(N+v-1,v-1)+'.');
}]);
add('olm-graphs',[function(n){
  var N=gR(5,30),k=n%2;
  if(k===0)return T('В турнире в один круг участвуют '+N+' команд. Сколько всего матчей?',N*(N-1)/2,'',gW(N*(N-1)/2,[N*(N-1),N*N/2]),'n(n − 1)/2 = '+(N*(N-1)/2)+'.');
  return T('В турнире каждый сыграл с каждым один раз, всего '+(N*(N-1)/2)+' партий. Сколько было участников?',N,'',gW(N,[N+1,N-1]),'n(n − 1)/2 = '+(N*(N-1)/2)+' ⇒ n = '+N+'.');
}]);
add('olm-angles',[function(n){
  var N=gP([5,6,8,9,10,12,15,18,20,24,30,36]),k=n%2;
  if(k===0)return T('Внутренний угол правильного многоугольника равен '+gF(180-360/N)+'°. Сколько у него сторон?',N,'',gW(N,[N+2,N-2]),'Внешний угол '+gF(360/N)+'°, n = 360/'+gF(360/N)+' = '+N+'.');
  return T('Найдите сумму углов выпуклого '+N+'-угольника.',180*(N-2),'°',gW(180*(N-2),[180*N,180*(N-1)]),'180°('+N+' − 2) = '+(180*(N-2))+'°.');
}]);
add('olm-areas',[function(n){
  var S=gR(2,20)*36,p=gR(1,4),q=gR(1,4);if(p===q)q++;
  return T('Треугольник площади '+S+'. Точка делит сторону в отношении '+p+' : '+q+' и соединена с противоположной вершиной. Найдите площадь части, прилежащей к отрезку длины «'+p+'».',S*p/(p+q),'',gW(S*p/(p+q),[S*q/(p+q),S/2]),'Общая высота: площади относятся как '+p+' : '+q+', '+S+' · '+p+'/'+(p+q)+' = '+gF(S*p/(p+q))+'.');
}]);
add('olm-triangle-ineq',[function(n){

  return T('Две стороны треугольника '+a+' и '+b+'. Сколько целых значений может принимать третья сторона?',2*a-1,'',gW(2*a-1,[2*a,2*a+1]),(b-a)+' < x < '+(a+b)+': целые от '+(b-a+1)+' до '+(a+b-1)+' — '+(2*a-1)+' значений.');
}]);
/* ---------- Олимпиадная физика ---------- */
progAdd('olymp:phys',{
desc:'Олимпиадная физика: механика, тепло, электричество, оптика и методы решения. В каждой теме главная идея, типичные ловушки и трудные задачи с разбором.',
note:'Уровень — школьный и районный этап олимпиады, 7–11 класс. g = 10 м/с², если не сказано иначе.',
sections:[
{title:'Механика',topics:[
{id:'olp-relative',tag:'идея',title:'Относительное движение и средняя скорость',
 sum:'Скорость тела относительно земли равна его скорости относительно движущейся системы плюс скорость самой системы (векторно). Навстречу друг другу скорости сближения складываются, вдогонку — вычитаются. Лодка: по течению v + u, против течения v − u; чтобы пересечь реку по кратчайшему пути, нос направляют наискосок против течения, и скорость поперёк реки равна √(v² − u²). Средняя скорость — весь путь, делённый на всё время, а не среднее арифметическое. Для двух равных половин пути v_ср = 2v₁v₂/(v₁ + v₂).',
 ex:['Половина пути 60 км/ч, половина 40 км/ч: v_ср = 2·60·40/100 = 48 км/ч','Лодка 5 м/с, течение 3 м/с, ширина 100 м: поперёк 4 м/с, t = 25 с','По неподвижному эскалатору 60 с, стоя на движущемся 40 с ⇒ идя по движущемуся 24 с'],
 tip:'Перейдите в систему отсчёта, где одно из тел покоится, — задача часто становится тривиальной.',
 qs:[['Половину пути машина ехала со скоростью 30 км/ч, половину — 60 км/ч. Средняя скорость:','40 км/ч','45 км/ч','50 км/ч','2·30·60/90 = 40.'],
  ['Лодка проходит 12 км по течению за 1 ч, а обратно — за 2 ч. Скорость течения:','3 км/ч','6 км/ч','4,5 км/ч','v + u = 12, v − u = 6 ⇒ u = 3.'],
  ['По неподвижному эскалатору человек поднимается за 60 с, стоя на движущемся — за 30 с. Сколько займёт подъём, если идти по движущемуся?','20 с','45 с','90 с','Скорости складываются: 1/60 + 1/30 = 1/20.'],
  ['tf','Средняя скорость всегда равна среднему арифметическому скоростей на участках.',false,'Только если на участках затрачено одинаковое время.'],
  ['tf','Если время движения на двух участках одинаково, средняя скорость равна среднему арифметическому.',true,'(v₁t + v₂t)/(2t).'],
  ['in','Лодка плывёт со скоростью 5 м/с относительно воды, течение 3 м/с, ширина реки 120 м. За сколько секунд она переплывёт реку по кратчайшему пути?',['30'],'Поперёк √(25 − 9) = 4 м/с, 120/4 = 30 с.']]},
{id:'olp-statics',tag:'идея',title:'Статика: моменты и центр масс',
 sum:'Тело в равновесии, если сумма сил равна нулю и сумма моментов относительно любой точки равна нулю. Моменты удобно брать относительно точки, через которую проходят неизвестные силы, — они выпадают из уравнения. Центр масс системы x_c = Σmᵢxᵢ/Σmᵢ. Тело не опрокидывается, пока вертикаль через центр масс проходит через площадь опоры. Подвижный блок даёт выигрыш в силе в 2 раза и проигрыш в пути во столько же раз («золотое правило механики»).',
 ex:['Доска 4 м, 20 кг на опорах по концам, груз 40 кг в 1 м от левого края: правая опора 200 Н','Шары 1 кг и 3 кг на расстоянии 4 м: центр масс в 3 м от лёгкого','Полиспаст из n ветвей верёвки: выигрыш в силе в n раз'],
 tip:'Вес однородного стержня приложите в его середине — и пишите моменты.',
 qs:[['Однородный стержень массой 6 кг лежит на двух опорах по концам. Сила давления на каждую опору (g = 10):','30 Н','60 Н','15 Н','По симметрии — половина веса.'],
  ['Грузы 2 кг и 6 кг на концах лёгкого стержня длиной 2 м. Центр масс от лёгкого груза:','1,5 м','0,5 м','1 м','6·2/8 = 1,5 м.'],
  ['Подвижный блок даёт выигрыш в силе…','в 2 раза','в 4 раза','не даёт','Груз держат две ветви верёвки.'],
  ['tf','В равновесии моменты можно считать относительно любой точки.',true,'Если сумма сил равна нулю, результат от выбора точки не зависит.'],
  ['tf','Тело опрокидывается, как только центр масс оказывается выше половины его высоты.',false,'Важно, проходит ли вертикаль через центр масс через площадь опоры.'],
  ['in','Однородная доска длиной 4 м и массой 20 кг лежит на опорах по концам; груз 40 кг стоит в 1 м от левого конца. С какой силой (Н) доска давит на правую опору? g = 10.',['200'],'Моменты относительно левой опоры: (200·2 + 400·1)/4 = 200 Н.']]},
{id:'olp-hydro',tag:'идея',title:'Гидростатика и плавание',
 sum:'Давление на глубине p = p₀ + ρgh, в жидкости оно передаётся во все стороны одинаково (закон Паскаля). В сообщающихся сосудах с разными жидкостями ρ₁h₁ = ρ₂h₂. Сила Архимеда F = ρ_жидкости · g · V_погружённой части. Плавающее тело погружено на долю ρ_тела/ρ_жидкости своего объёма. Плавающий лёд, растаяв, не меняет уровень воды. Гидравлический пресс: F₁/S₁ = F₂/S₂.',
 ex:['Дерево ρ = 600 кг/м³ в воде: погружено 60% объёма','Лодка с камнем: камень выбросили в воду — уровень в бассейне понижается','1 см ртути уравновешивает 13,6 см воды'],
 tip:'Плавающее тело вытесняет воду массой, равной своей массе; утонувшее — только своим объёмом.',
 qs:[['Тело плотностью 800 кг/м³ плавает в воде. Какая доля объёма над водой?','20%','80%','8%','Погружено 800/1000 = 80%.'],
  ['Кусок льда плавает в стакане с водой. Когда лёд растает, уровень воды…','не изменится','поднимется','опустится','Масса талой воды равна массе вытесненной.'],
  ['В лодке, плавающей в бассейне, лежит камень. Его бросили в воду. Уровень воды в бассейне…','понизится','повысится','не изменится','В лодке камень вытеснял воду по массе, на дне — только по объёму.'],
  ['tf','Сила Архимеда зависит от плотности самого тела.',false,'От плотности жидкости и объёма погружённой части.'],
  ['tf','На глубине 10 м давление воды примерно на 1 атмосферу больше, чем у поверхности.',true,'ρgh = 1000·10·10 = 10⁵ Па.'],
  ['in','Площади поршней гидравлического пресса 10 см² и 500 см². На малый поршень давят с силой 200 Н. С какой силой (Н) давит большой?',['10000'],'200 · 50 = 10 000 Н.']]},
{id:'olp-conservation',tag:'идея',title:'Законы сохранения: энергия и импульс',
 sum:'Импульс системы сохраняется, если внешние силы скомпенсированы или удар очень короткий. Механическая энергия сохраняется, если нет трения и неупругих ударов. При абсолютно неупругом ударе тела слипаются, импульс сохраняется, а часть кинетической энергии переходит в тепло. При упругом лобовом ударе одинаковых шаров они обмениваются скоростями. Баллистический маятник решают в два шага: удар — по импульсу, подъём — по энергии.',
 ex:['Пуля 10 г, 500 м/с застревает в бруске 2 кг: v = 5/2,01 ≈ 2,49 м/с','Упругий лобовой удар одинаковых шаров: первый останавливается','С гладкой горки высотой h: v = √(2gh) при любой форме горки'],
 tip:'Во время удара энергию не сохраняйте — только импульс. Энергию используйте до и после.',
 qs:[['Пластилиновый шар массой m налетает со скоростью v на такой же неподвижный и прилипает. Какая доля кинетической энергии перешла в тепло?','половина','четверть','вся','До: mv²/2; после: 2m(v/2)²/2 = mv²/4.'],
  ['Упругий лобовой удар двух одинаковых шаров, второй покоился. После удара первый…','останавливается','отскакивает назад','движется со скоростью v/2','Шары обмениваются скоростями.'],
  ['Тело соскальзывает с гладкой горки высотой 5 м (g = 10). Скорость внизу:','10 м/с','50 м/с','5 м/с','v = √(2gh) = √100.'],
  ['tf','При неупругом ударе импульс системы не сохраняется.',false,'Импульс сохраняется; теряется кинетическая энергия.'],
  ['tf','Скорость внизу гладкой горки не зависит от её формы.',true,'Работу совершает только сила тяжести.'],
  ['in','Пуля массой 10 г летит со скоростью 600 м/с и застревает в бруске массой 2,99 кг на гладком столе. Скорость бруска (м/с)?',['2'],'0,01·600/3 = 2 м/с.']]},
{id:'olp-circular',tag:'идея',title:'Движение по окружности и тяготение',
 sum:'При движении по окружности ускорение v²/R направлено к центру; его создаёт равнодействующая реальных сил (натяжение, трение, тяжесть, реакция опоры). Мёртвая петля: в верхней точке минимальная скорость √(gR), поэтому с гладкой горки нужно стартовать с высоты не меньше 2,5R. Поворот без заноса: v ≤ √(μgR). Спутник у поверхности Земли: v₁ = √(gR) ≈ 7,9 км/с; для орбит T² ∝ R³ (третий закон Кеплера).',
 ex:['Петля R = 4 м: v_min вверху √40 ≈ 6,3 м/с','Поворот R = 50 м, μ = 0,5: v ≤ √250 ≈ 15,8 м/с','Радиус орбиты ×4 ⇒ период ×8'],

  ['Радиус орбиты спутника увеличили в 4 раза. Период обращения…','увеличится в 8 раз','увеличится в 4 раза','увеличится в 16 раз','T² ∝ R³ ⇒ T ∝ R^1,5.'],
  ['tf','Чем выше круговая орбита спутника, тем меньше его скорость.',true,'v = √(GM/R).'],
  ['tf','В верхней точке мёртвой петли на тело действует отдельная центробежная сила.',false,'В инерциальной системе её нет: ускорение создают тяжесть и реакция опоры.'],
  ['in','Шарик на нити длиной 0,9 м вращают в вертикальной плоскости. Наименьшая скорость (м/с) в верхней точке, при которой нить не провисает? g = 10.',['3'],'mg = mv²/L ⇒ v = √(gL) = 3 м/с.']]}
]},
{title:'Тепло',topics:[
{id:'olp-heat',tag:'идея',title:'Тепловой баланс и фазовые переходы',
 sum:'Отданное тепло равно полученному. Нагрев Q = cmΔt, плавление Q = λm, парообразование Q = Lm. Главная ловушка: сначала проверьте, хватит ли тепла на полное плавление льда или нагрев до 0 °C. Часто в итоге остаётся смесь льда и воды при 0 °C. Константы: c воды 4200, c льда 2100 Дж/(кг·°C), λ льда 3,3·10⁵ Дж/кг, L воды 2,3·10⁶ Дж/кг.',
 ex:['1 кг воды при 80 °C + 3 кг при 20 °C: t = (80 + 60)/4 = 35 °C','1 кг льда при 0 °C в 1 кг воды при 50 °C: вода отдаст 210 кДж < 330 кДж — растает ≈ 0,64 кг, итог 0 °C','Пар при 100 °C обжигает сильнее воды при 100 °C: он ещё отдаёт L при конденсации'],
 tip:'Не пишите сразу уравнение с неизвестной t — сначала сравните запасы тепла.',
 qs:[['Смешали 2 кг воды при 10 °C и 1 кг воды при 70 °C. Температура смеси:','30 °C','40 °C','35 °C','(2·10 + 70)/3 = 30.'],
  ['В 1 кг воды при 50 °C бросили 1 кг льда при 0 °C. Конечная температура:','0 °C','25 °C','10 °C','Вода отдаст 210 кДж, а на плавление всего льда нужно 330 кДж.'],

/* Генераторы олимпиадной физики */
add('olp-relative',[function(n){
  var k=n%2;
  if(k===0){var P=gP([[30,60,40],[40,60,48],[20,30,24],[60,90,72],[45,90,60],[40,120,60],[30,70,42],[50,75,60]]);return T('Половину пути машина ехала со скоростью '+P[0]+' км/ч, вторую половину — '+P[1]+' км/ч. Средняя скорость?',P[2],' км/ч',gW(P[2],[(P[0]+P[1])/2,P[1]-P[0]]),'v_ср = 2v₁v₂/(v₁ + v₂) = 2·'+P[0]+'·'+P[1]+'/'+(P[0]+P[1])+' = '+P[2]+' км/ч.');}
  var t=gP([[5,3,4],[10,6,8],[13,5,12],[5,4,3],[15,9,12],[17,8,15]]),W=t[2]*gR(5,30);return T('Лодка плывёт со скоростью '+t[0]+' м/с относительно воды, скорость течения '+t[1]+' м/с, ширина реки '+W+' м. За сколько секунд лодка переплывёт реку по кратчайшему пути?',W/t[2],' с',gW(W/t[2],[W/t[0],W/(t[0]-t[1])]),'Скорость поперёк реки √('+t[0]+'² − '+t[1]+'²) = '+t[2]+' м/с; t = '+W+'/'+t[2]+' = '+gF(W/t[2])+' с.');
}]);
add('olp-statics',[function(n){
  var m1=gR(1,6),m2=gR(1,9),L=gR(1,6);
  return T('Грузы '+m1+' кг и '+m2+' кг закреплены на концах лёгкого стержня длиной '+L+' м. На каком расстоянии от первого груза центр масс?',m2*L/(m1+m2),' м',gW(m2*L/(m1+m2),[m1*L/(m1+m2),L/2]),'x = m₂L/(m₁ + m₂) = '+m2+'·'+L+'/'+(m1+m2)+' = '+gF(m2*L/(m1+m2))+' м.');
}]);
add('olp-hydro',[function(n){
  var rho=gP([200,250,400,500,600,700,750,800,900]),k=n%2;
  if(k===0)return T('Тело плотностью '+rho+' кг/м³ плавает в воде. Какая доля объёма (в %) находится над водой?',100-rho/10,'%',gW(100-rho/10,[rho/10,100-rho/100]),'Погружено '+rho+'/1000 = '+(rho/10)+'% объёма, над водой '+(100-rho/10)+'%.');
  var S1=gP([2,5,10,20]),S2=S1*gP([10,20,50,100]),F=gR(1,10)*50;return T('Площади поршней гидравлического пресса '+S1+' см² и '+S2+' см². На малый поршень давят с силой '+F+' Н. С какой силой давит большой поршень?',F*S2/S1,' Н',gW(F*S2/S1,[F*S1/S2,F+S2]),'F₂ = F₁ · S₂/S₁ = '+F+' · '+(S2/S1)+' = '+gF(F*S2/S1)+' Н.');
}]);
add('olp-conservation',[function(n){
  var k=n%2;
  if(k===0){var m=gP([0.005,0.01,0.02]),v=gP([300,400,500,600,800]),M=gP([0.99,1.99,2.99,4.99,0.995,1.995]),u=m*v/(m+M);return T('Пуля массой '+gF(m*1000)+' г летит со скоростью '+v+' м/с и застревает в бруске массой '+gF(M)+' кг на гладком столе. Скорость бруска с пулей?',u,' м/с',gW(u,[m*v/M*2,m*v]),'Импульс: '+gF(m)+'·'+v+' = ('+gF(m)+' + '+gF(M)+')·u ⇒ u = '+gF(u)+' м/с.');}
  var h=gP([0.2,0.45,0.8,1.25,1.8,3.2,5,7.2,20]),vv=Math.sqrt(20*h);return T('Тело соскальзывает без трения с горки высотой '+gF(h)+' м. Какова его скорость внизу? g = 10.',vv,' м/с',gW(vv,[20*h,10*h]),'mgh = mv²/2 ⇒ v = √(2gh) = √'+gF(20*h)+' = '+gF(vv)+' м/с.');
}]);
add('olp-circular',[function(n){
  var k=n%2;
  if(k===0){var P=gP([[0.4,40],[0.5,50],[0.4,90],[0.5,20],[0.8,20],[0.2,20],[0.9,10],[0.6,60]]),v=Math.sqrt(P[0]*10*P[1]);return T('Машина проходит поворот радиусом '+P[1]+' м, коэффициент трения '+gF(P[0])+'. Наибольшая скорость без заноса? g = 10.',v,' м/с',gW(v,[P[0]*10*P[1],v*2]),'μmg = mv²/R ⇒ v = √(μgR) = √'+gF(P[0]*10*P[1])+' = '+gF(v)+' м/с.');}
  var R=gR(2,20);return T('С какой наименьшей высоты должно скатиться тело по гладкой горке, чтобы пройти мёртвую петлю радиусом '+R+' м?',2.5*R,' м',gW(2.5*R,[2*R,3*R]),'Вверху v² ≥ gR; mgh = mg·2R + mgR/2 ⇒ h = 2,5R = '+gF(2.5*R)+' м.');
}]);
add('olp-heat',[function(n){
  var m1=gR(1,5),t1=gR(1,8)*10,m2=gR(1,5),t2=gR(1,10)*10,t=(m1*t1+m2*t2)/(m1+m2);
  return T('Смешали '+m1+' кг воды при '+t1+' °C и '+m2+' кг воды при '+t2+' °C. Температура смеси (потерями пренебречь)?',t,' °C',gW(t,[(t1+t2)/2,Math.abs(t1-t2)]),'t = ('+m1+'·'+t1+' + '+m2+'·'+t2+')/('+m1+' + '+m2+') = '+gF(t)+' °C.');
}]);
add('olp-gas',[function(n){
  var p=gP([100,150,200,300]),T1=gP([200,250,300,400]),f=gP([1.5,2,2.5,3]),k=n%2;
  if(k===0)return T('Газ при '+p+' кПа и '+T1+' K нагрели при постоянном объёме до '+gF(T1*f)+' K. Каким стало давление?',p*f,' кПа',gW(p*f,[p/f,p+T1*(f-1)]),'p/T = const: '+p+' · '+gF(f)+' = '+gF(p*f)+' кПа.');
  var V=gP([2,3,6,12]),r=gP([2,3,4]);return T('Газ изотермически сжали от '+(V*r)+' л до '+V+' л. Во сколько раз выросло давление?',r,'',gW(r,[r*r,1/r]),'pV = const ⇒ давление выросло в '+(V*r)+'/'+V+' = '+r+' раза.');
}]);
add('olp-circuits',[function(n){
  var R=gP([3,6,9,12,15,30]),k=n%2;
  if(k===0)return T('Три резистора по '+R+' Ом соединены треугольником. Найдите сопротивление между двумя вершинами.',2*R/3,' Ом',gW(2*R/3,[3*R,R/3]),R+' Ом параллельно '+(2*R)+' Ом: '+R+'·'+(2*R)+'/'+(3*R)+' = '+gF(2*R/3)+' Ом.');
  var R6=gP([6,12,18,24,30,36]);return T('Каркас куба собран из 12 резисторов по '+R6+' Ом. Найдите сопротивление между противоположными вершинами.',5*R6/6,' Ом',gW(5*R6/6,[R6,3*R6/4]),'По симметрии R/3 + R/6 + R/3 = 5R/6 = '+gF(5*R6/6)+' Ом.');
}]);
add('olp-power',[function(n){

/* Текст для чтения вслух: без кавычек и значков, формулы словами */
function speechClean(t,lang){
  t=String(t||'');
  if(lang==='en')return t.replace(/\s+/g,' ').trim();
  var kk=lang==='kk'||(!lang&&KKL());
  var W=kk?{mul:' көбейту ',div:' бөлу ',sq:' квадрат',cu:' куб',root:' түбір ',approx:' шамамен ',minus:' минус ',pm:' плюс минус ',deg:' градус',pc:' пайыз',eq:' тең '}
          :{mul:' умножить на ',div:' делить на ',sq:' в квадрате',cu:' в кубе',root:' корень из ',approx:' примерно ',minus:' минус ',pm:' плюс-минус ',deg:' градусов',pc:' процентов',eq:' равно '};
  var SUBD={'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9'};
  t=t.replace(/[₀-₉]/g,function(c){return SUBD[c];});
  t=t.replace(/(\S)\s*·\s*(\S)/g,'$1'+W.mul+'$2').replace(/(\d)\s*\/\s*(\d)/g,'$1'+W.div+'$2').replace(/ \/ /g,W.div);
  t=t.replace(/²/g,W.sq).replace(/³/g,W.cu).replace(/√/g,W.root).replace(/≈/g,W.approx).replace(/±/g,W.pm).replace(/(^|[\s(])[−-](?=\d)/g,'$1'+W.minus).replace(/ − /g,W.minus);
  t=t.replace(/(\d)\s*°\s*C/g,'$1'+(kk?' градус Цельсий':' градусов Цельсия')).replace(/(\d)\s*°/g,'$1'+W.deg).replace(/(\d)\s*%/g,'$1'+W.pc).replace(/ = /g,W.eq);
  t=t.replace(/[«»"“”„]/g,'').replace(/\s+—\s+/g,', ').replace(/→/g,', ').replace(/[★☆✓✕×•…]+/g,' ').replace(/\(\s*\)/g,'');
  return t.replace(/\s+/g,' ').replace(/\s+([,.!?;:])/g,'$1').trim();
}

function sayDeviceOne(text,lang,done){

function speakOne(text,lang,done){

    try{Promise.resolve(tts.speak(text,o)).then(function(){done();},function(e){

/* say(текст или список фраз): фразы читаются по очереди, с паузой между ними */
function autoVoice(){return !state.prefs.mute&&(useClaude()||state.prefs.devAuto);}
function say(text,force,lang){
  if(!force&&!autoVoice())return;
  var parts=(Array.isArray(text)?text:[text]).map(function(x){return speechClean(Core.str(String(x||''),1900),lang);}).filter(Boolean);
  if(!parts.length||!hasVoice())return;
  stopVoice();
  var tok=spk.tok;spk.on=true;spkInd();
  (function next(i){
    if(tok!==spk.tok)return;
    if(i>=parts.length){spk.on=false;spkInd();return;}
    speakOne(parts[i],lang,function(stopped){
      if(tok!==spk.tok)return;
      if(stopped){spk.on=false;spkInd();return;}
      setTimeout(function(){next(i+1);},i<parts.length-1?700:0);
    });
  })(0);
}
/* Длинный текст — по абзацам и предложениям, чтобы между ними были паузы */
function sentences(t){

/* ---------- Новые опыты на моделях ---------- */
function labTxt(c,s,x,y,col,al){c.fillStyle=col;c.font='12px sans-serif';c.textAlign=al||'left';c.fillText(s,x,y);c.textAlign='left';}
function hArrow(c,x,y,len,color,label){
  if(Math.abs(len)<2)return;
  c.strokeStyle=color;c.fillStyle=color;c.lineWidth=3;c.beginPath();c.moveTo(x,y);c.lineTo(x+len,y);c.stroke();
  var d=len>0?1:-1;c.beginPath();c.moveTo(x+len+d*7,y);c.lineTo(x+len-d*2,y-6);c.lineTo(x+len-d*2,y+6);c.closePath();c.fill();
  if(label)labTxt(c,label,x+len/2,y-9,color,'center');
}
function vArrow(c,x,y,dx,dy,color,label){
  var L=Math.sqrt(dx*dx+dy*dy);if(L<3)return;
  var ux=dx/L,uy=dy/L;c.strokeStyle=color;c.fillStyle=color;c.lineWidth=2.5;c.beginPath();c.moveTo(x,y);c.lineTo(x+dx,y+dy);c.stroke();
  c.beginPath();c.moveTo(x+dx+ux*6,y+dy+uy*6);c.lineTo(x+dx-ux*3-uy*5,y+dy-uy*3+ux*5);c.lineTo(x+dx-ux*3+uy*5,y+dy-uy*3-ux*5);c.closePath();c.fill();
  if(label)labTxt(c,label,x+dx+8,y+dy,color);
}
function miniGraph(c,x,y,w,h,pts,xmax,ymax,col,k,xl,yl){
  c.strokeStyle=k.line;c.lineWidth=1;c.strokeRect(x,y,w,h);
  c.strokeStyle=col;c.lineWidth=2;c.beginPath();
  pts.forEach(function(p,i){var px=x+p[0]/xmax*w,py=y+h-p[1]/ymax*h;if(i)c.lineTo(px,py);else c.moveTo(px,py);});c.stroke();
  if(xl)labTxt(c,xl,x+w,y+h+13,k.muted,'right');if(yl)labTxt(c,yl,x+3,y+11,k.muted);
}
function wlColor(nm){
  var r=0,g=0,b=0;
  if(nm>=380&&nm<440){r=(440-nm)/60;b=1;}else if(nm<490){g=(nm-440)/50;b=1;}else if(nm<510){g=1;b=(510-nm)/20;}else if(nm<580){r=(nm-510)/70;g=1;}else if(nm<645){r=1;g=(645-nm)/65;}else if(nm<=750){r=1;}
  return 'rgb('+Math.round(r*255)+','+Math.round(g*255)+','+Math.round(b*255)+')';
}
function hsh(i){var x=Math.sin(i*12.9898+78.233)*43758.5453;return x-Math.floor(x);}

  c.strokeStyle=k.ink;c.lineWidth=2;c.beginPath();c.moveTo(20,y+12);c.lineTo(w-20,y+12);c.stroke();

 }};
LABS['phys-momentum']={title:'столкновение тележек',hint:'Синяя тележка налетает на неподвижную оранжевую. При неупругом ударе они сцепляются, при упругом — отскакивают. Суммарный импульс m·v в обоих случаях сохраняется.',restart:true,
 ctl:[['m1','Масса синей, кг',1,10,1,2],['m2','Масса оранжевой, кг',1,10,1,2],['v','Скорость синей, м/с',1,6,0.5,3],['e','Удар: 0 — неупругий, 1 — упругий',0,1,1,0]],
 calc:function(p){var M=p.m1+p.m2;return p.e?{u1:(p.m1-p.m2)/M*p.v,u2:2*p.m1/M*p.v}:{u1:p.m1*p.v/M,u2:p.m1*p.v/M};},
 info:function(p){var q=this.calc(p);return 'До удара p = '+fx(p.m1*p.v,1)+' кг·м/с · после: синяя '+fx(q.u1,2)+' м/с, оранжевая '+fx(q.u2,2)+' м/с · p = '+fx(p.m1*q.u1+p.m2*q.u2,1)+' кг·м/с';},
 draw:function(c,w,h,p,t,k){
  var q=this.calc(p),sc=26,gap=(w/2-80),tc=gap/(p.v*sc),tt=t%(tc+4),y=170,b1=24+p.m1*3,b2=24+p.m2*3,x1,x2;
  if(tt<tc){x1=30+p.v*sc*tt;x2=w/2;}else{var d=tt-tc;x1=w/2-60+q.u1*sc*d;x2=w/2+q.u2*sc*d;}
  c.strokeStyle=k.ink;c.lineWidth=2;c.beginPath();c.moveTo(10,y);c.lineTo(w-10,y);c.stroke();
  c.fillStyle=k.acc;c.fillRect(x1,y-b1,60,b1);c.fillStyle=k.warm;c.fillRect(Math.min(x2,w-70),y-b2,60,b2);
  labTxt(c,p.e?'упругий удар':'неупругий удар',w/2,40,k.muted,'center');
 }};
LABS['phys-circular']={title:'движение по окружности',hint:'Скорость направлена по касательной, а центростремительное ускорение — к центру: a = v² / R. Увеличьте скорость вдвое — ускорение вырастет вчетверо.',
 ctl:[['v','Скорость, м/с',1,10,0.5,4],['R','Радиус, м',1,5,0.5,3]],
 info:function(p){return 'a = v² / R = '+fx(p.v*p.v/p.R,2)+' м/с² · период T = 2πR / v = '+fx(2*Math.PI*p.R/p.v,2)+' с';},
 draw:function(c,w,h,p,t,k){
  var cx=w/2,cy=130,r=20+p.R*20,ang=p.v/p.R*t,x=cx+r*Math.cos(ang),y=cy+r*Math.sin(ang);
  c.strokeStyle=k.line;c.lineWidth=1;c.setLineDash([4,4]);c.beginPath();c.arc(cx,cy,r,0,6.2832);c.stroke();c.setLineDash([]);
  c.fillStyle=k.ink;c.beginPath();c.arc(cx,cy,3,0,6.2832);c.fill();
  vArrow(c,x,y,-Math.sin(ang)*p.v*8,Math.cos(ang)*p.v*8,k.acc,'v');
  var a=Math.min(60,p.v*p.v/p.R*4);vArrow(c,x,y,(cx-x)/r*a,(cy-y)/r*a,k.warm,'a');
  c.fillStyle=k.acc;c.beginPath();c.arc(x,y,9,0,6.2832);c.fill();
 }};
LABS['phys-energy-law']={title:'падение и закон сохранения энергии',hint:'Шар падает без сопротивления воздуха. Потенциальная энергия m·g·h переходит в кинетическую m·v²/2, а их сумма остаётся постоянной.',restart:true,
 ctl:[['h','Высота, м',1,20,1,10],['m','Масса, кг',0.5,5,0.5,1]],
 info:function(p,t){var T=Math.sqrt(2*p.h/9.8),tt=Math.min(t%(T+1),T),y=p.h-9.8*tt*tt/2,v=9.8*tt;return 'Eп = '+fx(p.m*9.8*y,1)+' Дж · Eк = '+fx(p.m*v*v/2,1)+' Дж · сумма '+fx(p.m*9.8*p.h,1)+' Дж · v = '+fx(v,1)+' м/с';},
 draw:function(c,w,h,p,t,k){
  var T=Math.sqrt(2*p.h/9.8),tt=Math.min(t%(T+1),T),y=p.h-9.8*tt*tt/2,top=20,bot=230,gy=bot-(bot-top)*y/20,E=p.m*9.8*p.h,Ep=p.m*9.8*y;
  c.strokeStyle=k.ink;c.lineWidth=2;c.beginPath();c.moveTo(20,bot+9);c.lineTo(w/2+40,bot+9);c.stroke();
  c.fillStyle=k.acc;c.beginPath();c.arc(w/4,gy,9,0,6.2832);c.fill();
  labTxt(c,'h = '+fx(y,1)+' м',w/4+16,gy+4,k.muted);
  var bx=w/2+70,bw=26,H=180;
  [[Ep,k.warm,'Eп'],[E-Ep,k.acc,'Eк'],[E,k.good,'Σ']].forEach(function(b,i){var hh=H*b[0]/E;c.fillStyle=b[1];c.fillRect(bx+i*40,bot-hh,bw,hh);labTxt(c,b[2],bx+i*40+bw/2,bot+22,k.ink,'center');});
 }};
LABS['phys-gravity']={title:'спутник на орбите',hint:'Чем выше орбита, тем медленнее летит спутник и тем дольше его период. Высота 400 км — МКС, 35 800 км — геостационарная орбита (период сутки).',
 ctl:[['h','Высота орбиты, тыс. км',0.2,40,0.2,0.4]],
 calc:function(p){var GM=3.986e14,r=6.371e6+p.h*1e6;return {v:Math.sqrt(GM/r),T:2*Math.PI*Math.sqrt(r*r*r/GM),r:r};},
 info:function(p){var q=this.calc(p);return 'v = √(GM / r) = '+fx(q.v/1000,2)+' км/с · период '+(q.T<36000?fx(q.T/60,0)+' мин':fx(q.T/3600,1)+' ч');},
 draw:function(c,w,h,p,t,k){
  var q=this.calc(p),cx=w/2,cy=130,R=26,rr=R+(Math.log(q.r/6.371e6)/Math.log(7.4))*90,ang=t*2*Math.PI/(q.T/600);
  c.fillStyle='#3d7bd8';c.beginPath();c.arc(cx,cy,R,0,6.2832);c.fill();
  c.strokeStyle=k.line;c.setLineDash([3,4]);c.beginPath();c.arc(cx,cy,rr,0,6.2832);c.stroke();c.setLineDash([]);
  var x=cx+rr*Math.cos(ang),y=cy+rr*Math.sin(ang);c.fillStyle=k.warm;c.fillRect(x-5,y-5,10,10);
  labTxt(c,'Земля',cx,cy+R+14,k.muted,'center');
 }};
LABS['phys-circuits']={title:'лампочки последовательно и параллельно',hint:'Две одинаковые лампочки подключены к источнику. Последовательно они делят напряжение и горят тускло, параллельно каждая получает всё напряжение и горит ярче.',
 ctl:[['mode','Соединение: 0 — последовательно, 1 — параллельно',0,1,1,0],['U','Напряжение, В',1,24,1,12],['R','Сопротивление лампы, Ом',2,20,1,6]],
 calc:function(p){var Rt=p.mode?p.R/2:2*p.R,I=p.U/Rt,Ul=p.mode?p.U:p.U/2;return {Rt:Rt,I:I,P:Ul*Ul/p.R};},
 info:function(p){var q=this.calc(p);return 'Общее сопротивление '+fx(q.Rt,1)+' Ом · ток в цепи '+fx(q.I,2)+' А · мощность каждой лампы '+fx(q.P,1)+' Вт';},
 draw:function(c,w,h,p,t,k){
  var q=this.calc(p),gl=Math.min(1,q.P/40),x0=50,x1=w-50,y0=50,y1=210;
  c.strokeStyle=k.ink;c.lineWidth=2;
  function bulb(x,y){c.fillStyle='rgba(255,210,60,'+(0.15+0.85*gl)+')';c.beginPath();c.arc(x,y,16+gl*8,0,6.2832);c.fill();c.strokeStyle=k.ink;c.beginPath();c.arc(x,y,12,0,6.2832);c.stroke();}
  c.beginPath();c.moveTo(x0,y1);c.lineTo(x0,y0);c.lineTo(x1,y0);c.lineTo(x1,y1);c.lineTo(x0,y1);c.stroke();
  if(p.mode){c.beginPath();c.moveTo(w/2-40,y0);c.lineTo(w/2-40,y1);c.moveTo(w/2+40,y0);c.lineTo(w/2+40,y1);c.stroke();bulb(w/2-40,130);bulb(w/2+40,130);}
  else{bulb(w/2-50,y0);bulb(w/2+50,y0);}
  c.fillStyle=k.bg;c.fillRect(x0-10,y1-12,20,24);c.strokeStyle=k.ink;c.lineWidth=3;c.beginPath();c.moveTo(x0-10,y1-6);c.lineTo(x0+10,y1-6);c.stroke();c.lineWidth=5;c.beginPath();c.moveTo(x0-5,y1+5);c.lineTo(x0+5,y1+5);c.stroke();
  labTxt(c,p.mode?'параллельно':'последовательно',w/2,y1+26,k.muted,'center');
 }};
LABS['phys-heat']={title:'нагревание воды',hint:'Нагреватель передаёт воде энергию Q = P · t, и её температура растёт: Δt = Q / (c · m). Время ускорено: 1 секунда на экране — 1 минута опыта. У 100 °C вода закипает, и температура перестаёт расти.',restart:true,
 ctl:[['P','Мощность нагревателя, Вт',200,2000,100,1000],['m','Масса воды, кг',0.2,3,0.1,1]],
 calc:function(p,t){var T=20+p.P*t*60/(4200*p.m);return {T:Math.min(100,T),boil:T>=100,tb:80*4200*p.m/p.P/60};},
 info:function(p,t){var q=this.calc(p,t);return 'Прошло '+fx(t,0)+' мин · температура '+fx(q.T,0)+' °C · закипит через '+fx(q.tb,1)+' мин'+(q.boil?' · вода кипит':'');},
 draw:function(c,w,h,p,t,k){
  var q=this.calc(p,t),bx=40,by=60,bw=110,bh=150,lvl=bh*(0.35+p.m/3*0.55);
  c.strokeStyle=k.ink;c.lineWidth=2;c.strokeRect(bx,by,bw,bh);
  c.fillStyle='rgba(80,140,255,0.35)';c.fillRect(bx,by+bh-lvl,bw,lvl);
  var r=(q.T-20)/80;c.fillStyle='rgba(255,90,60,'+(0.1+r*0.5)+')';c.fillRect(bx,by+bh-lvl,bw,lvl);
  if(q.boil)for(var i=0;i<10;i++){var yy=by+bh-((t*60+i*37)%lvl);c.strokeStyle='#fff';c.beginPath();c.arc(bx+10+((i*29)%(bw-20)),yy,3,0,6.2832);c.stroke();}
  c.fillStyle=k.warm;c.fillRect(bx-6,by+bh,bw+12,10);
  var pts=[],tm=Math.max(q.tb*1.4,t+1);for(var j=0;j<=40;j++){var tj=t*j/40;pts.push([tj,Math.min(100,20+p.P*tj*60/(4200*p.m))]);}
  miniGraph(c,bx+bw+40,40,w-bx-bw-70,170,pts,tm,110,k.warm,k,'время, мин','°C');
 }};
LABS['phys-melting']={title:'кривая нагревания льда',hint:'Лёд при −20 °C нагревают с постоянной мощностью. На графике две «полочки»: во время плавления (0 °C) и кипения (100 °C) температура не меняется — энергия уходит на разрушение связей между частицами.',restart:true,
 ctl:[['P','Мощность нагревателя, Вт',500,3000,100,1500],['m','Масса льда, кг',0.2,2,0.1,0.5]],
 stages:function(p){var m=p.m,s=60;return [2100*m*20/p.P/s,340000*m/p.P/s,4200*m*100/p.P/s,2300000*m/p.P/s];},
 at:function(p,tm){var S=this.stages(p),a=S[0],b=a+S[1],c2=b+S[2],d=c2+S[3];
  if(tm<a)return [-20+20*tm/a,'нагревается лёд'];if(tm<b)return [0,'лёд плавится'];if(tm<c2)return [100*(tm-b)/S[2],'нагревается вода'];if(tm<d)return [100,'вода кипит'];return [100,'вся вода выкипела'];},
 info:function(p,t){var S=this.stages(p),tot=S[0]+S[1]+S[2]+S[3],tm=Math.min(t,tot),r=this.at(p,tm);return 'Время '+fx(tm,1)+' мин · '+fx(r[0],0)+' °C · '+r[1];},
 draw:function(c,w,h,p,t,k){
  var S=this.stages(p),tot=S[0]+S[1]+S[2]+S[3],tm=Math.min(t,tot),pts=[],self=this,gx=40,gy=30,gw=w-70,gh=190;
  for(var i=0;i<=120;i++){var ti=tm*i/120;pts.push([ti,self.at(p,ti)[0]+25]);}
  miniGraph(c,gx,gy,gw,gh,pts,Math.max(tm*1.1,S[0]+S[1]*0.5),130,k.warm,k,'время, мин','t, °C');
  [[0,'0 °C'],[100,'100 °C']].forEach(function(L){var yy=gy+gh-(L[0]+25)/130*gh;c.setLineDash([3,4]);c.strokeStyle=k.line;c.beginPath();c.moveTo(gx,yy);c.lineTo(gx+gw,yy);c.stroke();c.setLineDash([]);labTxt(c,L[1],gx+gw-4,yy-4,k.muted,'right');});
 }};
LABS['phys-magnet']={title:'магнитное поле и компасы',hint:'Вокруг магнита расставлены компасы. Их стрелки показывают направление линий поля: снаружи магнита — от северного полюса N к южному S. Поверните магнит.',
 ctl:[['a','Поворот магнита, °',0,360,5,0]],
 info:function(p){return 'Стрелки компасов поворачиваются вдоль линий поля. Ближе к полюсам поле сильнее, стрелки ярче.';},
 draw:function(c,w,h,p,t,k){
  var cx=w/2,cy=130,a=p.a*Math.PI/180,mx=Math.cos(a),my=Math.sin(a),i,j;
  for(i=0;i<9;i++)for(j=0;j<5;j++){
    var x=cx+(i-4)*Math.max(36,w/10),y=cy+(j-2)*48,dx=x-cx,dy=y-cy,r=Math.sqrt(dx*dx+dy*dy);if(r<60)continue;
    var ux=dx/r,uy=dy/r,dot=mx*ux+my*uy,bx=3*dot*ux-mx,by=3*dot*uy-my,bl=Math.sqrt(bx*bx+by*by)||1;bx/=bl;by/=bl;
    var s=Math.min(1,3000/(r*r*r)*40);
    c.globalAlpha=0.35+0.65*s;c.strokeStyle='#d84a4a';c.lineWidth=3;c.beginPath();c.moveTo(x,y);c.lineTo(x+bx*11,y+by*11);c.stroke();
    c.strokeStyle=k.muted;c.beginPath();c.moveTo(x,y);c.lineTo(x-bx*11,y-by*11);c.stroke();c.globalAlpha=1;
  }
  c.save();c.translate(cx,cy);c.rotate(a);c.fillStyle='#d84a4a';c.fillRect(0,-12,44,24);c.fillStyle='#3d7bd8';c.fillRect(-44,-12,44,24);
  c.fillStyle='#fff';c.font='bold 13px sans-serif';c.textAlign='center';c.fillText('N',26,5);c.fillText('S',-26,5);c.textAlign='left';c.restore();
 }};
LABS['phys-induction']={title:'магнит в катушке',hint:'Когда магнит движется внутри катушки, магнитный поток меняется, и возникает ток индукции. Чем быстрее движение и больше витков, тем сильнее отклоняется стрелка. Магнит стоит — тока нет.',
 ctl:[['w','Скорость движения магнита',0,4,0.5,1.5],['N','Число витков',50,500,50,200]],
 info:function(p,t){var e=p.N*p.w*Math.cos(p.w*t)/100;return 'ЭДС индукции пропорциональна N · ΔΦ / Δt · сейчас ≈ '+fx(e,2)+' (усл. ед.) · знак меняется, когда магнит меняет направление';},
 draw:function(c,w,h,p,t,k){
  var cx=w/2-40,cy=110,x=cx-80+70*Math.sin(p.w*t),e=p.N*p.w*Math.cos(p.w*t)/100,i,n=Math.round(p.N/50)+3;
  for(i=0;i<n;i++){c.strokeStyle='#c98a3b';c.lineWidth=3;c.beginPath();c.ellipse(cx+i*10-n*5,cy,6,30,0,0,6.2832);c.stroke();}
  c.fillStyle='#d84a4a';c.fillRect(x-30,cy-10,30,20);c.fillStyle='#3d7bd8';c.fillRect(x-60,cy-10,30,20);
  var gx=w-90,gy=200;c.strokeStyle=k.ink;c.lineWidth=2;c.beginPath();c.arc(gx,gy,44,Math.PI,2*Math.PI);c.stroke();
  var ang=-Math.PI/2+Math.max(-1.3,Math.min(1.3,e/5));c.strokeStyle='#d84a4a';c.beginPath();c.moveTo(gx,gy);c.lineTo(gx+40*Math.cos(ang),gy+40*Math.sin(ang));c.stroke();
  labTxt(c,'гальванометр',gx,gy+18,k.muted,'center');
  c.strokeStyle=k.line;c.lineWidth=1.5;c.beginPath();c.moveTo(cx+n*5,cy+30);c.lineTo(gx-44,gy);c.moveTo(cx-n*5,cy+30);c.lineTo(cx-n*5,gy+30);c.lineTo(gx+44,gy+30);c.lineTo(gx+44,gy);c.stroke();
 }};
LABS['phys-coulomb']={title:'взаимодействие зарядов',hint:'Одноимённые заряды отталкиваются, разноимённые притягиваются. По закону Кулона F = k · |q₁ · q₂| / r²: увеличьте расстояние вдвое — сила уменьшится вчетверо.',
 ctl:[['q1','Заряд 1, мкКл',-5,5,1,3],['q2','Заряд 2, мкКл',-5,5,1,-2],['r','Расстояние, см',5,50,1,20]],
 info:function(p){var F=9e9*Math.abs(p.q1*p.q2)*1e-12/Math.pow(p.r/100,2);return (p.q1*p.q2===0?'Один из зарядов равен нулю — взаимодействия нет':'F = k·|q₁·q₂| / r² = '+fx(F,2)+' Н · '+(p.q1*p.q2>0?'отталкиваются':'притягиваются'));},
 draw:function(c,w,h,p,t,k){
  var cx=w/2,d=40+p.r*(w-160)/50/2,cy=120,x1=cx-d,x2=cx+d,F=Math.abs(p.q1*p.q2)/Math.pow(p.r/20,2),L=Math.min(90,F*4),s=p.q1*p.q2>0?-1:1;
  [[x1,p.q1],[x2,p.q2]].forEach(function(z){c.fillStyle=z[1]>0?'#d84a4a':z[1]<0?'#3d7bd8':k.muted;c.beginPath();c.arc(z[0],cy,14+Math.abs(z[1])*2,0,6.2832);c.fill();c.fillStyle='#fff';c.font='bold 16px sans-serif';c.textAlign='center';c.fillText(z[1]>0?'+':z[1]<0?'−':'0',z[0],cy+6);c.textAlign='left';});
  if(p.q1*p.q2!==0){hArrow(c,x1,cy+44,s*L,k.ink,'F');hArrow(c,x2,cy+44,-s*L,k.ink,'F');}
  c.strokeStyle=k.line;c.setLineDash([3,3]);c.beginPath();c.moveTo(x1,cy+80);c.lineTo(x2,cy+80);c.stroke();c.setLineDash([]);labTxt(c,'r = '+p.r+' см',cx,cy+96,k.muted,'center');
 }};
LABS['phys-capacitor']={title:'зарядка конденсатора',hint:'Конденсатор заряжается через резистор от батареи 10 В. Напряжение растёт быстро, а потом всё медленнее. Время τ = R · C показывает, как долго идёт зарядка: за 5τ конденсатор почти полностью заряжен.',restart:true,
 ctl:[['R','Сопротивление, кОм',1,10,1,4],['C','Ёмкость, мкФ',100,1000,50,500]],
 info:function(p,t){var tau=p.R*p.C/1000,u=10*(1-Math.exp(-(t%(5*tau+1))/tau));return 'τ = R·C = '+fx(tau,1)+' с · напряжение на конденсаторе '+fx(u,2)+' В';},
 draw:function(c,w,h,p,t,k){
  var tau=p.R*p.C/1000,tt=t%(5*tau+1),u=10*(1-Math.exp(-tt/tau)),x=60,y=60,n=Math.round(u*2),i;

  var ty=30+180-10*(1-Math.exp(-1))/11*180;c.setLineDash([3,4]);c.strokeStyle=k.line;c.beginPath();c.moveTo(150+(w-180)*tau/(5*tau+1),30);c.lineTo(150+(w-180)*tau/(5*tau+1),210);c.stroke();c.setLineDash([]);labTxt(c,'τ',150+(w-180)*tau/(5*tau+1)+4,ty,k.muted);
 }};
LABS['phys-photoeffect']={title:'фотоэффект',hint:'Свет падает на металл. Электроны вылетают, только если энергия фотона E = h·ν больше работы выхода A. Яркость света меняет число электронов, а их скорость зависит только от частоты.',
 ctl:[['l','Длина волны света, нм',200,700,10,400],['A','Работа выхода, эВ',1.5,5,0.1,2.3],['I','Яркость',1,10,1,5]],
 calc:function(p){var E=1240/p.l;return {E:E,K:E-p.A};},
 info:function(p){var q=this.calc(p);return 'E фотона = '+fx(q.E,2)+' эВ · '+(q.K>0?'электроны вылетают, Eк = E − A = '+fx(q.K,2)+' эВ':'E < A — фотоэффекта нет, сколько ни увеличивай яркость');},
 draw:function(c,w,h,p,t,k){

 }};
LABS['phys-em-waves']={title:'длина волны и цвет',hint:'Видимый свет — электромагнитные волны длиной примерно от 380 до 750 нм. Короче — ультрафиолет, длиннее — инфракрасное излучение. Частота ν = c / λ.',
 ctl:[['l','Длина волны, нм',100,1000,10,550]],
 info:function(p){var nu=3e8/(p.l*1e-9);return 'λ = '+p.l+' нм · ν = c / λ = '+fx(nu/1e14,2)+'·10¹⁴ Гц · '+(p.l<380?'ультрафиолет (невидим)':p.l>750?'инфракрасное излучение (невидимо)':'видимый свет');},
 draw:function(c,w,h,p,t,k){

  var sx=20,sw=w-40;for(i=0;i<sw;i++){var nm=100+900*i/sw;c.fillStyle=nm<380?'#2b2340':nm>750?'#3a2020':wlColor(nm);c.fillRect(sx+i,180,1,26);}
  var mx=sx+sw*(p.l-100)/900;c.fillStyle=k.ink;c.beginPath();c.moveTo(mx,176);c.lineTo(mx-6,166);c.lineTo(mx+6,166);c.fill();

 }};
LABS['phys-bohr']={title:'атом водорода: переходы электрона',hint:'Электрон переходит с верхнего уровня n₂ на нижний n₁ и испускает фотон с энергией E = 13,6 · (1/n₁² − 1/n₂²) эВ. Переходы на второй уровень дают видимые линии серии Бальмера.',restart:true,
 ctl:[['n2','Верхний уровень n₂',2,6,1,3],['n1','Нижний уровень n₁',1,5,1,2]],
 calc:function(p){var a=Math.min(p.n1,p.n2-1),E=13.6*(1/(a*a)-1/(p.n2*p.n2));return {a:a,E:E,l:1240/E};},
 info:function(p){var q=this.calc(p);return 'Переход '+p.n2+' → '+q.a+' · E = '+fx(q.E,2)+' эВ · λ = '+fx(q.l,0)+' нм · '+(q.l<380?'ультрафиолет':q.l>750?'инфракрасный':'видимый свет');},
 draw:function(c,w,h,p,t,k){
  var q=this.calc(p),cx=110,cy=130,i,ph=t%3,n=ph<1.5?p.n2:q.a;
  c.fillStyle='#d84a4a';c.beginPath();c.arc(cx,cy,6,0,6.2832);c.fill();
  for(i=1;i<=6;i++){c.strokeStyle=i===p.n2||i===q.a?k.ink:k.line;c.lineWidth=1;c.beginPath();c.arc(cx,cy,14*i+4,0,6.2832);c.stroke();}
  var ang=t*3/n,rr=14*n+4;c.fillStyle=k.acc;c.beginPath();c.arc(cx+rr*Math.cos(ang),cy+rr*Math.sin(ang),5,0,6.2832);c.fill();
  if(ph>=1.5){var col=q.l<380?'#9b59ff':q.l>750?'#7a2b2b':wlColor(q.l),x0=cx+100,sh=(ph-1.5)*120;c.strokeStyle=col;c.lineWidth=3;c.beginPath();for(var j=0;j<60;j++){var xx=x0+sh+j*2,yy=cy+8*Math.sin(j*2*Math.PI/(q.l/40));if(j)c.lineTo(xx,yy);else c.moveTo(xx,yy);}c.stroke();labTxt(c,'фотон '+fx(q.l,0)+' нм',x0+sh+60,cy-16,col,'center');}
 }};
LABS['chem-rate']={title:'скорость реакции и столкновения частиц',hint:'Реакция идёт, когда частицы A (синие) и B (красные) сталкиваются с достаточной энергией. Нагрев ускоряет частицы, а большая концентрация делает столкновения чаще — продукт (зелёный) копится быстрее.',restart:true,
 ctl:[['T','Температура, K',250,600,10,300],['N','Частиц каждого вида',5,40,1,15]],
 sim:function(p,t,w,h){
  var key=p.T+'|'+p.N+'|'+w;
  if(!this.s||this.s.key!==key||t<this.s.t){var a=[];for(var i=0;i<2*p.N;i++){var an=hsh(i)*6.283;a.push({x:20+hsh(i+99)*(w-40),y:20+hsh(i+199)*(h-60),vx:Math.cos(an),vy:Math.sin(an),k:i<p.N?0:1});}this.s={key:key,t:0,P:a,n:0};}
  var S=this.s,dt=Math.min(0.05,t-S.t),sp=Math.sqrt(p.T/300)*60;S.t=t;
  S.P.forEach(function(q){q.x+=q.vx*sp*dt;q.y+=q.vy*sp*dt;if(q.x<10||q.x>w-10)q.vx*=-1;if(q.y<10||q.y>h-50)q.vy*=-1;q.x=Math.max(10,Math.min(w-10,q.x));q.y=Math.max(10,Math.min(h-50,q.y));});
  var ea=Math.exp(-1200/p.T)*3;
  for(var i2=0;i2<S.P.length;i2++){var A=S.P[i2];if(A.k!==0)continue;for(var j=0;j<S.P.length;j++){var B=S.P[j];if(B.k!==1)continue;var dx=A.x-B.x,dy=A.y-B.y;if(dx*dx+dy*dy<196&&hsh(i2*31+j+Math.floor(t*10))<ea){A.k=2;B.k=3;S.n++;break;}}}
  return S;},
 info:function(p,t){var S=this.s;return 'Образовалось молекул продукта: '+(S?S.n:0)+' за '+fx(t,0)+' с · средняя скорость частиц ~√T';},
 draw:function(c,w,h,p,t,k){
  var S=this.sim(p,t,w,h);
  c.strokeStyle=k.line;c.strokeRect(4,4,w-8,h-48);
  S.P.forEach(function(q){if(q.k===3)return;c.fillStyle=q.k===0?'#3d7bd8':q.k===1?'#d84a4a':'#2fae6b';c.beginPath();c.arc(q.x,q.y,q.k===2?7:5,0,6.2832);c.fill();});
  labTxt(c,'A + B → продукт: '+S.n,10,h-22,k.ink);
 }};
LABS['chem-atom']={title:'электронные оболочки атома',hint:'Выберите порядковый номер элемента. Электроны заполняют оболочки по порядку: на первой не больше 2, на второй — 8, на третьей (для первых 20 элементов) — 8. Число электронов на внешнем слое определяет химические свойства.',
 ctl:[['Z','Порядковый номер Z',1,20,1,11]],
 EL:['H','He','Li','Be','B','C','N','O','F','Ne','Na','Mg','Al','Si','P','S','Cl','Ar','K','Ca'],
 sh:function(Z){var c=[2,8,8,2],o=[],r=Z;for(var i=0;i<4&&r>0;i++){var x=Math.min(c[i],r);o.push(x);r-=x;}return o;},
 info:function(p){var s=this.sh(p.Z);return this.EL[p.Z-1]+': Z = '+p.Z+', протонов '+p.Z+', электронов '+p.Z+' · схема '+s.join(', ')+' · на внешнем слое '+s[s.length-1];},
 draw:function(c,w,h,p,t,k){
  var s=this.sh(p.Z),cx=w/2,cy=130,i,j;
  c.fillStyle='#d84a4a';c.beginPath();c.arc(cx,cy,16,0,6.2832);c.fill();c.fillStyle='#fff';c.font='bold 13px sans-serif';c.textAlign='center';c.fillText(this.EL[p.Z-1],cx,cy+5);c.textAlign='left';
  for(i=0;i<s.length;i++){var r=34+i*26;c.strokeStyle=k.line;c.lineWidth=1;c.beginPath();c.arc(cx,cy,r,0,6.2832);c.stroke();
    for(j=0;j<s[i];j++){var a=j/s[i]*6.283+t*(0.8-i*0.15);c.fillStyle=k.acc;c.beginPath();c.arc(cx+r*Math.cos(a),cy+r*Math.sin(a),4.5,0,6.2832);c.fill();}}
 }};
LABS['chem-electrolysis']={title:'электролиз раствора CuCl₂',hint:'При подключении тока ионы меди Cu²⁺ идут к катоду (−) и оседают на нём медью, а ионы Cl⁻ идут к аноду (+) и выделяются хлором. Чем больше напряжение, тем быстрее движутся ионы.',restart:true,
 ctl:[['U','Напряжение, В',0,12,1,6]],
 info:function(p,t){return p.U?'На катоде осело меди (усл. ед.): '+fx(p.U*t/10,1)+' · на аноде выделяется хлор':'Ток выключен — ионы движутся хаотично';},
 draw:function(c,w,h,p,t,k){
  var x0=30,x1=w-30,top=30,bot=220,i;
  c.fillStyle='rgba(60,140,220,0.18)';c.fillRect(x0,top+20,x1-x0,bot-top-20);c.strokeStyle=k.ink;c.lineWidth=2;c.strokeRect(x0,top,x1-x0,bot-top);
  var dep=Math.min(16,p.U*t/10);c.fillStyle='#c98a3b';c.fillRect(x0+20,top+10,12+dep,bot-top-30);c.fillStyle=k.ink;c.fillRect(x1-32,top+10,12,bot-top-30);
  labTxt(c,'катод −',x0+26,top+4,k.ink,'center');labTxt(c,'анод +',x1-26,top+4,k.ink,'center');
  for(i=0;i<14;i++){var fx0=hsh(i),fy=hsh(i+40),L=x1-x0-90,drift=p.U*t*6,pos;
    pos=(fx0*L-drift*(1))%L;if(pos<0)pos+=L;c.fillStyle='#3d7bd8';c.beginPath();c.arc(x0+50+pos,top+40+fy*(bot-top-60),6,0,6.2832);c.fill();
    pos=(hsh(i+80)*L+drift)%L;c.fillStyle='#2fae6b';c.beginPath();c.arc(x0+50+pos,top+40+hsh(i+120)*(bot-top-60),4,0,6.2832);c.fill();}
  labTxt(c,'● Cu²⁺',x0+50,bot+18,'#3d7bd8');labTxt(c,'● Cl⁻',x0+120,bot+18,'#2fae6b');
 }};
LABS['bio-populations']={title:'рост популяции',hint:'Сначала популяция растёт почти экспоненциально, но ресурсы ограничены, и рост замедляется у ёмкости среды K. Получается S-образная (логистическая) кривая.',restart:true,

 info:function(p,t){var tm=t*2;return 'Через '+fx(tm,0)+' лет численность '+fx(this.N(p,tm),0)+' из '+p.K+' возможных';},

 }};
LABS['bio-photosynthesis']={title:'фотосинтез: пузырьки кислорода',hint:'Водное растение на свету выделяет кислород — его видно по пузырькам. Чем ярче свет и больше CO₂, тем быстрее фотосинтез, но до предела: тогда скорость ограничивает другой фактор.',
 ctl:[['L','Освещённость, %',0,100,5,60],['C','Углекислый газ, %',0,100,5,50]],
 rate:function(p){return 30*Math.min(p.L/100,p.C/100*1.2+0.05)*(1-Math.exp(-3*p.L/100));},
 info:function(p){return 'Скорость фотосинтеза ≈ '+fx(this.rate(p),0)+' пузырьков в минуту'+(p.L===0?' · в темноте фотосинтеза нет':'');},
